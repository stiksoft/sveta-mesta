<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1330">
<meta name="description" content="Vaiṣṇavska kviz-igra romanja po svetih mestih Indije do Vṛndāvane.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sveta mesta">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Sveta mesta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one-screen pilgrimage — a real photograph of the holy place fills the stage, a lamp-lit card floats over it; header carries players' tilaka scores. Single dark śyāma world. */
:root{
  --night:#0D1330; --night2:#17204A; --panel:rgba(13,19,48,.9);
  --gold:#E9B84E; --saffron:#EE7F2D; --tulasi:#5DA77A; --candana:#F4E5BC;
  --muted:#C9CDE6; --line:rgba(233,184,78,.28); --bad:#E58A7A;
  --f-display:"Tiro Devanagari Sanskrit","Noto Serif",Georgia,serif;
  --f-body:"Noto Sans","Segoe UI","DejaVu Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--night);color:var(--candana);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
@supports (height:100dvh){#app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
header{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;flex:none;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--night);position:relative;z-index:5}
.brand{font-family:var(--f-display);font-size:20px;color:var(--gold);letter-spacing:.02em;margin-right:auto;flex:none;white-space:nowrap;background:none;border:0;padding:0}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.players{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;min-width:0;flex:0 1 auto;scrollbar-width:none}
.players::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pchip.on{border-color:var(--gold);color:var(--candana);background:rgba(233,184,78,.1)}
.pchip b{color:var(--gold)}
.pchip .fire{color:var(--saffron);font-size:12px}
.tilaka{width:14px;height:19px;flex:none}
main{flex:1;position:relative;min-height:0}
/* photographic stage */
.scene{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 25%,#2a2f6e 0%,var(--night2) 45%,var(--night) 100%)}
.bgph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;animation:kb 28s ease-in-out infinite alternate;transform-origin:50% 40%;max-width:none}
.bgph.in{opacity:1}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(13,19,48,.45) 0%,rgba(13,19,48,.06) 30%,rgba(13,19,48,.25) 55%,rgba(13,19,48,.95) 100%),radial-gradient(ellipse at center,transparent 55%,rgba(13,19,48,.55) 100%)}
.frame{position:absolute;inset:10px;border:1px solid rgba(233,184,78,.35);border-radius:6px;pointer-events:none}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
.stagewrap{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;justify-content:flex-start;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stagewrap>.card{margin-top:auto;flex:none}
.stagewrap.center>.card{margin-block:auto}
.card{position:relative;width:100%;max-width:760px;margin-inline:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:14px;min-width:0}
.card.wide{max-width:1000px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--saffron);font-weight:700}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;color:var(--candana)}
h1{font-size:clamp(34px,7vw,56px);line-height:1.05;color:var(--gold)}
h2{font-size:clamp(24px,4.5vw,32px);line-height:1.15}
h3{font-size:20px;color:var(--gold)}
p{margin:0;max-width:65ch}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search]{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;color:var(--candana);font:inherit;font-size:17px;padding:11px 14px}
input::placeholder{color:#7f86a8}
.btn{background:var(--gold);color:var(--night);border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--candana);border:1px solid var(--line);font-weight:600}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.src{font-size:13px;color:var(--muted);font-style:italic}
.prog{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--gold))}
.mantra{font-family:var(--f-display);font-size:clamp(13px,3.6vw,22px);line-height:1.7;color:var(--gold);text-align:center}
.ml{display:block;white-space:nowrap}
.chant{font-size:clamp(11px,3.2vw,14px);color:var(--muted);text-align:center;line-height:1.6;margin:0}
/* question */
.place-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.place-head .where{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.place-head .where:hover .loc{color:var(--gold)}
.loc{font-size:13px;color:var(--muted);max-width:170px}
.loc u{text-decoration-color:rgba(233,184,78,.5)}
.minimap{width:92px;height:auto;flex:none}
.q{font-size:19px;line-height:1.45;max-width:62ch}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.35;transition:background .2s,border-color .2s}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(233,184,78,.08)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font-weight:700;font-size:14px}
.opt.right{border-color:var(--tulasi);background:rgba(93,167,122,.18)}
.opt.right .k{background:var(--tulasi);border-color:var(--tulasi);color:var(--night)}
.opt.wrong{border-color:var(--bad);background:rgba(229,138,122,.14)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--night)}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:rgba(93,167,122,.16);border:1px solid rgba(93,167,122,.5)}
.fb.no{background:rgba(229,138,122,.12);border:1px solid rgba(229,138,122,.45)}
.fb strong{font-size:17px}
.streak{font-size:13px;color:var(--saffron);font-weight:600}
/* stages */
.stages{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.st{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.st .dot{width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.st.done .dot{background:var(--tulasi);border-color:var(--tulasi);color:var(--night)}
.st.now{border-color:var(--gold);background:rgba(233,184,78,.08)}
.st.now .dot{background:var(--gold);border-color:var(--gold);color:var(--night)}
.st.main .nm{color:var(--gold)}
.st .nm{font-weight:600;font-size:15px;line-height:1.25}
.st .sb{font-size:12px;color:var(--muted);line-height:1.3}
.intro{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:16px;align-items:center}
@media (max-width:520px){.intro{grid-template-columns:110px 1fr;gap:12px}}
.ladder{display:flex;gap:4px;flex-wrap:wrap}
.ladder span{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ladder span.reached{color:var(--candana);border-color:rgba(93,167,122,.6)}
.ladder span.cur{background:var(--gold);color:var(--night);border-color:var(--gold);font-weight:700}
/* golden arch photo frame */
.arch{position:relative;flex:none;aspect-ratio:3/4;max-width:100%;border-radius:999px 999px 8px 8px;overflow:hidden;border:2px solid rgba(233,184,78,.85);box-shadow:0 0 0 4px rgba(13,19,48,.55),0 0 0 5px rgba(233,184,78,.35),0 10px 30px rgba(0,0,0,.45);background:radial-gradient(ellipse at 50% 30%,#3a3a7a,var(--night2) 70%)}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s;max-width:none}
.arch img.in{opacity:1}
.arch b{position:absolute;left:0;right:0;bottom:0;padding:16px 4px 6px;text-align:center;font-family:var(--f-display);font-weight:400;font-size:clamp(10px,1.1vw,13px);line-height:1.15;color:var(--candana);background:linear-gradient(180deg,transparent,rgba(13,19,48,.92))}
.arch.lg b{font-size:13px}
/* start */
:root{--a1:clamp(80px,9vw,130px);--a2:clamp(60px,6.5vw,96px);--p1t:14px;--p2t:calc(var(--p1t) + var(--a1)*4/3 + 14px)}
.stagewrap.start{padding-top:calc(var(--p2t) + var(--a2)*4/3 + 20px)}
.stagewrap.start>.card{background:rgba(13,19,48,.82)}
.hero{position:absolute;inset:0;overflow:hidden}
.hero .tint{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 30%,rgba(238,127,45,.28),transparent 70%),linear-gradient(180deg,rgba(13,19,48,.5) 0%,rgba(23,32,74,.25) 40%,rgba(13,19,48,.95) 88%)}
.mandala{position:absolute;left:50%;top:26%;width:min(110vw,820px);height:auto;transform:translate(-50%,-50%);animation:spin 160s linear infinite;opacity:.5;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.procession{position:absolute;left:0;right:0;overflow:hidden;pointer-events:none}
.procession.p1{top:var(--p1t)}
.procession.p2{top:var(--p2t);opacity:.85}
.track{display:flex;gap:clamp(12px,2vw,22px);width:max-content;animation:drift 90s linear infinite}
.p2 .track{animation-duration:120s;animation-direction:reverse}
@keyframes drift{to{transform:translateX(-50%)}}
.track .arch{width:var(--a1)}
.p2 .track .arch{width:var(--a2)}
.hero .fade-b{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,transparent,var(--night))}
.setup-players{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.rules ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px;color:var(--muted)}
.rules b{color:var(--candana)}
/* dedication */
.ded{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:26px;align-items:center}
.ded .arch{width:100%}
.ded blockquote{margin:0;font-family:var(--f-display);font-size:clamp(19px,2.6vw,25px);line-height:1.5;color:var(--candana);text-wrap:balance}
.ded blockquote em{color:var(--gold);font-style:normal}
@media (max-width:600px){.ded{grid-template-columns:1fr;justify-items:center;text-align:center}.ded .arch{width:min(220px,70vw)}}
/* mantra builder */
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media (max-width:560px){.slots{grid-template-columns:repeat(4,minmax(0,1fr))}}
.slot{min-height:38px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;color:var(--gold);padding:2px}
.slot.f{border-style:solid;background:rgba(233,184,78,.08)}
.slot.bad{border-color:var(--bad);color:var(--bad)}
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.word{font-family:var(--f-display);font-size:22px;padding:12px 6px;border-radius:12px;border:1px solid var(--gold);background:rgba(233,184,78,.1);color:var(--gold)}
.word:hover:not(:disabled){background:rgba(233,184,78,.2)}
/* ranking, gallery */
.rank{display:grid;gap:8px}
.rank .r{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-variant-numeric:tabular-nums}
.rank .r.first{border-color:var(--gold);background:rgba(233,184,78,.1)}
.rank .pos{font-family:var(--f-display);font-size:22px;color:var(--gold);width:24px}
.rank .nm{flex:1;min-width:0}
.rank .pts{display:flex;align-items:center;gap:6px;font-size:20px;color:var(--gold);font-weight:700}
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.thumb{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.2);min-width:0;padding:0;text-align:left;display:block;width:100%}
.thumb:hover{border-color:var(--gold)}
.thumb .ph{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#3a3a7a,var(--night2) 70%)}
.thumb .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .8s;max-width:none}
.thumb .ph img.in{opacity:1}
.thumb .no{position:absolute;top:6px;left:6px;z-index:2;background:var(--gold);color:var(--night);font-weight:700;font-size:12px;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.thumb .cap{padding:8px 10px;display:grid;gap:2px}
.thumb b{font-size:13px;line-height:1.25;color:var(--candana);font-weight:600}
.thumb small{font-size:11.5px;line-height:1.3;color:var(--muted)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:420px;margin-inline:auto;width:100%}
/* svg maps */
.bigmap{width:100%;max-width:520px;margin:0 auto;display:block;height:auto}
.bigmap [data-k]{cursor:pointer}
.mapwrap{display:flex;flex-direction:column;gap:6px;align-items:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
@keyframes pulse{0%{r:4;opacity:.9}100%{r:14;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
/* atlas */
.atlas{position:fixed;inset:0;z-index:50;background:rgba(8,11,30,.94);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.atlas-top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.atlas-top h2{font-size:22px;margin-right:auto}
.atlasbox{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);min-height:0;flex:1}
.atlasbox.inline{height:min(78vh,640px);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.amap{position:relative;min-height:0;background:var(--night)}
.amap .svgfb{position:absolute;inset:0;display:grid;place-items:center;padding:12px;overflow:auto}
.amap .svgfb svg{max-height:100%;width:auto;max-width:100%}
.apanel{overflow-y:auto;min-height:0;padding:16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:rgba(13,19,48,.96)}
@media (max-width:760px){.atlasbox{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1.1fr)}.apanel{border-left:0;border-top:1px solid var(--line)}.atlasbox.inline{height:min(130vh,980px)}}
.apanel .hero-ph{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 30%,#3a3a7a,var(--night2) 70%);flex:none}
.apanel .hero-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s;max-width:none}
.apanel .hero-ph img.in{opacity:1}
.album{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.album button{flex:none;width:96px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);padding:0;position:relative;background:var(--night2)}
.album button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.album img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.chips button.on{border-color:var(--gold);color:var(--night);background:var(--gold)}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(5,7,20,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px}
.lightbox p{color:var(--muted);font-size:14px;text-align:center}
/* leaflet essentials (inline) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;height:100%;width:100%;background:#0a0e24;outline:0;-webkit-tap-highlight-color:transparent;font-family:var(--f-body)}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px}
.leaflet-tile{user-select:none;-webkit-user-drag:none;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane svg{z-index:200}.leaflet-map-pane canvas{z-index:100}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-interactive{cursor:pointer}
.leaflet-pane>svg path.leaflet-interactive{pointer-events:visiblePainted;pointer-events:auto}
.leaflet-touch-drag{touch-action:none}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}

 varsana:["Śrī Rādhā (Lāḍlī-jī) v templju Śrījī na hribu Brahmā.","Śrī Rādhā (Lāḍlī-jī) in the Śrījī temple on Brahmā Hill."],

 nathdwara:{n:["Nāthdvārā – Śrīnāthjī","Nāthdvārā – Śrīnāthjī"],loc:["okrožje Rajsamand, Radžastan","Rajsamand district, Rajasthan"],ll:[24.9318,73.8186],q:"Shrinathji Nathdwara",cat:['Shrinathji','Nathdwara'],img:[['Shrinathji_Swaroop.png','Śrīnāthjī','Śrīnāthjī']],

 jaipur:{n:["Jaipur – Govindadeva in Gopīnātha","Jaipur – Govindadeva and Gopīnātha"],loc:["Jaipur, Radžastan","Jaipur, Rajasthan"],ll:[26.9294,75.8238],q:"Govind Dev Ji temple Jaipur",cat:['Govind_Dev_Ji_Temple'],img:[['Govind_dev_ji.jpg','Tempelj Govindadeve v Jaipurju','Govindadeva temple, Jaipur'],['Shri_Radha_Gopinath_Ji_Temple_Jaipur.jpg','Tempelj Rādhā-Gopīnātha v Jaipurju','Rādhā-Gopīnātha temple, Jaipur']],
  d:["V Jaipurju sta danes dve od treh glavnih Božanstev Vṛndāvane, Govinda in Gopīnātha. V 17. stoletju so ju zaradi napadov vojske cesarja Aurangzeba umaknili iz Vṛndāvane v Radžastan.","Jaipur is now home to two of the three main Deities of Vṛndāvana, Govinda and Gopīnātha. In the 17th century They were moved from Vṛndāvana to Rajasthan because of attacks by Emperor Aurangzeb's army."],
  dei:["Śrī Śrī Rādhā-Govindadeva, ki ga je odkril Śrīla Rūpa Gosvāmī, v templju v vrtu mestne palače; Śrī Śrī Rādhā-Gopīnātha v starem delu mesta.","Śrī Śrī Rādhā-Govindadeva, discovered by Śrīla Rūpa Gosvāmī, in the temple in the City Palace garden; Śrī Śrī Rādhā-Gopīnātha in the old city."]},
 karauli:{n:["Karauli – Madana-mohana","Karauli – Madana-mohana"],loc:["Karauli, Radžastan","Karauli, Rajasthan"],ll:[26.4983,77.0213],q:"Madan Mohan temple Karauli",cat:[],img:[['Madanmohan_Mandir_Vrindavan.JPG','Izvirni tempelj Madana-mohana v Vṛndāvanu','The original Madana-mohana temple in Vṛndāvana']],

 guruvayur:{n:["Guruvāyūr – Kṛṣṇa","Guruvāyūr – Kṛṣṇa"],loc:["okrožje Thrissur, Kerala","Thrissur district, Kerala"],ll:[10.5946,76.0390],q:"Guruvayur temple",cat:['Guruvayur_Temple'],img:[['Guruvayur-temple-east-1200x980.jpg','Vzhodni vhod templja v Guruvāyūrju','East entrance of the Guruvāyūr temple'],['SreeKrishnaTemple,Guruvayur.JPG','Tempelj Śrī Kṛṣṇe v Guruvāyūrju','Śrī Kṛṣṇa temple, Guruvāyūr']],
  d:["Imenujejo ga »Dvārakā juga«. Po izročilu sta Božanstvo, ki sta ga v Dvāraki častila Vasudeva in Devakī, po potopitvi Dvārake v Kerali vzpostavila Guru (Bṛhaspati) in Vāyu; od tod ime Guru-vāyu-ūr.","Called “the Dvārakā of the South”. By tradition, after Dvārakā sank, the Deity once worshiped there by Vasudeva and Devakī was installed in Kerala by Guru (Bṛhaspati) and Vāyu; hence the name Guru-vāyu-ūr."],
  dei:["Guruvāyūrappan: štiriročni Kṛṣṇa s školjko, diskom, buzdovanom in lotosom, v obliki, v kateri se je pojavil Vasudevi in Devakī.","Guruvāyūrappan: four-armed Kṛṣṇa with conch, disc, club and lotus, in the form in which He appeared to Vasudeva and Devakī."]},
 pandharpur:{n:["Paṇḍharpur – Viṭhṭhala","Paṇḍharpur – Viṭhṭhala"],loc:["ob reki Bhīmā (Candrabhāgā), Maharaštra","on the Bhīmā (Candrabhāgā) River, Maharashtra"],ll:[17.6669,75.3302],q:"Vithoba temple Pandharpur",cat:['Vithoba_Temple,_Pandharpur'],img:[],

   "Śrī Caitanya je prišel v Tirupati in Tirumalo, kjer je videl štiriročno Božanstvo, nato pa je odšel na hrib Veṅkaṭa.",
   "On which hills does the temple of Śrī Veṅkaṭeśvara (Bālājī) stand?",["The Veṅkaṭa hills (Tirumala)","Govardhana Hill","Aruṇācala Hill"],
   "Śrī Caitanya came to Tirupati and Tirumala, where He saw a four-handed Deity, and then went on to Veṅkaṭa Hill."],
  ['tirumala',['lokacija danes','location today'],
   "V kateri zvezni državi danes leži Tirumala (Tirupati)?",["Andhra Pradeš","Tamil Nadu","Karnataka"],
   "Tirumala leži v Andhra Pradešu in je eden najbolj obiskanih templjev na svetu.",
   "In which Indian state does Tirumala (Tirupati) lie today?",["Andhra Pradesh","Tamil Nadu","Karnataka"],
   "Tirumala is in Andhra Pradesh and is one of the most visited temples in the world."],
  ['tirumala',['izročilo templja','temple tradition'],
   "Kateri obliki Gospoda pravijo Bālājī?",["Śrī Veṅkaṭeśvari, obliki Gospoda Viṣṇuja","Gospodu Śivi","Gospodu Gaṇeśi"],
   "Śrī Veṅkaṭeśvara ali Bālājī je štiriročna oblika Gospoda Viṣṇuja, čaščena skupaj z boginjo Lakṣmī.",
   "Which form of the Lord is called Bālājī?",["Śrī Veṅkaṭeśvara, a form of Lord Viṣṇu","Lord Śiva","Lord Gaṇeśa"],
   "Śrī Veṅkaṭeśvara, or Bālājī, is a four-handed form of Lord Viṣṇu, worshiped together with Goddess Lakṣmī."],
  ['ahobilam',[CC+', Madhya 9.16',CC+', Madhya 9.16'],
   "Kateri inkarnaciji Gospoda so posvečeni templji Ahobilama?",["Gospodu Narasiṁhi","Gospodu Vāmani","Gospodu Paraśurāmi"],
   "Ahobilam ima devet templjev Gospoda Narasiṁhe. Caitanya-caritāmṛta pravi, da je Mahāprabhu na potovanju po jugu obiskal Ahovala-nṛsiṁho.",
   "To which incarnation of the Lord are the temples of Ahobilam dedicated?",["Lord Narasiṁha","Lord Vāmana","Lord Paraśurāma"],
   "Ahobilam has nine temples of Lord Narasiṁha. The Caitanya-caritāmṛta says that on His tour of the South, Mahāprabhu visited Ahovala-nṛsiṁha."],
  ['ahobilam',[SB+' 7.5–7.10',SB+' 7.5–7.10'],
   "Katerega petletnega bhakto, sina demona Hiraṇyakaśipuja, je zaščitil Gospod Narasiṁha?",["Prahlādo Mahārāja","Dhruvo Mahārāja","Bali Mahārāja"],
   "Prahlāda je kljub mučenju ostal zvest Gospodu in sošolce učil vdanega služenja. Narasiṁha je ubil Hiraṇyakaśipuja, Prahlāda pa ga je pomiril s svojimi molitvami.",
   "Which five-year-old devotee, the son of the demon Hiraṇyakaśipu, did Lord Narasiṁha protect?",["Prahlāda Mahārāja","Dhruva Mahārāja","Bali Mahārāja"],
   "Despite being tortured, Prahlāda stayed faithful to the Lord and taught his classmates devotional service. Narasiṁha killed Hiraṇyakaśipu, and Prahlāda pacified Him with his prayers."],
  ['ahobilam',[SB+' 7.8',SB+' 7.8'],
   "Iz česa se je Gospod Narasiṁha prikazal, da bi zaščitil Prahlādo?",["Iz stebra v palači","Iz ognja žrtvovanja","Iz oceana"],
   "Hiraṇyakaśipu je udaril po stebru in vprašal, ali je Gospod tudi v njem. Iz stebra se je prikazal Gospod Narasiṁha.",
   "From what did Lord Narasiṁha appear to protect Prahlāda?",["A pillar in the palace","The sacrificial fire","The ocean"],
   "Hiraṇyakaśipu struck a pillar and asked whether the Lord was in it too. Lord Narasiṁha came out of that pillar."],
  ['srirangam',[CC+', Madhya 9',CC+', Madhya 9'],
   "Kako se imenuje Božanstvo Viṣṇuja v Śrī Raṅgamu, ki počiva na kači Ananti?",["Śrī Raṅganātha","Śrī Jagannātha","Śrī Veṅkaṭeśvara"],
   "Śrī Raṅgam je največji tempelj Viṣṇuja v Indiji. Mahāprabhu je ob pogledu na Raṅganātho plesal v zanosu.",
   "What is the name of the Deity of Viṣṇu at Śrī Raṅgam who reclines on the serpent Ananta?",["Śrī Raṅganātha","Śrī Jagannātha","Śrī Veṅkaṭeśvara"],
   "Śrī Raṅgam is the largest Viṣṇu temple in India. Seeing Raṅganātha, Mahāprabhu danced in ecstasy."],
  ['srirangam',[CC+', Ādi 10.105 (razlaga); Madhya 9.86',CC+', Ādi 10.105 (purport); Madhya 9.86'],
   "Kateri sin Veṅkaṭe Bhaṭṭe iz Śrī Raṅgama je kasneje postal eden od šestih Gosvāmījev Vṛndāvane?",["Gopāla Bhaṭṭa Gosvāmī","Raghunātha Bhaṭṭa Gosvāmī","Jīva Gosvāmī"],
   "Mahāprabhu je štiri mesece cāturmāsye bival v hiši Veṅkaṭe Bhaṭṭe. Njegov sin Gopāla Bhaṭṭa je kasneje v Vṛndāvanu vzpostavil Božanstvo Rādhā-ramaṇa.",
   "Which son of Veṅkaṭa Bhaṭṭa of Śrī Raṅgam later became one of the Six Gosvāmīs of Vṛndāvana?",["Gopāla Bhaṭṭa Gosvāmī","Raghunātha Bhaṭṭa Gosvāmī","Jīva Gosvāmī"],
   "Mahāprabhu stayed four months of Cāturmāsya at the house of Veṅkaṭa Bhaṭṭa. His son Gopāla Bhaṭṭa later installed the Rādhā-ramaṇa Deity in Vṛndāvana."],
  ['srirangam',[CC+', Madhya 9.93–103',CC+', Madhya 9.93–103'],
   "Zakaj je brāhmaṇa v Śrī Raṅgamu v zanosu bral Bhagavad-gīto, čeprav besed ni izgovarjal pravilno?",["Ker je v srcu videl Kṛṣṇo kot Arjunovega voznika","Ker je dobro poznal sanskrt","Ker so ga za to plačali"],
   "Ljudje so se mu smejali, on pa je jokal in drhtel. Mahāprabhuju je povedal, da med branjem vidi Kṛṣṇo kot voznika Arjunovega voza. Mahāprabhu ga je objel in rekel, da je dosegel pravi namen branja Gīte.",
   "Why did a brāhmaṇa at Śrī Raṅgam read the Bhagavad-gītā in ecstasy, though he could not pronounce the words correctly?",["Because in his heart he saw Kṛṣṇa as Arjuna's chariot driver","Because he knew Sanskrit well","Because he was paid to read"],
   "People laughed at him, but he wept and trembled. He told Mahāprabhu that while reading he saw Kṛṣṇa as Arjuna's chariot driver. Mahāprabhu embraced him and said he had achieved the real purpose of reading the Gītā."],
  ['srirangam',[CC+', Madhya 9.86',CC+', Madhya 9.86'],
   "Koliko časa je Mahāprabhu ostal v Śrī Raṅgamu v času cāturmāsye?",["Štiri mesece","Štiri tedne","Eno leto"],
   "Veṅkaṭa Bhaṭṭa je Mahāprabhuja prosil, naj ostane pri njem med cāturmāsyo, in Gospod je štiri mesece bival v njegovi hiši.",
   "How long did Mahāprabhu stay at Śrī Raṅgam during Cāturmāsya?",["Four months","Four weeks","One year"],
   "Veṅkaṭa Bhaṭṭa asked Mahāprabhu to stay with him for Cāturmāsya, and the Lord remained at his house for four months."],
  ['udupi',[CC+', Madhya 9.245 (razlaga)',CC+', Madhya 9.245 (purport)'],
   "Kateri ācārya je v Uḍupīju vzpostavil Božanstvo Kṛṣṇe?",["Śrī Madhvācārya","Śrī Rāmānujācārya","Śrī Viṣṇusvāmī"],
   "Madhvācārya, ustanovitelj Brahma-Madhva sampradāye, iz katere izhaja tudi Mahāprabhujeva linija, je v Uḍupīju vzpostavil Božanstvo Kṛṣṇe. Mahāprabhu je ob pogledu nanj zblaznel od zanosa.",
   "Which ācārya installed the Deity of Kṛṣṇa at Uḍupī?",["Śrī Madhvācārya","Śrī Rāmānujācārya","Śrī Viṣṇusvāmī"],
   "Madhvācārya, the founder of the Brahma-Madhva sampradāya to which Mahāprabhu's line also belongs, installed the Deity of Kṛṣṇa at Uḍupī. Seeing Him, Mahāprabhu became mad with ecstasy."],
  ['udupi',[CC+', Madhya 9.245 (razlaga)',CC+', Madhya 9.245 (purport)'],
   "V čem je bilo skrito Božanstvo Kṛṣṇe, ki ga je Madhvācārya prejel z ladje?",["V veliki kepi gopī-candane","V zlati skrinji","V lotosovem cvetu"],
   "Madhvācārya je z obale rešil ladjo, ki je plula proti Dvāraki. Za plačilo je želel le nekaj gopī-candane. Ko so mu prinesli veliko kepo, se je ta razlomila in v njej je bilo Božanstvo Kṛṣṇe.",
   "Inside what was the Deity of Kṛṣṇa hidden that Madhvācārya received from a ship?",["A big lump of gopī-candana","A golden chest","A lotus flower"],
   "From the shore Madhvācārya saved a ship bound for Dvārakā. As a gift he accepted only some gopī-candana. When the big lump was brought, it broke apart and revealed the Deity of Kṛṣṇa."],
  ['udupi',[CC+', Madhya 9.245 (razlaga)',CC+', Madhya 9.245 (purport)'],
   "Kaj drži Božanstvo Kṛṣṇe v Uḍupīju v rokah?",["V eni roki palico, v drugi kepico hrane","Piščal","Lok in puščice"],
   "Prabhupāda v razlagi opisuje, da ima Božanstvo v eni roki palico, v drugi pa kepico hrane.",
   "What does the Deity of Kṛṣṇa at Uḍupī hold in His hands?",["A stick in one hand and a lump of food in the other","A flute","A bow and arrows"],
   "In his purport Prabhupāda describes that the Deity has a stick in one hand and a lump of food in the other."]

 /* 3 Dežele dharme / Lands of dharma */ [
  ['naimisa',[SB+' 1.1',SB+' 1.1'],
   "Kdo je modrecem v gozdu Naimiṣāraṇya pripovedoval Śrīmad-Bhāgavatam?",["Sūta Gosvāmī","Śukadeva Gosvāmī","Nārada Muni"],
   "Sūta Gosvāmī je Bhāgavatam slišal od Śukadeve Gosvāmīja, ko ga je ta govoril Mahārāju Parīkṣitu. Nato ga je ponovil modrecem v Naimiṣāraṇyi.",
   "Who narrated the Śrīmad-Bhāgavatam to the sages in the forest of Naimiṣāraṇya?",["Sūta Gosvāmī","Śukadeva Gosvāmī","Nārada Muni"],
   "Sūta Gosvāmī heard the Bhāgavatam from Śukadeva Gosvāmī when he spoke it to Mahārāja Parīkṣit, and then repeated it to the sages at Naimiṣāraṇya."],
  ['naimisa',[SB+' 1.1',SB+' 1.1'],
   "Kdo je vodil modrece v Naimiṣāraṇyi in Sūti Gosvāmīju postavil vprašanja?",["Śaunaka Ṛṣi","Vasiṣṭha Muni","Vyāsadeva"],
   "Śaunaka in drugi modreci so Sūti postavili šest vprašanj, na katera odgovarja ves Bhāgavatam.",
   "Who led the sages at Naimiṣāraṇya and put questions to Sūta Gosvāmī?",["Śaunaka Ṛṣi","Vasiṣṭha Muni","Vyāsadeva"],
   "Śaunaka and the other sages asked Sūta six questions, which the whole Bhāgavatam answers."],
  ['naimisa',[SB+' 1.1.4',SB+' 1.1.4'],
   "Koliko časa naj bi trajalo žrtvovanje modrecev v Naimiṣāraṇyi?",["Tisoč let","Sedem dni","Eno leto"],
   "Modreci so začeli žrtvovanje, ki naj bi trajalo tisoč let. Vprašali so, kaj je najbolj koristno za ljudi Kali-yuge.",
   "How long was the sacrifice of the sages at Naimiṣāraṇya meant to last?",["A thousand years","Seven days","One year"],
   "The sages began a sacrifice meant to last a thousand years. They asked what is most beneficial for the people of Kali-yuga."],
  ['ayodhya',[SB+' 9.10',SB+' 9.10'],
   "Kateri avatar se je kot sin kralja Daśarathe pojavil v Ayodhyi?",["Gospod Rāmacandra","Gospod Paraśurāma","Gospod Balarāma"],
   "Gospod Rāma, idealni kralj, se je pojavil v Ayodhyi. Njegovo ime je del Hare Kṛṣṇa mahā-mantre.",
   "Which avatāra appeared in Ayodhyā as the son of King Daśaratha?",["Lord Rāmacandra","Lord Paraśurāma","Lord Balarāma"],
   "Lord Rāma, the ideal king, appeared in Ayodhyā. His name is part of the Hare Kṛṣṇa mahā-mantra."],
  ['ayodhya',[SB+' 9.10',SB+' 9.10'],
   "Koliko let je Gospod Rāma po očetovi obljubi preživel v gozdu?",["Štirinajst","Sedem","Dvanajst"],
   "Da bi očetova beseda ostala resnična, je Rāma s Sīto in Lakṣmaṇo štirinajst let živel v gozdu, nato pa se je zmagoslavno vrnil v Ayodhyo.",
   "How many years did Lord Rāma spend in the forest to keep His father's promise?",["Fourteen","Seven","Twelve"],
   "To keep His father's word, Rāma lived in the forest with Sītā and Lakṣmaṇa for fourteen years and then returned triumphantly to Ayodhyā."],
  ['ayodhya',[SB+' 9.10',SB+' 9.10'],
   "Kdo je večna soproga Gospoda Rāme?",["Sītā-devī","Rukmiṇī-devī","Draupadī"],
   "Sītā-devī je večna soproga Gospoda Rāmacandre, Hanumān pa njun predani služabnik.",
   "Who is the eternal consort of Lord Rāma?",["Sītā-devī","Rukmiṇī-devī","Draupadī"],
   "Sītā-devī is the eternal consort of Lord Rāmacandra, and Hanumān is their devoted servant."],
  ['kuruksetra',['Bhagavad-gītā 1.1','Bhagavad-gītā 1.1'],
   "Komu je Kṛṣṇa na bojišču Kurukṣetra govoril Bhagavad-gīto?",["Arjuni","Bhīmi","Yudhiṣṭhiri"],
   "Gītā se začne z besedami dharma-kṣetre kuru-kṣetre. Kṛṣṇa kot voznik Arjunovega voza uči predanosti Sebi.",
   "To whom did Kṛṣṇa speak the Bhagavad-gītā on the battlefield of Kurukṣetra?",["Arjuna","Bhīma","Yudhiṣṭhira"],
   "The Gītā begins with the words dharma-kṣetre kuru-kṣetre. As Arjuna's chariot driver, Kṛṣṇa teaches surrender to Himself."],
  ['kuruksetra',[SB+' 10.82; '+CC+', Madhya 13',SB+' 10.82; '+CC+', Madhya 13'],
   "Ob katerem nebesnem dogodku so se gopīje in drugi Vrajavāsīji zopet srečali s Kṛṣṇo na Kurukṣetri?",["Ob sončnem mrku","Ob luninem mrku","Ob polni luni meseca Kārtika"],
   "Ob sončnem mrku so se vsi zbrali na Kurukṣetri. Gopīje so si želele Kṛṣṇo odpeljati nazaj v Vṛndāvano. V tem razpoloženju je Mahāprabhu plesal na Ratha-yātri.",
   "On the occasion of which celestial event did the gopīs and other Vrajavāsīs meet Kṛṣṇa again at Kurukṣetra?",["A solar eclipse","A lunar eclipse","The full moon of Kārtika"],
   "Everyone gathered at Kurukṣetra for a solar eclipse. The gopīs longed to take Kṛṣṇa back to Vṛndāvana. Mahāprabhu danced at Ratha-yātrā in this same mood."],
  ['kuruksetra',['Bhagavad-gītā 1.21–24','Bhagavad-gītā 1.21–24'],
   "Katero vlogo je Kṛṣṇa prevzel v bitki na Kurukṣetri?",["Voznik Arjunovega voza","Poveljnik vojske Pāṇḍavov","Sodnik bitke"],
   "Kṛṣṇa je obljubil, da ne bo prijel orožja, in postal voznik Arjunovega voza (Pārtha-sārathi).",
   "What role did Kṛṣṇa take in the battle of Kurukṣetra?",["Arjuna's chariot driver","Commander of the Pāṇḍava army","Judge of the battle"],
   "Kṛṣṇa promised not to take up weapons and became Arjuna's chariot driver (Pārtha-sārathi)."],
  ['kuruksetra',['Bhagavad-gītā 18.66','Bhagavad-gītā 18.66'],
   "Kateri verz Bhagavad-gīte se glasi: »Zapusti vse vrste religije in se samo predaj Meni«?",["Bhagavad-gītā 18.66","Bhagavad-gītā 2.13","Bhagavad-gītā 4.7"],
   "Sarva-dharmān parityajya mām ekaṁ śaraṇaṁ vraja. Predanost Kṛṣṇi je sklep vseh naukov Gīte.",
   "Which verse of the Bhagavad-gītā says: “Abandon all varieties of religion and just surrender unto Me”?",["Bhagavad-gītā 18.66","Bhagavad-gītā 2.13","Bhagavad-gītā 4.7"],
   "Sarva-dharmān parityajya mām ekaṁ śaraṇaṁ vraja. Surrender to Kṛṣṇa is the conclusion of all the Gītā's teachings."],
  ['dvaraka',[SB+' 10.52–54',SB+' 10.52–54'],
   "Katera je prva med Kṛṣṇovimi kraljicami v Dvāraki?",["Rukmiṇī-devī","Satyabhāmā","Jāmbavatī"],
   "Rukmiṇī je Kṛṣṇi po brāhmaṇi poslala pismo. Kṛṣṇa je prišel in jo tik pred poroko s Śiśupālo odpeljal v Dvārako.",
   "Who is the first among Kṛṣṇa's queens in Dvārakā?",["Rukmiṇī-devī","Satyabhāmā","Jāmbavatī"],
   "Rukmiṇī sent Kṛṣṇa a letter through a brāhmaṇa. Kṛṣṇa came and carried her off to Dvārakā just before her marriage to Śiśupāla."],
  ['dvaraka',[SB+' 10.80–81',SB+' 10.80–81'],
   "Kaj je revni brāhmaṇa Sudāmā prinesel kot darilo svojemu prijatelju Kṛṣṇi v Dvāraki?",["Peščico sploščenega riža","Košaro sadja","Venec cvetja"],
   "Kṛṣṇa je z veseljem pojedel skromno darilo, prijatelju pa je brez njegove prošnje podaril vse bogastvo.",
   "What did the poor brāhmaṇa Sudāmā bring as a gift to his friend Kṛṣṇa in Dvārakā?",["A handful of flat rice","A basket of fruit","A flower garland"],
   "Kṛṣṇa happily ate the humble gift and, without being asked, gave His friend all opulence."],
  ['dvaraka',[SB+' 10.50',SB+' 10.50'],
   "Kdo je po Kṛṣṇovem naročilu zgradil Dvārako sredi morja?",["Viśvakarmā","Maya Dānava","Hanumān"],
   "Da bi zaščitil Yaduje, je Kṛṣṇa dal zgraditi trdnjavo sredi morja. Zgradil jo je nebeški arhitekt Viśvakarmā.",
   "Who built Dvārakā in the middle of the sea on Kṛṣṇa's order?",["Viśvakarmā","Maya Dānava","Hanumān"],
   "To protect the Yadus, Kṛṣṇa had a fortress built in the sea. It was built by the celestial architect Viśvakarmā."],
  ['dvaraka',[SB+' 10.59; Kṛṣṇa',SB+' 10.59; Kṛṣṇa'],
   "Koliko kraljic je imel Kṛṣṇa v Dvāraki?",["16.108","108","1.008"],
   "Kṛṣṇa je osvobodil 16.100 princes, ki jih je ujel Bhaumāsura, in se z vsemi poročil. Skupaj z osmimi glavnimi kraljicami jih je bilo 16.108.",
   "How many queens did Kṛṣṇa have in Dvārakā?",["16,108","108","1,008"],
   "Kṛṣṇa freed 16,100 princesses held captive by Bhaumāsura and married them all. Together with His eight principal queens there were 16,108."]
 ],
 /* 4 Navadvīpa-dhāma */ [
  ['mayapur',[CC+', Ādi 13.89–93',CC+', Ādi 13.89–93'],
   "Ob katerem nebesnem dogodku se je pojavil Śrī Caitanya Mahāprabhu?",["Ob luninem mrku","Ob sončnem mrku","Ob mlaju"],
   "Mahāprabhu se je pojavil leta 1486 ob polni luni meseca Phālguna med luninim mrkom. Vsi ljudje so takrat peli Hare Kṛṣṇa mahā-mantro.",
   "During which celestial event did Śrī Caitanya Mahāprabhu appear?",["A lunar eclipse","A solar eclipse","The new moon"],
   "Mahāprabhu appeared in 1486 on the full-moon evening of Phālguna, during a lunar eclipse. At that time everyone was chanting the Hare Kṛṣṇa mahā-mantra."],
  ['mayapur',[SB+', Uvod; '+CC+', Ādi 13.117',SB+', Introduction; '+CC+', Ādi 13.117'],

   "Beneath which tree did Śrī Caitanya appear, which is why He was called Nimāi?",["A nimba (neem) tree","A kadamba tree","A bakula tree"],
   "In the Introduction to the Bhāgavatam Prabhupāda writes that the Lord appeared beneath a nimba tree in the courtyard of His father's house. The Caitanya-caritāmṛta adds that His mother also gave Him the name Nimāi to protect Him from ghosts."],
  ['mayapur',[CC+', Ādi 13',CC+', Ādi 13'],
   "Kako je ime Caitanyini materi?",["Śacī-devī","Yaśodā","Viṣṇupriyā"],
   "Śacī-devī in Jagannātha Miśra sta bila Gospodova starša. Śacī je Nimāija vzgajala z neizmerno ljubeznijo.",
   "What was the name of Śrī Caitanya's mother?",["Śacī-devī","Yaśodā","Viṣṇupriyā"],
   "Śacī-devī and Jagannātha Miśra were the Lord's parents. Śacī raised Nimāi with boundless love."],
  ['navadvip',[CC+', Ādi 3',CC+', Ādi 3'],
   "Kateri bhakta je z Gaṅgino vodo in listi tulasī klical Gospoda, naj se prikaže in reši ljudi Kali-yuge?",["Advaita Ācārya","Śrīvāsa Ṭhākura","Haridāsa Ṭhākura"],
   "Advaita Ācārya je videl, da ljudje nimajo vdanosti, zato je Gospoda častil z Gaṅgino vodo in tulasī ter ga s klici priklical na Zemljo.",
   "Which devotee worshiped the Lord with Gaṅgā water and tulasī leaves, calling Him to appear and deliver the people of Kali-yuga?",["Advaita Ācārya","Śrīvāsa Ṭhākura","Haridāsa Ṭhākura"],
   "Advaita Ācārya saw that people had no devotion, so he worshiped the Lord with Gaṅgā water and tulasī and called Him down to earth."],
  ['navadvip',[CC+', Ādi 17.34–35',CC+', Ādi 17.34–35'],
   "V čigavi hiši je Mahāprabhu z bhaktami leto dni vsako noč pel kīrtana?",["V hiši Śrīvāse Ṭhākure","V hiši Advaite Ācārye","V hiši Murārija Gupte"],
   "Leto dni je Mahāprabhu z bhaktami vsako noč pel Hare Kṛṣṇa mahā-mantro v hiši Śrīvāse Ṭhākure. Vrata so bila zaprta, da ne bi motili posmehljivci.",
   "In whose house did Mahāprabhu chant kīrtana with His devotees every night for a whole year?",["Śrīvāsa Ṭhākura's house","Advaita Ācārya's house","Murāri Gupta's house"],
   "For one full year Mahāprabhu chanted the Hare Kṛṣṇa mahā-mantra with His devotees every night at Śrīvāsa Ṭhākura's house. The doors were kept closed against mockers."],
  ['navadvip',[CC+', Ādi 17.17',CC+', Ādi 17.17'],
   "Kako sta se imenovala brata, ki ju je Gospod odrešil, čeprav je eden od njiju Nityānando udaril?",["Jagāi in Mādhāi","Rūpa in Sanātana","Gopāla in Govinda"],
   "Mādhāi je Nityānando udaril s črepinjo, Nityānanda pa je kljub temu prosil za njuno milost. Oba brata sta postala bhakti.",
   "What were the names of the two brothers the Lord delivered, though one of them struck Nityānanda?",["Jagāi and Mādhāi","Rūpa and Sanātana","Gopāla and Govinda"],
   "Mādhāi struck Nityānanda with a piece of earthen pot, yet Nityānanda still begged mercy for them. Both brothers became devotees."],
  ['navadvip',[CC+', Ādi 17.124–222; '+SB+', Uvod',CC+', Ādi 17.124–222; '+SB+', Introduction'],
   "Katerega muslimanskega sodnika, ki je prepovedal kīrtana, je Mahāprabhu pridobil z mogočno procesijo petja?",["Cānd Kāzīja","Husena Šaha","Bijlī Khāna"],
   "Kāzī je razbil mṛdaṅgo in prepovedal kīrtana na ulicah. Mahāprabhu je pred njegovo hišo pripeljal procesijo sto tisoč ljudi z mṛdaṅgami in karatālami. Kāzī je nato rekel, da saṅkīrtane ne sme nihče več ovirati.",
   "Which Muslim magistrate, who had forbidden kīrtana, did Mahāprabhu win over with a mighty chanting procession?",["Chand Kazi (Cānd Kāzī)","Hussain Shah","Bijli Khan"],
   "The Kazi broke a mṛdaṅga and banned street kīrtana. Mahāprabhu led a procession of a hundred thousand people with mṛdaṅgas and karatālas to his house. The Kazi then declared that no one should check the saṅkīrtana movement."],
  ['navadvip',[SB+', Uvod; '+CC+', Ādi 17.268–272',SB+', Introduction; '+CC+', Ādi 17.268–272'],
   "Koliko let je bil Śrī Caitanya star, ko je sprejel sannyāsa?",["Ob koncu 24. leta","30 let","18 let"],
   "Ob koncu svojega 24. leta, v mesecu Māgha, je Mahāprabhu v Kāṭwi sprejel sannyāsa od Keśave Bhāratīja, da bi lahko pridigal vsem.",
   "How old was Śrī Caitanya when He accepted sannyāsa?",["At the end of His 24th year","30 years","18 years"],
   "At the end of His twenty-fourth year, in the month of Māgha, Mahāprabhu accepted sannyāsa from Keśava Bhāratī at Katwa, so that He could preach to everyone."],
  ['mayapur',['Prabhupādove razlage '+CC+'; zgodovina Gauḍīya vaiṣṇavizma',"Prabhupāda's purports to "+CC+'; Gauḍīya Vaiṣṇava history'],
   "Kdo je odkril točen kraj pojavitve Śrī Caitanye v Māyāpurju?",["Śrīla Bhaktivinoda Ṭhākura","Śrīla Narottama dāsa Ṭhākura","Śrīla Jīva Gosvāmī"],
   "Bhaktivinoda Ṭhākura je leta 1888 odkril Yogapīṭho, kraj Mahāprabhujeve pojavitve. Potrdil ga je Jagannātha dāsa Bābājī.",
   "Who discovered the exact birthplace of Śrī Caitanya in Māyāpur?",["Śrīla Bhaktivinoda Ṭhākura","Śrīla Narottama dāsa Ṭhākura","Śrīla Jīva Gosvāmī"],
   "In 1888 Bhaktivinoda Ṭhākura discovered the Yogapīṭha, the place of Mahāprabhu's appearance. Jagannātha dāsa Bābājī confirmed it."],
  ['mayapur',['zgodovina Gauḍīya vaiṣṇavizma','Gauḍīya Vaiṣṇava history'],
   "Kateri starejši vaiṣṇava je kraj pojavitve potrdil tako, da je skočil iz koša in v zanosu zaplesal?",["Jagannātha dāsa Bābājī","Gaura-kiśora dāsa Bābājī","Bhaktisiddhānta Sarasvatī"],
   "Jagannātha dāsa Bābājī je bil star več kot sto let in skoraj slep, zato so ga prinesli v košu. Ob prihodu na Yogapīṭho je skočil iz koša in zaplesal.",
   "Which elderly Vaiṣṇava confirmed the birthplace by jumping out of his basket and dancing in ecstasy?",["Jagannātha dāsa Bābājī","Gaura-kiśora dāsa Bābājī","Bhaktisiddhānta Sarasvatī"],
   "Jagannātha dāsa Bābājī was over a hundred years old and nearly blind, so he was carried there in a basket. On reaching the Yogapīṭha he jumped out of the basket and danced."],
  ['navadvip',['Navadvīpa-dhāma-māhātmya (Bhaktivinoda Ṭhākura)','Navadvīpa-dhāma-māhātmya (Bhaktivinoda Ṭhākura)'],
   "Koliko otokov sestavlja Navadvīpa-dhāmo?",["Devet","Sedem","Dvanajst"],
   "Navadvīpa pomeni »devet otokov«. Predstavljajo devet procesov vdanega služenja, od poslušanja (śravaṇa) do popolne predanosti (ātma-nivedana).",
   "How many islands make up Navadvīpa-dhāma?",["Nine","Seven","Twelve"],
   "Navadvīpa means “nine islands”. They represent the nine processes of devotional service, from hearing (śravaṇa) to full surrender (ātma-nivedana)."],
  ['mayapur',[CC+', Ādi 1.5',CC+', Ādi 1.5'],
   "Kdo je Śrī Caitanya Mahāprabhu po nauku Śrīle Prabhupāde?",["Kṛṣṇa sam v razpoloženju in sijaju Śrīmatī Rādhārāṇī","Velik svetnik in učenjak","Inkarnacija Gospoda Śive"],
   "Śrī Caitanya je Kṛṣṇa sam, ki je prišel z razpoloženjem in sijajem Rādhārāṇī, da bi okusil Njeno ljubezen in vsem podaril sveto ime.",
   "According to Śrīla Prabhupāda's teaching, who is Śrī Caitanya Mahāprabhu?",["Kṛṣṇa Himself in the mood and luster of Śrīmatī Rādhārāṇī","A great saint and scholar","An incarnation of Lord Śiva"],
   "Śrī Caitanya is Kṛṣṇa Himself, who came with the mood and luster of Rādhārāṇī to taste Her love and give the holy name to everyone."],
  ['navadvip',[CC+', Ādi 5',CC+', Ādi 5'],
   "Kdo je Nityānanda Prabhu?",["Balarāma, Kṛṣṇov brat","Arjuna","Nārada Muni"],
   "Nityānanda Prabhu je Balarāma, ki je prišel kot Mahāprabhujev brat in prvi spremljevalec.",
   "Who is Nityānanda Prabhu?",["Balarāma, Kṛṣṇa's brother","Arjuna","Nārada Muni"],
   "Nityānanda Prabhu is Balarāma, who came as Mahāprabhu's brother and foremost associate."],
  ['navadvip',[CC+', Ādi 16–17',CC+', Ādi 16–17'],
   "Kako so Śrī Caitanyo klicali kot mladega učenjaka v Navadvīpi?",["Nimāi Paṇḍita","Gaura Bhaṭṭa","Viśvarūpa"],
   "Kot Nimāi Paṇḍita je vodil šolo in premagal vse učenjake, nato pa je razkril, da je pomen vsega znanja Kṛṣṇa.",
   "What was Śrī Caitanya called as a young scholar in Navadvīpa?",["Nimāi Paṇḍita","Gaura Bhaṭṭa","Viśvarūpa"],
   "As Nimāi Paṇḍita He ran a school and defeated all the scholars, and then revealed that the purpose of all knowledge is Kṛṣṇa."],
  ['navadvip',[SB+', Uvod; '+CC+', Ādi 16',SB+', Introduction; '+CC+', Ādi 16'],
   "Kako je bilo ime Mahāprabhujevi drugi soprogi?",["Viṣṇupriyā-devī","Lakṣmīpriyā-devī","Sītā-devī"],
   "Mahāprabhujeva prva soproga Lakṣmīpriyā je umrla mlada, ko ga ni bilo doma. Nato se je poročil z Viṣṇupriyo-devī.",
   "What was the name of Mahāprabhu's second wife?",["Viṣṇupriyā-devī","Lakṣmīpriyā-devī","Sītā-devī"],
   "Mahāprabhu's first wife, Lakṣmīpriyā, died young while He was away. He then married Viṣṇupriyā-devī."],
  ['mayapur',['ISKCON Māyāpur','ISKCON Māyāpur'],
   "Katera Božanstva so glavna v templju ISKCON v Māyāpurju?",["Śrī Śrī Rādhā-Mādhava","Śrī Śrī Rādhā-Govinda","Śrī Śrī Rādhā-Ramaṇa"],
   "V Māyāpurju, svetovnem središču ISKCON-a, ki ga je ustanovil Śrīla Prabhupāda, so glavna Božanstva Śrī Śrī Rādhā-Mādhava.",
   "Which Deities preside over the ISKCON temple in Māyāpur?",["Śrī Śrī Rādhā-Mādhava","Śrī Śrī Rādhā-Govinda","Śrī Śrī Rādhā-Ramaṇa"],
   "In Māyāpur, the world headquarters of ISKCON founded by Śrīla Prabhupāda, the presiding Deities are Śrī Śrī Rādhā-Mādhava."]
 ],
 /* 5 Jagannātha Purī */ [
  ['puri',[CC+', Madhya 6',CC+', Madhya 6'],
   "Katera tri Božanstva so čaščena v glavnem templju v Purīju?",["Jagannātha, Baladeva in Subhadrā","Rāma, Sītā in Lakṣmaṇa","Rādhā, Kṛṣṇa in Lalitā"],
   "Gospod Jagannātha je Kṛṣṇa sam, ob njem sta Baladeva in Subhadrā.",
   "Which three Deities are worshiped in the main temple of Purī?",["Jagannātha, Baladeva and Subhadrā","Rāma, Sītā and Lakṣmaṇa","Rādhā, Kṛṣṇa and Lalitā"],
   "Lord Jagannātha is Kṛṣṇa Himself; beside Him are Baladeva and Subhadrā."],
  ['rathayatra',[CC+', Madhya 13',CC+', Madhya 13'],
   "Kako se imenuje veliki praznik, ko Božanstva na ogromnih vozovih peljejo po ulicah Purīja?",["Ratha-yātrā","Janmāṣṭamī","Gaura-pūrṇimā"],
   "Ratha pomeni voz. Mahāprabhu je pred vozom Gospoda Jagannāthe plesal v zanosu.",
   "What is the great festival called when the Deities are pulled through the streets of Purī on huge chariots?",["Ratha-yātrā","Janmāṣṭamī","Gaura-pūrṇimā"],
   "Ratha means chariot. Mahāprabhu danced in ecstasy before Lord Jagannātha's chariot."],
  ['rathayatra',[CC+', Madhya 12',CC+', Madhya 12'],
   "Do katerega templja peljejo vozove na Ratha-yātri?",["Do templja Guṇḍicā","Do templja Ṭoṭā-gopīnātha","Do templja Ālālanātha"],
   "Pred praznikom je Mahāprabhu z bhaktami očistil tempelj Guṇḍicā. To ponazarja čiščenje srca, preden Kṛṣṇa sede vanj.",
   "To which temple are the chariots pulled during Ratha-yātrā?",["The Guṇḍicā temple","The Ṭoṭā-gopīnātha temple","The Ālālanātha temple"],
   "Before the festival Mahāprabhu and His devotees cleansed the Guṇḍicā temple. This shows how the heart must be cleansed before Kṛṣṇa can sit there."],
  ['rathayatra',[CC+', Madhya 13.15; Madhya 14',CC+', Madhya 13.15; Madhya 14'],
   "Kako je kralj Pratāparudra služil Gospodu Jagannāthi na Ratha-yātri?",["Cesto je pometal z metlo z zlatim ročajem","Sam je vlekel voz","Pel je na čelu kīrtana"],
   "Kralj je cesto pred vozom ponižno pometal z metlo z zlatim ročajem. Ta služba je Mahāprabhuja razveselila, zato je kralja pozneje objel, ko je ta recitiral verze iz Gopī-gīte.",
   "How did King Pratāparudra serve Lord Jagannātha at Ratha-yātrā?",["He swept the road with a broom with a golden handle","He pulled the chariot alone","He led the kīrtana"],
   "The king humbly swept the road before the chariot with a broom that had a golden handle. This service pleased Mahāprabhu, who later embraced the king when he recited verses from the Gopī-gītā."],
  ['puri',[CC+', Madhya 6.202–203',CC+', Madhya 6.202–203'],
   "Katero obliko je Mahāprabhu najprej pokazal učenjaku Sārvabhaumi Bhaṭṭācāryi?",["Štiriročno obliko Viṣṇuja","Obliko Narasiṁhe","Obliko Vāmane"],
   "Mahāprabhu je Sārvabhaumi najprej pokazal štiriročno obliko, nato pa svojo izvirno obliko Kṛṣṇe temne polti s piščaljo na ustnicah. Sārvabhauma se mu je predal.",
   "Which form did Mahāprabhu first show the scholar Sārvabhauma Bhaṭṭācārya?",["The four-handed form of Viṣṇu","The form of Narasiṁha","The form of Vāmana"],
   "Mahāprabhu first showed Sārvabhauma His four-handed form and then His original form of Kṛṣṇa, with a blackish complexion and a flute to His lips. Sārvabhauma surrendered to Him."],
  ['gambhira',[CC+', Antya',CC+', Antya'],
   "Kateri zaupni spremljevalec je Mahāprabhuju v Purīju pel pesmi, ki so ustrezale njegovemu razpoloženju?",["Svarūpa Dāmodara Gosvāmī","Gadādhara Paṇḍita","Śivānanda Sena"],
   "Svarūpa Dāmodara in Rāya Rāmānanda sta bila ob Mahāprabhuju v njegovem najglobljem zanosu ločitve.",
   "Which confidential associate sang songs to Mahāprabhu in Purī that matched His mood?",["Svarūpa Dāmodara Gosvāmī","Gadādhara Paṇḍita","Śivānanda Sena"],
   "Svarūpa Dāmodara and Rāya Rāmānanda stayed with Mahāprabhu in His deepest ecstasy of separation."],
  ['puri',[CC+', Antya 3.100; Antya 11',CC+', Antya 3.100; Antya 11'],
   "Katerega bhakto, ki je vsak dan zapel 300.000 svetih imen, je Mahāprabhu po njegovem odhodu nosil v naročju in plesal?",["Śrīlo Haridāso Ṭhākuro","Śrīvāso Ṭhākuro","Murārija Gupto"],
   "Haridāsa Ṭhākura, nāmācārya, je odšel ob gledanju Mahāprabhujevega obraza in petju njegovega imena. Gospod je z njegovim telesom plesal in ga sam položil v pesek ob morju.",
   "Which devotee, who chanted 300,000 holy names daily, did Mahāprabhu carry in His arms and dance with after his passing?",["Śrīla Haridāsa Ṭhākura","Śrīvāsa Ṭhākura","Murāri Gupta"],
   "Haridāsa Ṭhākura, the nāmācārya, departed while looking at Mahāprabhu's face and chanting His name. The Lord danced with his body and Himself placed it in the sand by the sea."],
  ['gambhira',[CC+', Antya 14–20',CC+', Antya 14–20'],
   "Kako se imenuje sobica v hiši Kāśīja Miśre, kjer je Mahāprabhu noči preživljal v zanosu ločitve od Kṛṣṇe?",["Gambhīrā","Siddha-bakula","Narendra-sarovara"],
   "V Gambhīri je Mahāprabhu v razpoloženju Rādhārāṇī okušal ločitev od Kṛṣṇe. To je vrh njegovih zabav.",
   "What is the small room in Kāśī Miśra's house called, where Mahāprabhu spent His nights in the ecstasy of separation from Kṛṣṇa?",["The Gambhīrā","Siddha-bakula","Narendra-sarovara"],
   "In the Gambhīrā, in the mood of Rādhārāṇī, Mahāprabhu tasted separation from Kṛṣṇa. This is the summit of His pastimes."],
  ['puri',[CC+', Ādi 13.12–13',CC+', Ādi 13.12–13'],
   "Koliko zadnjih let svojih zabav je Śrī Caitanya neprekinjeno preživel v Purīju?",["Osemnajst","Dvanajst","Šest"],
   "Po sannyāsi je Mahāprabhu šest let potoval, preostalih osemnajst let pa je neprekinjeno ostal v Jagannātha Purīju.",
   "For how many final years of His pastimes did Śrī Caitanya stay continuously in Purī?",["Eighteen","Twelve","Six"],
   "After taking sannyāsa Mahāprabhu travelled for six years and then stayed continuously in Jagannātha Purī for the remaining eighteen."],
  ['puri',[CC+', Madhya 6.4–7',CC+', Madhya 6.4–7'],
   "Kaj se je zgodilo, ko je Mahāprabhu prvič zagledal Gospoda Jagannātho?",["Od ljubezni je padel v nezavest","Začel je recitirati Vede","Vrnil se je v Navadvīpo"],
   "Mahāprabhu je stekel, da bi objel Jagannātho, in od ljubezni do Boga padel v nezavest. Dolgo je ležal brez zavesti, dokler ga ni Sārvabhauma Bhaṭṭācārya odnesel na svoj dom.",
   "What happened when Mahāprabhu first saw Lord Jagannātha?",["He fainted out of love","He began reciting the Vedas","He returned to Navadvīpa"],
   "Mahāprabhu ran forward to embrace Jagannātha and fainted, overwhelmed by love of Godhead. He lay unconscious for a long time until Sārvabhauma Bhaṭṭācārya carried Him to his home."],
  ['gambhira',[CC+', Madhya 8; '+SB+', Uvod',CC+', Madhya 8; '+SB+', Introduction'],
   "Kje je Mahāprabhu prvič srečal Rāyo Rāmānando?",["Ob reki Godāvarī","V Vṛndāvanu","V Kāśīju"],
   "Ob Godāvarī sta Mahāprabhu in Rāya Rāmānanda razpravljala o najvišjih resnicah, vse do čiste ljubezni Rādhārāṇī. Kasneje je Rāmānanda živel z njim v Purīju.",
   "Where did Mahāprabhu first meet Rāya Rāmānanda?",["On the bank of the Godāvarī","In Vṛndāvana","In Kāśī"],
   "On the bank of the Godāvarī, Mahāprabhu and Rāya Rāmānanda discussed the highest truths, up to the pure love of Rādhārāṇī. Later Rāmānanda lived with Him in Purī."],
  ['puri',[CC+', Madhya 6',CC+', Madhya 6'],
   "Kako se imenuje hrana, darovana Gospodu Jagannāthi?",["Mahā-prasāda","Caraṇāmṛta","Āratī"],
   "Hrana, darovana Jagannāthi, je mahā-prasāda in ni različna od Gospoda. Mahāprabhu jo je spoštoval z veliko ljubeznijo.",
   "What is the food offered to Lord Jagannātha called?",["Mahā-prasāda","Caraṇāmṛta","Āratī"],
   "Food offered to Jagannātha is mahā-prasāda and is nondifferent from the Lord. Mahāprabhu honored it with great love."],
  ['rathayatra',[CC+', Madhya 13.48–52',CC+', Madhya 13.48–52'],
   "Koliko skupin kīrtana je Mahāprabhu organiziral na Ratha-yātri?",["Sedem","Tri","Dvanajst"],
   "Bilo je sedem skupin saṅkīrtane, v vsaki sta dva bhakti igrala na boben. Mahāprabhu je hkrati izvajal zabave v vseh sedmih skupinah.",
   "How many kīrtana parties did Mahāprabhu organize at Ratha-yātrā?",["Seven","Three","Twelve"],
   "There were seven saṅkīrtana parties, each with two drummers. Mahāprabhu performed His pastimes in all seven parties simultaneously."],
  ['puri',[CC+', Antya',CC+', Antya'],
   "Kateri bhakta je bil Mahāprabhujev osebni služabnik v Purīju?",["Govinda","Kāśī Miśra","Sārvabhauma Bhaṭṭācārya"],
   "Govinda je Mahāprabhuju služil dan in noč. Kāśī Miśra je bil gostitelj, v čigar hiši je bila Gambhīrā.",
   "Which devotee was Mahāprabhu's personal servant in Purī?",["Govinda","Kāśī Miśra","Sārvabhauma Bhaṭṭācārya"],
   "Govinda served Mahāprabhu day and night. Kāśī Miśra was the host in whose house the Gambhīrā was."],
  ['rathayatra',['Śrīla Prabhupāda-līlāmṛta','Śrīla Prabhupāda-līlāmṛta'],
   "Kdo je praznik Ratha-yātrā prvič prinesel na Zahod?",["Śrīla Prabhupāda (San Francisco, 1967)","Śrīla Jīva Gosvāmī","Śrīla Rūpa Gosvāmī"],
   "Śrīla Prabhupāda je leta 1967 v San Franciscu pripravil prvo Ratha-yātro na Zahodu. Danes poteka v mnogih mestih po svetu.",
   "Who first brought the Ratha-yātrā festival to the West?",["Śrīla Prabhupāda (San Francisco, 1967)","Śrīla Jīva Gosvāmī","Śrīla Rūpa Gosvāmī"],
   "In 1967 Śrīla Prabhupāda held the first Ratha-yātrā in the West, in San Francisco. Today it takes place in many cities around the world."]
 ],
 /* 6 Vraja – Vṛndāvana */ [
  ['mathura',[SB+' 10.3',SB+' 10.3'],
   "V čigavem zaporu v Mathuri se je Kṛṣṇa pojavil Vasudevi in Devakī?",["V zaporu kralja Kaṁse","V zaporu kralja Jarāsandhe","V zaporu kralja Śiśupāle"],
   "Kṛṣṇa se je pojavil kot štiriročni Viṣṇu. Nato ga je Vasudeva čez Yamuno odnesel v Gokulo k Nandu in Yaśodi.",
   "In whose prison in Mathurā did Kṛṣṇa appear before Vasudeva and Devakī?",["King Kaṁsa's prison","King Jarāsandha's prison","King Śiśupāla's prison"],
   "Kṛṣṇa appeared as four-handed Viṣṇu. Then Vasudeva carried Him across the Yamunā to Gokula, to Nanda and Yaśodā."],
