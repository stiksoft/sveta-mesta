np('godruma','bvkutir',["Bhajana-kuṭīra Śrīle Bhaktivinoda Ṭhākure (Svānanda-sukhada-kuñja)","Bhaktivinoda Ṭhākura’s bhajana-kuṭīra (Svānanda-sukhada-kuñja)"],["Śrī Svānanda-sukhada-kuñja s samādhi-templjem Śrīle Bhaktivinoda Ṭhākure, bhajana-kuṭīro Śrīle Gaurakiśore dāsa Bābājīja ter sobama Bhaktivinoda Ṭhākure in Bhaktisiddhānte Sarasvatī Ṭhākure.","Śrī Svānanda-sukhada-kuñja, with the samādhi temple of Śrīla Bhaktivinoda Ṭhākura, the bhajana-kuṭīra of Śrīla Gaurakiśora dāsa Bābājī and the rooms of Bhaktivinoda Ṭhākura and Bhaktisiddhānta Sarasvatī Ṭhākura."],[['2024/08/Srila_Bhakti-Vinod_Thakurs_Samadhi2.jpg','Samādhi Śrīle Bhaktivinoda Ṭhākure','Samādhi of Śrīla Bhaktivinoda Ṭhākura'],['2024/08/Gaurakisora-dasa-Babajis-bhajan-kutir2.jpg','Bhajana-kuṭīra Śrīle Gaurakiśore dāsa Bābājīja','Bhajana-kuṭīra of Śrīla Gaurakiśora dāsa Bābājī'],['2024/08/Srila-Bhakti-Vinode-Thakurs-room-scaled.jpg','Soba Bhaktivinoda Ṭhākure','Bhaktivinoda Ṭhākura’s room']],{s:['Svānanda-sukhada-kuñja','Svānanda-sukhada-kuñja']});
np('godruma','surabhi',["Surabhī-kuñja","Surabhī-kuñja"],["Templji Śrī Nityānande Rāye, Śrī Śrī Rādhā-Madana-mohane in Gaurāṅge, tempelj krave Surabhi, gośālā in soba Śrīle Bhaktivinoda Ṭhākure. Kraj se imenuje tržnica svetega imena.","Temples of Śrī Nityānanda Rāya, Śrī Śrī Rādhā-Madana-mohana and Gaurāṅga, a temple of the cow Surabhi, a gośālā and Śrīla Bhaktivinoda Ṭhākura’s room. The place is called the marketplace of the holy name."],[['2024/08/Sri-Nityananda2.jpg','Śrī Nityānanda Rāya','Śrī Nityānanda Rāya'],['2024/08/Sri-Sri-Radha-Madan-Mohan-Gauranga2.jpg','Śrī Śrī Rādhā-Madana-mohana in Gaurāṅga','Śrī Śrī Rādhā-Madana-mohana and Gaurāṅga'],['2024/08/Surabhi-Cow-Indra-scaled.jpg','Krava Surabhi in Indra','The cow Surabhi and Indra']]);
np('godruma','suvarna',["Śrī Suvarṇa-vihāra","Śrī Suvarṇa-vihāra"],["Dom Božanstev Śrī Śrī Suvarṇavihārī Gauraharija in Śrī Śrī Rādhā-Govinde. Blizu so ruševine palače kralja Suvarṇe Sene, ki se je v Gaura-līli pojavil kot Buddhimanta Khān.","Home of the Deities Śrī Śrī Suvarṇavihārī Gaurahari and Śrī Śrī Rādhā-Govinda. Nearby are the ruins of King Suvarṇa Sena’s palace; he appeared in Gaura-līlā as Buddhimanta Khān."],[['2024/08/Suvarna-Vihar.jpg','Śrī Suvarṇa-vihāra','Śrī Suvarṇa-vihāra'],['2024/08/Suvarna-Sena.jpg','Suvarṇa Sena (Buddhimanta Khān)','Suvarṇa Sena (Buddhimanta Khān)']]);
np('godruma','harihara',["Harihara-kṣetra (Mahā-Vārāṇasī)","Harihara-kṣetra (Mahā-Vārāṇasī)"],["Kraj Gospoda Harihare, Božanstva, ki je pol Viṣṇu in pol Śiva. Tu Gospod Śiva osvobaja duše ob smrti s petjem Gaurāṅgovega imena; zato je kraj, imenovan tudi Mahā-Vārāṇasī, prost strahu pred smrtjo.","The place of Lord Harihara, a Deity half Viṣṇu and half Śiva. Here Lord Śiva liberates souls at death by chanting Gaurāṅga’s name; so the place, also called Mahā-Vārāṇasī, is free from the fear of death."],[['2024/08/Half-Visnu-Half-Siva-Deity2.jpg','Harihara – pol Viṣṇu, pol Śiva','Harihara – half Viṣṇu, half Śiva'],['2024/08/Burho-Shiva.jpg','Buṛo Śiva','Buṛo Śiva']]);
np('godruma','nrsimhapalli',["Nṛsiṁha-pallī (Śrī Devapallī)","Nṛsiṁha-pallī (Śrī Devapallī)"],["Kraj čaščenja Gospoda Nṛsiṁhadeve. Po razodetju Nityānande Prabhuja je tu Gospod po uboju Hiraṇyakaśipuja počival ob reki Mandākinī; tako je kraj češčen že od Satya-yuge.","A place where Lord Nṛsiṁhadeva is worshipped. According to Nityānanda Prabhu’s revelation, the Lord rested here beside the Mandākinī River after slaying Hiraṇyakaśipu; it has been honoured since Satya-yuga."],[['2024/08/Lord-Nrsimha2.jpg','Gospod Nṛsiṁhadeva','Lord Nṛsiṁhadeva'],['2024/08/Mandakini-river-scaled.jpg','Reka Mandākinī','The Mandākinī River']],{s:['Nṛsiṁha-pallī','Nṛsiṁha-pallī']});
np('godruma','amghata',["Āmghāṭa","Āmghāṭa"],["Ko so bhakte po vsakodnevni saṅkīrtani utrujeni, je Gospod na dvorišču posejal seme manga, ki je hitro zraslo v drevo z zrelimi sadeži. Mange je ponudil Kṛṣṇi, nato nahranil vaiṣṇave; sadovi so rasli dvanajst mesecev in vsaka saṅkīrtana se je končala s praznikom mangov.","When the devotees were tired after the daily saṅkīrtana, the Lord sowed a mango seed in the yard, which quickly grew into a tree with ripe fruit. He offered the mangoes to Kṛṣṇa, then fed the Vaiṣṇavas; fruit appeared for twelve months, and each saṅkīrtana ended with a mango festival."],[['2024/08/Amghata2.jpg','Āmghāṭa','Āmghāṭa']]);
np('godruma','arogya',["ISKCON Bhaktivedanta Ārogya Āśrama","ISKCON Bhaktivedanta Ārogya Āśrama"],["Tempelj ISKCON z Božanstvi Jagannāthe, Baladeve in Subhadre, Śrī Śrī Gaura-Nitāija in Rādhe-Kṛṣṇe; v kampusu je dobrodelna šola, ki otrokom daje izobrazbo na duhovnih vrednotah.","An ISKCON temple with the Deities of Jagannātha, Baladeva and Subhadrā, Śrī Śrī Gaura-Nitāi and Rādhā-Kṛṣṇa; the campus runs a charitable school giving children an education grounded in spiritual values."],[['2024/08/Lord-Jagannath-Baladeva-Subhadra-Devi.jpg','Jagannātha, Baladeva in Subhadrā','Jagannātha, Baladeva and Subhadrā'],['2024/08/Sri-Sri-Gaura-Nitai.jpg','Śrī Śrī Gaura-Nitāi','Śrī Śrī Gaura-Nitāi']],{s:['ISKCON Godruma','ISKCON Godruma']});
np('godruma','gauradaha',["Gaura-daha (Gādigāchā)","Gaura-daha (Gādigāchā)"],["Ribnik v pastirski vasi ob Gaṅgi, kjer sta se med petjem ustavila Gaurāṅga in Nityānanda; pastirji Bhīma in Śyāmā sta Jim postregla z jogurtom in mlekom. Gaurāṅgova kīrtana je končala prekletstvo krokodila, otroka polboga, ki ga je v Kāmyavani preklel Durvāsā. Pogled ali dotik ribnika uniči vse grehe.","A pond in a cowherd village on the Gaṅgā where Gaurāṅga and Nityānanda stopped while chanting; the cowherds Bhīma and Śyāmā served Them yogurt and milk. Gaurāṅga’s kīrtana ended the curse of a crocodile, a demigod’s child cursed by Durvāsā in Kāmyavana. Seeing or touching the pond destroys all sins."],[['2024/08/Gaura-Daha-1.jpeg','Gaura-daha','Gaura-daha']]);
np('godruma','pancamukha',["Pañcamukha Śiva","Pañcamukha Śiva"],["Śiva je najboljši med Kṛṣṇovimi bhaktami (vaiṣṇavānāṁ yathā śambhuḥ), ki je opustil monizem in meditira na Gaurāṅgova lotosova stopala. Spominjamo se, kako je pil strup za vsa bitja in zadržal Gaṅgo na prošnjo Bhagīrathe; Vṛddha Śiva je zaščitnik Navadvīpa-dhāme.","Śiva is the best of Kṛṣṇa’s devotees (vaiṣṇavānāṁ yathā śambhuḥ), who gave up monism to meditate on Gaurāṅga’s lotus feet. We remember how he drank poison for all beings and held the Gaṅgā at Bhagīratha’s request; Vṛddha Śiva is the protector of Navadvīpa-dhāma."],[['2024/08/Pancamukha-Siva.jpg','Pañcamukha Śiva','Pañcamukha Śiva'],['2024/09/Temple_Pancamukha-siva.jpg','Tempelj Pañcamukha Śive','Pañcamukha Śiva temple']]);
/* ---- Madhyadvīpa ---- */
np('madhya','hamsavahana',["Haṁsa-vāhana Śiva","Haṁsa-vāhana Śiva"],["Gospod Śiva je pustil svojega bika in zajahal Brahmovega laboda (Haṁsa-vāhana), da bi tu poslušal recitacijo Purāṇ; s svojimi spremljevalci je pel slavo Gospoda Gaure.","Lord Śiva left his bull and mounted Brahmā’s swan (Haṁsa-vāhana) to come here and hear the Purāṇas recited; with his followers he sang the glories of Lord Gaura."],[['2024/08/Hamsa-vahana-Siva-Temple-scaled.jpg','Tempelj Haṁsa-vāhana Śive','Haṁsa-vāhana Śiva temple'],['2025/07/Hamsavahan_Temple_July2025.jpg','Tempelj Haṁsa-vāhana (julij 2025)','Haṁsa-vāhana temple (July 2025)']]);
np('madhya','pancaveni',["Pañcaveṇī (Mahā-prayāga)","Pañcaveṇī (Mahā-prayāga)"],["Blizu Uccahaṭṭe se z Gaṅgo združijo Bhāgīrathī, Mandākinī in Alakanandā; skrito teče Sarasvatī, pridružijo se Yamunā, Bhogavatī in Mānasa-gaṅgā. Ṛṣiji so ga po žrtvovanjih z Brahmo imenovali Mahā-prayāga. Kdor se tu okoplje, se ne rodi več; kdor tu umre, doseže Goloko Vṛndāvano. Gaurāṅga in spremljevalci so ga s kopanjem očistili grehov Kali-yuge.","Near Uccahaṭṭa the Bhāgīrathī, Mandākinī and Alakanandā join the Gaṅgā; the Sarasvatī flows hidden, and the Yamunā, Bhogavatī and Mānasa-gaṅgā also meet. After sacrifices with Brahmā the ṛṣis called it Mahā-prayāga. One who bathes here takes no further birth; one who dies here attains Goloka Vṛndāvana. Gaurāṅga and His associates purified it of Kali-yuga’s sins by bathing."],[['2025/01/Pancaveni_icon.jpg','Pañcaveṇī','Pañcaveṇī']]);
np('madhya','brahmapuskara',["Brāhmaṇa-puṣkara","Brāhmaṇa-puṣkara"],["Vas Brāhmaṇapura. Brāhmaṇa Divadāsa iz Navadvīpe, ki ni mogel potovati v Puṣkaro, se je okopal v ribniku in pred seboj zagledal Puṣkaro. Puṣkara je razglasil, da Navadvīpa vsebuje vse tīrthe in da se bo Gaurāṅga pojavil v Māyāpurju.","The village of Brāhmaṇapura. The brāhmaṇa Divadāsa of Navadvīpa, unable to travel to Puṣkara, bathed in a pond and saw Puṣkara before him. Puṣkara declared that Navadvīpa embodies all tīrthas and that Gaurāṅga would appear at Māyāpur."],[['2024/08/Brahma-Puskara.jpg','Brāhmaṇa-puṣkara','Brāhmaṇa-puṣkara']]);
np('madhya','uccahatta',["Uccahaṭṭa (Kurukṣetra)","Uccahaṭṭa (Kurukṣetra)"],["Neločljiv od Kurukṣetre v Brahmāvarti; tu polbogovi izvajajo gaura-kīrtano. Nityānanda je rekel, da je ena noč tu enaka sto letom na Kurukṣetri. Polbogovi so tu postavili tržnico za pogovore o Gaurāṅgovih zabavah – od tod ime Haṭṭaḍāṅgā.","Non-different from Kurukṣetra in Brahmāvarta; here the demigods perform gaura-kīrtana. Nityānanda said one night here equals a hundred years at Kurukṣetra. The demigods set up a market here for discussing Gaurāṅga’s pastimes – hence the name Haṭṭaḍāṅgā."],[['2024/08/Uccha-Hatta.jpg','Uccahaṭṭa','Uccahaṭṭa']]);
np('madhya','naimisa3',["Naimiṣāraṇya (Madhyadvīpa)","Naimiṣāraṇya (Madhyadvīpa)"],["Ob reki Gomatī v Madhyadvīpi. Po Navadvīpa-dhāma-māhātmyi so ṛṣiji tu na začetku Kali-yuge od Sūte slišali o Gaurāṅgi. Tu je Cakra-tīrtha, ki vodi v Viṣṇujevo bivališče.","Beside the Gomatī River in Madhyadvīpa. According to Navadvīpa-dhāma-māhātmya, the ṛṣis heard about Gaurāṅga from Sūta here at the beginning of Kali-yuga. Here is Cakra-tīrtha, said to lead to Viṣṇu’s abode."],[['2024/08/Naimisaranya.jpg','Naimiṣāraṇya v Madhyadvīpi','Naimiṣāraṇya in Madhyadvīpa']],{s:['Naimiṣāraṇya (Navadvīpa)','Naimiṣāraṇya (Navadvīpa)']});
np('madhya','saptarsi',["Sapta-ṛṣi bhajana-sthala","Sapta-ṛṣi bhajana-sthala"],["V Madhyadvīpi (Mājidā-grāma) je sedem modrecev, Brahmovih sinov, pelo Gaurovo slavo in prosilo za gaura-premo. Opoldne se jim je prikazal Gaurāṅga. Sedem gričkov (ṭilā) je razporejenih kot sedem modrecev na nebu.","In Madhyadvīpa (Mājidā-grāma) seven sages, sons of Brahmā, sang Gaura’s glories and prayed for gaura-prema. At midday Gaurāṅga appeared to them. Seven hillocks (ṭilās) are arranged like the seven sages in the sky."],[['2024/09/saptarishi.jpg','Sapta-ṛṣi bhajana-sthala','Sapta-ṛṣi bhajana-sthala']],{s:['Sapta-ṛṣi','Sapta-ṛṣi']});
/* ---- Koladvīpa ---- */
np('kola','dhamesvara',["Dhāmeśvara Mahāprabhu","Dhāmeśvara Mahāprabhu"],["Božanstvo Śrī Caitanye Mahāprabhuja z rokama, ljubeče iztegnjenima proti bhaktam. Njegova žena Viṣṇupriyā-devī je imela šestnajst let, ko je sprejel sannyāso; to Božanstvo je častila osemdeset let do svojega odhoda.","A Deity of Śrī Caitanya Mahāprabhu with arms lovingly extended towards His devotees. His wife Viṣṇupriyā-devī was sixteen when He took sannyāsa; she worshipped this Deity for eighty years until her departure."],[['2024/08/Dhameswar-Mahaprabhu-1.jpg','Dhāmeśvara Mahāprabhu','Dhāmeśvara Mahāprabhu'],['2026/11/Visnupriya__Dhameshwar_Nandan.jpg','Viṣṇupriyā-devī','Viṣṇupriyā-devī'],['2024/08/Padukas-of-Dhameshwar-Mahaprabhu.jpg','Mahāprabhujeve pāduke','Mahāprabhu’s pādukās']]);
np('kola','jdbkutir',["Bhajana-kuṭīra in samādhi Jagannātha dāsa Bābājīja","Bhajana-kuṭīra and samādhi of Jagannātha dāsa Bābājī"],["Božanstva Śrī Śrī Gaura-Gopāla, Giridhārī, Gaura-Nitāi in Rādhā-Giridhārī. Pod vodstvom Jagannātha dāsa Bābājīja je bila Yogapīṭha prepoznana kot pristni kraj pojavitve Śrī Caitanye Mahāprabhuja.","The Deities Śrī Śrī Gaura-Gopāla, Giridhārī, Gaura-Nitāi and Rādhā-Giridhārī. Under Jagannātha dāsa Bābājī’s guidance Yogapīṭha was identified as the authentic birthplace of Śrī Caitanya Mahāprabhu."],[['2024/08/Bhajan-Kutir-1-scaled.jpg','Bhajana-kuṭīra','Bhajana-kuṭīra'],['2024/08/Samadhi-Temple.jpg','Samādhi-tempelj Jagannātha dāsa Bābājīja','Samādhi temple of Jagannātha dāsa Bābājī'],['2024/08/Sri-Gour-Gopal_Giridhari.jpg','Śrī Śrī Gaura-Gopāla in Giridhārī','Śrī Śrī Gaura-Gopāla and Giridhārī']],{s:['Jagannātha dāsa Bābājī','Jagannātha dāsa Bābājī']});
np('kola','devananda',["Śrī Devānanda Gauḍīya Maṭha (aparādha-bhañjana)","Śrī Devānanda Gauḍīya Maṭha (aparādha-bhañjana)"],["Glavni Božanstvi sta Śrī Śrī Dhāmeśvara Koladeva (Varāhadeva). Tu je Śrī Caitanya Mahāprabhu izkazal milost Devānandi Paṇḍitu, Gopāli Cāpali in drugim. Aparādha-bhañjana ponazarja iskreno predajo bhakte, ki se zateče k Kṛṣṇovim lotosovim stopalom.","The presiding Deities are Śrī Śrī Dhāmeśvara Koladeva (Varāhadeva). Here Śrī Caitanya Mahāprabhu showed mercy to Devānanda Paṇḍita, Gopāla Cāpala and others. Aparādha-bhañjana portrays a devotee’s sincere surrender, taking refuge at Kṛṣṇa’s lotus feet."],[['2024/08/Sri-Sri-Dhameswar-Koladeva-2.jpg','Śrī Śrī Dhāmeśvara Koladeva','Śrī Śrī Dhāmeśvara Koladeva'],['2024/08/Devananda-Pandita.jpg','Devānanda Paṇḍita','Devānanda Paṇḍita']],{s:['Devānanda Gauḍīya Maṭha','Devānanda Gauḍīya Maṭha']});
np('kola','poramatala',["Prauḍhā Māyā in Kṣetra-pāla Śiva (Poramatala)","Prauḍhā Māyā and Kṣetra-pāla Śiva (Poramatala)"],["Bhakte tu častijo Prauḍhā Māyo, božansko Yoga-māyo, ki varuje dhāmo, in Kṣetra-pāla Śivo, zaščitnika svetega bivališča. Vaiṣṇave Śivo spoštujejo kot najboljšega Kṛṣṇovega bhakto in ga prosijo za blagoslov čiste vdanosti.","Devotees worship Prauḍhā Māyā, the divine Yoga-māyā who guards the dhāma, and Kṣetra-pāla Śiva, protector of the holy abode. Vaiṣṇavas regard Śiva as Kṛṣṇa’s foremost devotee and seek his blessings for pure devotion."],[['2025/11/Praduhamaya_Nandan2025.jpg','Prauḍhā Māyā','Prauḍhā Māyā'],['2024/08/Ksetra-Pala-Siva2.jpg','Kṣetra-pāla Śiva','Kṣetra-pāla Śiva']],{s:['Poramatala','Poramatala']});
np('kola','vamsidasa',["Bhajana-kuṭīra Vaṁśīdāsa Bābājīja","Vaṁśīdāsa Bābājī’s bhajana-kuṭīra"],["Bhajana-kuṭīra in puṣpa-samādhi Vaṁśīdāsa Bābājīja. Śrīla Prabhupāda je v predavanju povedal, da se je Vaṁśīdāsa Bābājī pogovarjal s svojim Božanstvom, tako kot je Madana-mohana govoril s Sanātano Gosvāmījem. Odprto 6.00–11.30 in 16.00–20.00.","The bhajana-kuṭīra and puṣpa-samādhi of Vaṁśīdāsa Bābājī. In a lecture Śrīla Prabhupāda said that Vaṁśīdāsa Bābājī talked with his Deity, just as Madana-mohana spoke with Sanātana Gosvāmī. Open 6:00–11:30 and 16:00–20:00."],[['2024/08/Sri-Vamsidasa-Babaji-Bhajan-Kutir-Pushpa-Samadhi.jpeg','Bhajana-kuṭīra Vaṁśīdāsa Bābājīja','Vaṁśīdāsa Bābājī’s bhajana-kuṭīra']],{s:['Vaṁśīdāsa Bābājī','Vaṁśīdāsa Bābājī']});
/* ---- Ṛtudvīpa ---- */
np('ritu','campahatta',["Campahaṭṭa","Campahaṭṭa"],["Petsto let stara Božanstva Śrī Gaura-Gadādhare, ki jim je služil Dvija Vāṇīnātha. Jayadeva Gosvāmī je tu Kṛṣṇi daroval cvetove campaka; Gaurāṅga se je v zlatem sijaju prikazal Jayadevi in Padmāvatī. Kraj ustreza Khadiravani v Vraji.","Five-hundred-year-old Deities of Śrī Gaura-Gadādhara, served by Dvija Vāṇīnātha. Jayadeva Gosvāmī offered campaka flowers to Kṛṣṇa here; Gaurāṅga appeared in golden radiance to Jayadeva and Padmāvatī. The place corresponds to Khadiravana in Vraja."],[['2024/08/Sri-Gaura-Gadadhar.jpg','Śrī Gaura-Gadādhara','Śrī Gaura-Gadādhara'],['2024/08/Deities.jpg','Śrī Śrī Rādhā-Govinda','Śrī Śrī Rādhā-Govinda']]);
np('ritu','sarvabhauma',["Gauḍīya Maṭha Sārvabhaume Bhaṭṭācārye","Sārvabhauma Bhaṭṭācārya Gauḍīya Maṭha"],["Vidyānagara je rojstni kraj Sārvabhaume Bhaṭṭācārye, dom štirih Ved in štiriinšestdesetih umetnosti, sedež Sarasvatī, Brahme, Śive in ṛṣijev.","Vidyānagara is the birthplace of Sārvabhauma Bhaṭṭācārya, home of the four Vedas and sixty-four arts, the seat of Sarasvatī, Brahmā, Śiva and the ṛṣis."],[['2024/08/Deities_Vidyanagar.jpg','Śrī Śrī Rādhā-Śyāmasundara','Śrī Śrī Rādhā-Śyāmasundara'],['2024/08/Sarvabauma-Bhattacharyas-school.jpg','Šola Sārvabhaume Bhaṭṭācārye','Sārvabhauma Bhaṭṭācārya’s school']],{s:['Sārvabhauma Bhaṭṭācārya','Sārvabhauma Bhaṭṭācārya']});
np('ritu','vidyavacaspati',["Hiša Vidyāvācaspatija","House of Vidyāvācaspati"],["Vidyāvācaspati, brat Sārvabhaume Bhaṭṭācārye, je v svoj dom sprejel Śrī Caitanyo Mahāprabhuja; množice so prihajale, da bi Ga videle in radostno pele sveta imena.","Vidyāvācaspati, brother of Sārvabhauma Bhaṭṭācārya, welcomed Śrī Caitanya Mahāprabhu into his home; crowds came to see Him and joyfully chant the holy names."],[['2024/08/Vidyavacaspati-Brother-of-Sarvabhauma-Bhattacarya.jpg','Vidyāvācaspati','Vidyāvācaspati'],['2024/08/Sri-Sri-Gaura-Nitai-worshipped-by-Vidya-Vacaspati.jpg','Gaura-Nitāi, ki ju je častil Vidyāvācaspati','Gaura-Nitāi worshipped by Vidyāvācaspati']],{s:['Vidyāvācaspati','Vidyāvācaspati']});
np('ritu','samudragada',["Samudragaḍa","Samudragaḍa"],["Na robu Navadvīpe se je kralj Samudra Sena boril z Bhīmo in imel darśan Kṛṣṇe, nato Gaurāṅge, ki je plesal v kīrtani; ocean tu služi Gaurāṅgi. Tempelj je ustanovil Śrīla Bhaktisiddhānta Sarasvatī Ṭhākura; sedanji Božanstvi Śrī Śrī Rādhā-Govinda častijo od okoli leta 2015.","On the edge of Navadvīpa King Samudra Sena fought Bhīma and had darśana of Kṛṣṇa, then of Gaurāṅga dancing in kīrtana; the ocean serves Gaurāṅga here. The temple was established by Śrīla Bhaktisiddhānta Sarasvatī Ṭhākura; the present Śrī Śrī Rādhā-Govinda Deities have been worshipped since about 2015."],[['2024/09/Samudragada_Deities-scaled.jpg','Božanstva v Samudragaḍi','Deities at Samudragaḍa'],['2024/09/Samudragada_Temple-scaled.jpg','Tempelj v Samudragaḍi','Samudragaḍa temple']]);
np('ritu','vidyanagara',["Vidyānagara","Vidyānagara"],["Imenovan tako, ker je Matsya-avatāra sem prinesel Vede. Brahmā je tu iz svojega jezika prejel Sarasvatī, Vālmīki po Nāradi Rāmāyaṇo; svoje nauke so tu dali Kapila, Gautama, Kaṇabhuk, Patañjali, Jaimini in Vedavyāsa. Bṛhaspati je tu kot Vāsudeva Sārvabhauma poučeval.","So named because the Matsya-avatāra brought the Vedas here. Here Brahmā received Sarasvatī from his tongue and Vālmīki received the Rāmāyaṇa through Nārada; Kapila, Gautama, Kaṇabhuk, Patañjali, Jaimini and Vedavyāsa produced their teachings here. Bṛhaspati taught here as Vāsudeva Sārvabhauma."],[['2024/08/Vidyanagara3.jpg','Vidyānagara','Vidyānagara']]);
np('ritu','ratupura',["Ratupura (Rādhā-kuṇḍa in Śyāma-kuṇḍa)","Ratupura (Rādhā-kuṇḍa and Śyāma-kuṇḍa)"],["Gaurāṅga se je tu spominjal Kṛṣṇovih pastirskih zabav in izvajal kīrtano blizu Rādhā-kuṇḍe. V Vraji je Mahāprabhu vprašal domačine za Rādhā-kuṇḍo, a nihče ni vedel, kje je; našel je Rādhā-kuṇḍo in Śyāma-kuṇḍo v dveh riževih poljih in se v njiju okopal. Pozneje sta ju po Njegovem naročilu obnovila Rūpa in Sanātana Gosvāmī.","Gaurāṅga recalled Kṛṣṇa’s cowherd pastimes here and performed kīrtana near Rādhā-kuṇḍa. In Vraja Mahāprabhu asked the locals for Rādhā-kuṇḍa, but no one knew where it was; He found Rādhā-kuṇḍa and Śyāma-kuṇḍa in two paddy fields and bathed in them. Later Rūpa and Sanātana Gosvāmī renovated them at His direction."],[['2024/08/Ratupura_Radhakund_Shyamkund2.jpg','Ratupura – Rādhā-kuṇḍa in Śyāma-kuṇḍa','Ratupura – Rādhā-kuṇḍa and Śyāma-kuṇḍa'],['2025/03/Nandan_Ratupura2.jpg','Ratupura','Ratupura']],{s:['Ratupura','Ratupura']});
/* ---- Jahnudvīpa ---- */
np('jahnu','jahnumuni',["Āśrama Jahnu Munija","Jahnu Muni’s āśrama"],["Nityānanda Prabhu je bhakte vodil v Jannagaro do āśrama Jahnu Munija v Bhadravani. Jahnu Muni je tu izvajal pokoro in prejel darśan Gaurāṅgove zlate podobe. Ko je Jahnu požrl Gaṅgo, jo je spet izpustil, zato se imenuje Jāhnavī.","Nityānanda Prabhu led the devotees to Jannagara, to the āśrama of Jahnu Muni in Bhadravana. Jahnu Muni performed austerities here and received darśana of Gaurāṅga’s golden form. After swallowing the Gaṅgā, Jahnu released her, so she is called Jāhnavī."],[['2024/08/JahnuMuni2.jpg','Āśrama Jahnu Munija','Jahnu Muni’s āśrama']],{s:['Jahnu Muni','Jahnu Muni']});
np('jahnu','bhismatila',["Bhīṣma-ṭilā","Bhīṣma-ṭilā"],["Severno od Vidyānagare, blizu āśrama Jahnu Munija. Kṛṣṇov bhakta Bhīṣma se je tu naučil bhāgavata-dharme, ki jo je pozneje razložil kralju Yudhiṣṭhiri (Śrīmad-Bhāgavatam). Jahnudvīpa je neločljiva od Bhadravane v Vraji.","North of Vidyānagara, near Jahnu Muni’s āśrama. Kṛṣṇa’s devotee Bhīṣma learned bhāgavata-dharma here, which he later explained to King Yudhiṣṭhira (Śrīmad-Bhāgavatam). Jahnudvīpa is non-different from Bhadravana in Vraja."],[['2024/08/Bhisma-deva.jpg','Bhīṣmadeva','Bhīṣmadeva']]);
/* ---- Modadrumadvīpa ---- */
np('modadruma','saranga',["Śrīpāṭ Sāraṅge Murārija","Śrīpāṭ of Sāraṅga Murāri"],["Povezan s Sāraṅgo Ṭhākuro (Nāndīmukhī-gopī) in Ṭhākuro Murārijem. Tu so izvirna Božanstva Śivānande Sene, Vāsudeve Datte in Purī dāsa Gosvāmīja. Še vedno stoji drevo siddha-bakula, ki ga je Gospod Caitanya oživil s svojim objemom.","Connected with Sāraṅga Ṭhākura (Nāndīmukhī-gopī) and Ṭhākura Murāri. Here are the original Deities of Śivānanda Sena, Vāsudeva Datta and Purī dāsa Gosvāmī. A siddha-bakula tree, which Lord Caitanya revived with His embrace, still stands."],[['2024/08/Siddha-Bakul-tree.jpg','Drevo siddha-bakula','Siddha-bakula tree'],['2026/11/Gaura-Gadadhara_Nandan.jpg','Gaura-Gadādhara (Purī dāsa Gosvāmī)','Gaura-Gadādhara (Purī dāsa Gosvāmī)'],['2026/11/Sri-Sri-Radha-Gopinath_Nandan-scaled.jpg','Śrī Śrī Rādhā-Gopīnātha (Sāraṅga Ṭhākura)','Śrī Śrī Rādhā-Gopīnātha (Sāraṅga Ṭhākura)']],{s:['Sāraṅga Murāri','Sāraṅga Murāri']});
np('modadruma','mamagachi',["Māmagāchi – rojstni kraj Vṛndāvana dāsa Ṭhākure","Māmagāchi – birthplace of Vṛndāvana dāsa Ṭhākura"],["Śrīla Vṛndāvana dāsa Ṭhākura, pisec Śrī Caitanya-bhāgavate, velja za inkarnacijo Vedavyāse in pastirčka Kusumāpīḍe. Kot ljubi bhakta Nityānande je izvirni Vyāsa Caitanyinih zabav. Njegova mati je bila Nārāyaṇī.","Śrīla Vṛndāvana dāsa Ṭhākura, author of Śrī Caitanya-bhāgavata, is regarded as an incarnation of Vedavyāsa and of the cowherd boy Kusumāpīḍa. A dear devotee of Nityānanda, he is the original Vyāsa of Caitanya’s pastimes. His mother was Nārāyaṇī."],[['2026/11/Vrndavana-dasa-thakur_Nandan.jpg','Vṛndāvana dāsa Ṭhākura','Vṛndāvana dāsa Ṭhākura'],['2026/01/Narayani.jpg','Nārāyaṇī, mati Vṛndāvana dāsa Ṭhākure','Nārāyaṇī, mother of Vṛndāvana dāsa Ṭhākura'],['2024/09/Mamagachi-temple.jpg','Tempelj v Māmagāchiju','Māmagāchi temple']],{s:['Māmagāchi','Māmagāchi']});
np('modadruma','vasudeva',["Hiša Vāsudeve Datte","House of Vāsudeva Datta"],["Na posesti raste staro drevo nāgacampā. Vāsudeva Datta, devetnajsta veja drevesa Caitanye, je bil pripravljen trpeti za grehe vseh živih bitij, da bi bila osvobojena; imenovali so ga inkarnacija Prahlāde Mahārāje. V Māmagāchiju je ustanovil tempelj Madana-gopāle.","An old nāgacampā tree grows on the plot. Vāsudeva Datta, the nineteenth branch of the Caitanya tree, was willing to suffer for the sins of all living beings so they could be delivered; he was called an incarnation of Prahlāda Mahārāja. At Māmagāchi he established a temple of Madana-gopāla."],[['2025/03/Vasudeva-Dutta-house.jpeg','Hiša Vāsudeve Datte','House of Vāsudeva Datta']],{s:['Vāsudeva Datta','Vāsudeva Datta']});
np('modadruma','arkatila',["Arka-ṭilā","Arka-ṭilā"],["Po Navadvīpa-bhāva-taraṅgi se tja pride čez reko Virajā iz Brāhmaṇanagare. Tam se bog Sonca Arkadeva, ki časti Gauraharija, s solzami v očeh prikaže, obljubi kṛṣṇa-bhakti in prosi, naj ga obiskujejo in pojejo sveto ime. Nato pot vodi v Mahatpuro.","According to Navadvīpa-bhāva-taraṅga it is reached by crossing the Virajā River from Brāhmaṇanagara. There the sun-god Arkadeva, worshipping Gaurahari, appears with tears in his eyes, promises kṛṣṇa-bhakti and asks for regular visits to sing the holy name. From there the path leads to Mahatpura."],[['2025/03/Nandan_Arkatila-1.jpg','Arka-ṭilā','Arka-ṭilā']]);
np('modadruma','vaikunthapura',["Vaikuṇṭhapura","Vaikuṇṭhapura"],["Eden od osmih cvetnih listov Navadvīpe: Vaikuṇṭha, Nārāyaṇovo bivališče onstran reke Virajā, kjer Mu služijo Śrī, Bhū in Nīlā. Nārada je tu videl Nārāyaṇo kot Gaurasundaro; tudi Rāmānujācāryi se je tu prikazal Gaurasundara. Točna lega še ni odkrita (lupta-tīrtha).","One of the eight petals of Navadvīpa: Vaikuṇṭha, Nārāyaṇa’s abode beyond the Virajā River, where Śrī, Bhū and Nīlā serve Him. Nārada saw Nārāyaṇa manifest as Gaurasundara here; Gaurasundara also appeared here to Rāmānujācārya. Its exact location has not been discovered (lupta-tīrtha)."],[['2024/08/Vaikunthapura.jpg','Vaikuṇṭhapura','Vaikuṇṭhapura']]);
np('modadruma','mahatpura',["Mahatpura (Mātāpura)","Mahatpura (Mātāpura)"],["Neločljiv od Kāmyavane v Vraji. Pāṇḍave z Yudhiṣṭhiro so tu z Draupadī bivali med izgnanstvom, slišali Gaura Purāṇo od Vyāsadeve in častili Gaurāṅgo. Tu sta Yudhiṣṭhira-ṭilā in Draupadījina kuṇḍa.","Non-different from Kāmyavana in Vraja. During their exile the Pāṇḍavas headed by Yudhiṣṭhira stayed here with Draupadī, heard the Gaura Purāṇa from Vyāsadeva and worshipped Gaurāṅga. Here are Yudhiṣṭhira-ṭilā and Draupadī’s kuṇḍa."],[['2024/08/Mahatpura-1.jpg','Mahatpura','Mahatpura'],['2025/03/Nandan_Mahatpura-scaled.jpg','Mahatpura','Mahatpura']],{s:['Mahatpura','Mahatpura']});
/* ---- Rudradvīpa ---- */
np('rudra','rudramath',["Rudradvīpa Gauḍīya Maṭha","Rudradvīpa Gauḍīya Maṭha"],["Božanstvo Śrī Gaurāṅge Mahāprabhuja, ki mu je Śrīla Bhaktisiddhānta Sarasvatī Prabhupāda osebno služil med śata-koṭi-nāma-yajño. V Rudradvīpi je Viṣṇusvāmī po milosti Gospoda Rudre častil Gauracandro; iz tega je izšla Rudra-sampradāya.","The Deity of Śrī Gaurāṅga Mahāprabhu, personally served by Śrīla Bhaktisiddhānta Sarasvatī Prabhupāda during the śata-koṭi-nāma-yajña. In Rudradvīpa Viṣṇusvāmī worshipped Gauracandra by the mercy of Lord Rudra, which gave rise to the Rudra-sampradāya."],[['2024/08/rudradvipa-gaudiya-math2-scaled.jpg','Rudradvīpa Gauḍīya Maṭha','Rudradvīpa Gauḍīya Maṭha'],['2025/09/Nandan_Rudradvipa_Siva-scaled.jpg','Gospod Śiva','Lord Śiva']],{s:['Rudradvīpa Maṭha','Rudradvīpa Maṭha']});
np('rudra','nidaya',["Nidaya-ghāṭa","Nidaya-ghāṭa"],["Tu je Śrī Caitanya Mahāprabhu ob koncu svojega štiriindvajsetega leta prečkal Gaṅgo in odšel v Kaṇṭaka-nagaro (Kāṭoyā), kjer je sprejel sannyāso. Navadvīpa-bhāva-taraṅga ime razlaga kot »neusmiljen«.","Here, at the end of His twenty-fourth year, Śrī Caitanya Mahāprabhu crossed the Gaṅgā and went to Kaṇṭaka-nagara (Kāṭoyā), where He accepted sannyāsa. Navadvīpa-bhāva-taraṅga glosses the name as “merciless”."],[['2025/11/Nidaya-ghat_2025-scaled.jpg','Nidaya-ghāṭa','Nidaya-ghāṭa']]);
np('rudra','sankarapura',["Śaṅkarapura","Śaṅkarapura"],["Na bregu Gaṅge, ki je Rudradvīpo razdelila na dvoje. Śaṅkarācārya je sem prišel na poti v Navadvīpo, da bi premagal nasprotnike; v sanjah mu je Gauracandra povedal, da Mu je Navadvīpa-dhāma zelo draga in da māyāvāda tu nima mesta, zato je odšel drugam.","On the bank of the Gaṅgā, which has cut Rudradvīpa in two. Śaṅkarācārya came here on his way to Navadvīpa to defeat opponents; in a dream Gauracandra told him that Navadvīpa-dhāma is very dear to Him and that māyāvāda has no place there, so he went elsewhere."],[['2024/08/Sankarapura.jpeg','Śaṅkarapura','Śaṅkarapura']]);
np('rudra','pulina',["Śrī Pulina (Vṛndāvana v Navadvīpi)","Śrī Pulina (Vṛndāvana in Navadvīpa)"],["Nityānanda je Jīvi tu pokazal Śrī Rāsa-maṇḍalo in Dhīra-samīro. Gaurāṅga je ob izgovarjanju Kṛṣṇovega imena videl kraj kot neločljiv od Vṛndāvane in na Rāsa-maṇḍali dosegel mahābhāvo. Točna lega še ni odkrita (lupta-tīrtha).","Here Nityānanda showed Jīva the Śrī Rāsa-maṇḍala and Dhīra-samīra. Reciting Kṛṣṇa’s name, Gaurāṅga saw the place as non-different from Vṛndāvana and reached mahābhāva at the Rāsa-maṇḍala. Its exact location has not been discovered (lupta-tīrtha)."],[['2024/08/Sri-Pulina.jpg','Śrī Pulina','Śrī Pulina']],{s:['Śrī Pulina','Śrī Pulina']});

PLACES.kolkata={n:["Kalkuta (Kolkata)","Kolkata (Calcutta)"],loc:["Zahodna Bengalija","West Bengal"],ll:[22.5675,88.37],lv:3,isl:'gaura',src:SITE,img:[],
 d:["V Kalkuti se je 1. septembra 1896 rodil Śrīla Prabhupāda. Leta 1922 je v Bhaktivinoda āsani (Ultadanga) prvič srečal Śrīlo Bhaktisiddhānto Sarasvatī Ṭhākuro. 13. avgusta 1965 je iz Kalkute z ladjo Jaladuta odplul v Ameriko.","Śrīla Prabhupāda was born in Kolkata on 1 September 1896. In 1922 at Bhaktivinoda Āsana (Ultadanga) he first met Śrīla Bhaktisiddhānta Sarasvatī Ṭhākura. On 13 August 1965 he sailed from Kolkata to America aboard the Jaladuta."]};
const gm=(k,n,loc,at,d,img,ex)=>{PLACES[k]=Object.assign({n,loc,at,lv:3,isl:'gaura',src:SITE,img:nim(img),d},ex||{})};
gm('spbirth',["Rojstni kraj Śrīle Prabhupāde (Kalkuta)","Birthplace temple of Śrīla Prabhupāda (Kolkata)"],["Tollygunge, Kalkuta","Tollygunge, Kolkata"],'kolkata',["Śrīla Prabhupāda se je rodil 1. septembra 1896, dan po Janmāṣṭamī, v majhni hiši v Tollygungeju pod drevesom džekfrut, Gaura Mohanu Deju in Rajani; dali so mu ime Abhay Charan. Astrolog je napovedal, da bo prečkal ocean in ustanovil 108 Kṛṣṇovih templjev. Kot otrok je ljubeče častil Božanstvi Rādhe in Kṛṣṇe.","Śrīla Prabhupāda was born on 1 September 1896, the day after Janmāṣṭamī, in a little house in Tollygunge beneath a jackfruit tree, to Gour Mohan De and Rajani, who named him Abhay Charan. An astrologer foretold he would cross the ocean and establish 108 Kṛṣṇa temples. As a child he lovingly worshipped Rādhā-Kṛṣṇa Deities."],[['2024/12/SP-Birthplace.jpg','Rojstni kraj Śrīle Prabhupāde','Birthplace of Śrīla Prabhupāda']],{s:['Prabhupādov rojstni kraj','Prabhupāda’s birthplace']});
gm('bvasan',["Bhaktivinoda āsana (Ultadanga, Kalkuta)","Bhaktivinoda Āsana (Ultadanga, Kolkata)"],["Ultadanga, Kalkuta","Ultadanga, Kolkata"],'kolkata',["Tu je Śrīla Bhaktisiddhānta Sarasvatī Ṭhākura leta 1918 po sprejemu sannyāse začel misijonsko delo, ki je preraslo v Gauḍīya Maṭh s 64 templji. Leta 1922 je tu srečal Abhaya Charana Deja, poznejšega Śrīlo Prabhupādo, in ga prosil, naj nauk Śrī Caitanye razširi po svetu – seme, iz katerega je zrasel ISKCON.","Here, in 1918, after accepting sannyāsa, Śrīla Bhaktisiddhānta Sarasvatī Ṭhākura began the missionary work that grew into the Gauḍīya Maṭha with 64 temples. In 1922 he met Abhay Charan De, later Śrīla Prabhupāda, here and urged him to preach Śrī Caitanya’s message worldwide – the seed of ISKCON."],[['2024/12/Bhaktivinoda_Asan_ISKCON_Ultadanga_Kolkata.jpg','Bhaktivinoda āsana, ISKCON Ultadanga','Bhaktivinoda Āsana, ISKCON Ultadanga'],['2024/12/Bhaktivinoda_Asan_Bhaktisiddhanta.jpeg','Śrīla Bhaktisiddhānta Sarasvatī','Śrīla Bhaktisiddhānta Sarasvatī'],['2024/12/Bhaktivinoda_Asan_Gandharvika-Giridhari.jpg','Gāndharvikā-Giridhārī','Gāndharvikā-Giridhārī']],{s:['Bhaktivinoda āsana','Bhaktivinoda Āsana']});
gm('panihati',["Pānihāṭi (Rāghava Paṇḍita)","Pānihāṭi (Rāghava Paṇḍita)"],["zahodni breg Gaṅge, blizu postaje Sodpur severno od Kalkute","western bank of the Gaṅgā, near Sodpur station north of Kolkata"],'kolkata',["Tu je živel Rāghava Paṇḍita, prvotni sledilec Śrī Caitanye. Njegova sestra Damayantī je kuhala za Gospoda, Rāghava pa je njene ponudbe nosil v Purī – rāghavera jhāli. Po naročilu Nityānande Prabhuja je Raghunātha dāsa tu priredil praznik sploščenega riža in jogurta.","Rāghava Paṇḍita, an original follower of Śrī Caitanya, lived here. His sister Damayantī cooked for the Lord, and Rāghava carried her offerings to Purī – rāghavera jhāli. At Nityānanda Prabhu’s direction Raghunātha dāsa held a festival of chipped rice and yogurt here."],[['2026/05/ISKCON-Panihati_Sri-Sri-Gaura-Nitai.jpeg','ISKCON Pānihāṭi – Śrī Śrī Gaura-Nitāi','ISKCON Pānihāṭi – Śrī Śrī Gaura-Nitāi']],{s:['Pānihāṭi','Pānihāṭi']});
gm('halisahara',["Hālisahara – rojstni kraj Īśvare Purīja","Hālisahara – birthplace of Īśvara Purī"],["Kumāra-haṭṭa (Kāmarhaṭṭa), blizu postaje Hālisahara","Kumāra-haṭṭa (Kāmarhaṭṭa), near Hālisahara station"],'kolkata',["Īśvara Purī, najljubši učenec Śrīle Mādhavendre Purīja, ki je predano stregel bolnemu guruju, je postal duhovni učitelj Śrī Caitanye Mahāprabhuja. Mahāprabhu je ta kraj obiskal, nabral zemljo in vsak dan pojedel majhen del; po Njegovem zgledu bhakte še danes nabirajo zemljo.","Īśvara Purī, the most beloved disciple of Śrīla Mādhavendra Purī, who served his ailing guru closely, became the spiritual master of Śrī Caitanya Mahāprabhu. Mahāprabhu visited this place, collected earth from it and ate a little every day; following His example devotees still collect earth here."],[['2026/02/Halisahara_nandan-46.jpg','Hālisahara','Hālisahara']],{s:['Hālisahara','Hālisahara']});
gm('kancadapada',["Kāñcaḍāpāḍā – Śrī Kṛṣṇa Rāya","Kāñcaḍāpāḍā – Śrī Kṛṣṇa Rāya"],["približno 2,5 km od Kumārahaṭṭe","about one and a half miles from Kumārahaṭṭa"],'kolkata',["Dom Śivānande Sene, kjer je Caitanya Mahāprabhu ostal dva dni. Śrīnātha Paṇḍita, učenec Advaite Prabhuja, je tu ustanovil tempelj Rādhe-Kṛṣṇe z Božanstvom Śrī Kṛṣṇa Rāya; sedanji tempelj je leta 1786 zgradil zamindar Nimāi Mullik.","The home of Śivānanda Sena, where Caitanya Mahāprabhu stayed two days. Śrīnātha Paṇḍita, a disciple of Advaita Prabhu, established a Rādhā-Kṛṣṇa temple here with the Deity Śrī Kṛṣṇa Rāya; the present temple was built in 1786 by the zamindar Nimāi Mullik."],[['2026/02/Krsnaraya_Nandan.jpg','Śrī Kṛṣṇa Rāya (Kāñcaḍāpāḍā)','Śrī Kṛṣṇa Rāya (Kāñcaḍāpāḍā)']],{s:['Kāñcaḍāpāḍā','Kāñcaḍāpāḍā']});
gm('birnagar',["Birnagar – rojstni kraj Śrīle Bhaktivinoda Ṭhākure","Birnagar – birthplace of Śrīla Bhaktivinoda Ṭhākura"],["Ula Birnagar, Zahodna Bengalija","Ula Birnagar, West Bengal"],'navadvip',["Rojstni kraj Śrīle Bhaktivinoda Ṭhākure (1838–1914), ācārye v učenjski verigi, sodnika v britanski Indiji, pisca in pesnika, ki je ponovno predstavil nauk Śrī Caitanye. Tu so Božanstvi Śrī Śrī Rādhā-Mādhava in drevo sītā-aśoka; ISKCON je položil temeljni kamen.","The birthplace of Śrīla Bhaktivinoda Ṭhākura (1838–1914), an ācārya in the disciplic succession, a magistrate in British India, writer and poet who reintroduced the teachings of Śrī Caitanya. Here are the Deities Śrī Śrī Rādhā-Mādhava and a sītā-aśoka tree; ISKCON has laid a foundation stone."],[['2024/12/Birnagar_Nandan.jpg','Birnagar','Birnagar'],['2025/04/lalit-prasada-and-prabhupada.jpg','Śrīla Prabhupāda v pogovoru z Lalito Prasādo','Śrīla Prabhupāda in conversation with Lalita Prasāda'],['2025/04/Sita-Ashok-Tree.jpg','Drevo sītā-aśoka','Sītā-aśoka tree']],{s:['Birnagar','Birnagar']});
gm('santipura',["Śāntipura (Advaita Ācārya)","Śāntipura (Advaita Ācārya)"],["Śāntipura, okrožje Nadia","Śāntipura, Nadia district"],'navadvip',["Kraj Advaite Ācārye, kjer je častil Gospoda in molil za Njegovo pojavitev. Tu ga je Mādhavendra Purī iniciiral; spominjamo se obiskov Śrī Caitanye Mahāprabhuja, Haridāse Ṭhākure, Sītā-devī (Advaitove žene) in njunega sina Acyutānande.","The place of Advaita Ācārya, where he worshipped the Lord and prayed for His advent. Mādhavendra Purī initiated him here; we remember the visits of Śrī Caitanya Mahāprabhu, Haridāsa Ṭhākura, Sītā-devī (Advaita’s wife) and their son Acyutānanda."],[['2025/01/santipur.jpg','Śāntipura','Śāntipura'],['2025/01/Advaita_Acarya_Santipura_2.jpg','Čaščenje Advaite Ācārye','Advaita Ācārya’s worship'],['2025/01/Caitanya-Mahaprabhu-Visit.jpg','Obisk Śrī Caitanye Mahāprabhuja','Śrī Caitanya Mahāprabhu’s visit']],{s:['Śāntipura','Śāntipura']});
gm('kalna',["Ambikā-kālanā (Gaurīdāsa Paṇḍita)","Ambikā-kālanā (Gaurīdāsa Paṇḍita)"],["Ambikā-kālanā, okrožje Bardhaman","Ambikā-kālanā, Bardhaman district"],'navadvip',["Kraj Gaurīdāse Paṇḍita (v Kṛṣṇovi līli Subala): drevo tamarinda, kjer se je srečal z Gospodom Caitanyo, tempelj Jhalak-darśana, kraj poroke Nityānande in Jāhnave (Sūryadāsa Sarakhela) in tempelj 108 Śiv.","The place of Gaurīdāsa Paṇḍita (Subala in Kṛṣṇa-līlā): the tamarind tree where he met Lord Caitanya, the Jhalak-darśana temple, the place of Nityānanda’s marriage to Jāhnavā (Sūryadāsa Sarakhela) and the temple of 108 Śivas."],[['2026/03/Tamarind-Tree_Nandan-30.jpg','Srečanje Gaurīdāse Paṇḍita in Gospoda Caitanye','Meeting of Gaurīdāsa Paṇḍita and Lord Caitanya'],['2026/03/Kalna_jhalak_Nandan-1.jpg','Tempelj Jhalak-darśana','Jhalak-darśana temple'],['2026/03/Kalna_Siva_temple.jpg','Tempelj 108 Śiv','Temple of 108 Śivas']],{s:['Kālanā','Kālanā']});
gm('nakula',["Nakula Brahmacārī (Ambikā)","Nakula Brahmacārī (Ambikā)"],["Āmbuyā-muluka, danes Ambikā, okrožje Vardhamāna","Āmbuyā-muluka, now Ambikā, Vardhamāna district"],'navadvip',["Čisti bhakta Nakula Brahmacārī, v katerega srce je vstopil Śrī Caitanya Mahāprabhu, da bi osvobodil ljudi Bengalije; kazal je ekstatične znake, podobne Gospodovim. Dvomljivi Śivānanda Sena je bil prepričan, ko mu je Nakula razkril njegovo mantro Gaura-gopāla.","The pure devotee Nakula Brahmacārī, whose heart Śrī Caitanya Mahāprabhu entered to deliver the people of Bengal; he showed ecstatic symptoms like the Lord’s. The doubting Śivānanda Sena became convinced when Nakula identified his Gaura-gopāla mantra."],[['2024/12/Nakula_brahmachari_nandan.jpg','Nakula Brahmacārī','Nakula Brahmacārī']],{s:['Nakula Brahmacārī','Nakula Brahmacārī']});
gm('katwa',["Kāṭoyā (Katwa) – kraj sannyāse","Kāṭoyā (Katwa) – place of sannyāsa"],["Kaṇṭaka-nagara (Kāṭoyā), čez Gaṅgo od Navadvīpe","Kaṇṭaka-nagara (Kāṭoyā), across the Gaṅgā from Navadvīpa"],'navadvip',["Ob koncu svojega štiriindvajsetega leta, v mesecu Māgha, je Śrī Caitanya Mahāprabhu tu sprejel sannyāso od Keśave Bhāratīja. Nityānanda je obvestil Candraśekharo Ācāryo, Gadādharo Paṇḍita in Mukundo Datto, ki so prišli v Kāṭoyo. Pozneje je Gadādhara dāsa tu ustanovil tempelj Śrī Gaurasundare.","At the end of His twenty-fourth year, in the month of Māgha, Śrī Caitanya Mahāprabhu accepted sannyāsa here from Keśava Bhāratī. Nityānanda informed Candraśekhara Ācārya, Gadādhara Paṇḍita and Mukunda Datta, who came to Kāṭoyā. Later Gadādhara dāsa established a temple of Śrī Gaurasundara here."],[['2026/03/Shrina_Mahaprabhu_hair_Arjuna.jpg','Svetišče Mahāprabhujevih las (keśa-samādhi)','Shrine of Mahāprabhu’s hair (keśa-samādhi)'],['2026/03/Mahaprabhu_Sannyasinitiaition_footprints_Mahaprabhu_Keshava-bharati-1.jpg','Odtisi stopal Keśave Bhāratīja in Mahāprabhuja','Footprints of Keśava Bhāratī and Mahāprabhu'],['2026/03/Samadhi-of-Keshava-Bharati.jpg','Samādhi Keśave Bhāratīja','Samādhi of Keśava Bhāratī']],{s:['Kāṭoyā','Kāṭoyā']});
gm('agradvipa',["Agradvīpa (Govinda Ghoṣa)","Agradvīpa (Govinda Ghoṣa)"],["blizu Kāṭoye; Dāṅihāṭa pri postaji Agradvīpa, okrožje Burdwan","near Kāṭoyā; Dāṅihāṭa near Agradvīpa station, Burdwan district"],'navadvip',["Tempelj Śrī Gopīnāthe, ki ga je ustanovil Govinda Ghoṣa. Božanstvo je Govindo Ghoṣo sprejelo za očeta in še danes ob obletnici njegove smrti opravi śrāddho. Vsak Vaiśākha ob bāradoli gre Božanstvo v Kṛṣṇanagaro in se vrne v Agradvīpo.","The temple of Śrī Gopīnātha established by Govinda Ghoṣa. The Deity accepted Govinda Ghoṣa as His father and still performs śrāddha on his death anniversary. Every Vaiśākha, during bāradola, the Deity goes to Kṛṣṇanagara and returns to Agradvīpa."],[['2026/04/Agradvipa_Nandan-6.jpg','Agradvīpa','Agradvīpa'],['2026/04/Samadhi_Govindaghosa.jpg','Samādhi-tempelj Govinde Ghoṣe','Samādhi temple of Govinda Ghoṣa']],{s:['Agradvīpa','Agradvīpa']});
gm('kanai',["Kānāi Nāṭaśālā","Kānāi Nāṭaśālā"],["Bengalija (točno lego odpre gumb Navigacija)","Bengal (the Navigation button opens the exact location)"],'navadvip',["Śrī Caitanya je tu zjutraj videl številne Kṛṣṇove zabave – v Bengaliji so na takih krajih slike zabav za ogled. Nṛsiṁhānanda Brahmacārī je v mislih gradil cesto od Kuliye proti Vṛndāvani, a ta se je ustavila pri Kānāi Nāṭaśāli, zato je napovedal, da Gospod tedaj ne bo prišel do Vṛndāvane.","In the morning Śrī Caitanya saw many pastimes of Kṛṣṇa here – in Bengal such places held pictures of the pastimes for people to see. Nṛsiṁhānanda Brahmacārī built a road in his mind from Kuliyā towards Vṛndāvana, but it stopped at Kānāi Nāṭaśālā, so he predicted the Lord would not reach Vṛndāvana then."],[['2026/02/Kanai-natshala-scaled.jpeg','Kānāi Nāṭaśālā','Kānāi Nāṭaśālā']],{s:['Kānāi Nāṭaśālā','Kānāi Nāṭaśālā']});
PLACES.remuna={n:["Remuṇā – Kṣīra-corā-gopīnātha","Remuṇā – Kṣīra-corā-gopīnātha"],s:['Remuṇā','Remuṇā'],loc:["vas Remuṇā, Odiša (na poti iz Bengalije v Purī)","Remuṇā village, Odisha (on the way from Bengal to Purī)"],at:'puri',lv:5,isl:'gaura',src:SITE,
 img:nim([['2026/10/IDS_Remuna_sq.jpg','Remuṇā','Remuṇā'],['2026/06/ISKCON-Balasore-Remuna_Jagannath.jpg','ISKCON Balasore-Remuṇā – Jagannātha, Baladeva, Subhadrā','ISKCON Balasore-Remuṇā – Jagannātha, Baladeva, Subhadrā']]),
 d:["Śrī Caitanya Mahāprabhu je v Remuṇi pripovedoval zgodbo o Mādhavendri Purīju: Gopīnātha je zanj skril lonec zgoščenega mleka (kṣīra), zato se imenuje Kṣīra-corā-gopīnātha. Pozneje je Mādhavendra Purī iz Purīja prinesel sandalovino in kafro ter ju, kot je želel Gopāla, nanesel na Gopīnāthajija.","At Remuṇā Śrī Caitanya Mahāprabhu narrated the story of Mādhavendra Purī: Gopīnātha stole a pot of condensed milk (kṣīra) for him, so He is called Kṣīra-corā-gopīnātha. Later Mādhavendra Purī brought sandalwood and camphor from Purī and smeared them on Gopīnāthajī, as Gopāla desired."]};

if(!/1924/.test(PLACES.bankima.d[0])){PLACES.bankima.d=[PLACES.bankima.d[0]+' Tempelj je leta 1924 poškodovala strela. Desno od Baṅkima Rāya stoji Jāhnavā, levo Śrīmatī Rādhārāṇī, ki so jo pozneje našli pod drevesom nim v Bhaḍḍāpuri (Bhaḍḍāpurera Ṭhākurāṇī).',PLACES.bankima.d[1]+' The temple was damaged by a thunderbolt in 1924. Jāhnavā stands on Baṅkima Rāya’s right and Śrīmatī Rādhārāṇī on His left; She was later found under a nim tree at Bhaḍḍāpura (Bhaḍḍāpurera Ṭhākurāṇī).']}

 img:[['https://storage.ning.com/topology/rest/1.0/file/get/3674193497?profile=original','Gambhīrā – Gaurāṅgovo bivališče v Purīju (ISKCON Desire Tree)','Gambhīrā – Gaurāṅga’s residence in Purī (ISKCON Desire Tree)'],['https://storage.ning.com/topology/rest/1.0/file/get/3674193525?profile=original','Vhod v Gambhīro (hiša Kāśī Miśre)','Entrance to Gambhīrā (Kāśī Miśra’s house)'],['https://storage.ning.com/topology/rest/1.0/file/get/3674193558?profile=original','Mahāprabhujev kamaṇḍalu, pāduke in odeja','Mahāprabhu’s kamaṇḍalu, pādukās and quilt']],
 d:["Majhna soba v hiši Kāśī Miśre, kjer je Śrī Caitanya Mahāprabhu bival zadnjih dvanajst let svojih vidnih zabav. Kāśī Miśra, rāja-guru kralja Pratāparudre, ga je sprejel po potovanju po južni Indiji. Danes je to Rādhā-kānta Maṭha z Božanstvi Rādhā-kānte, Rādhārāṇī, Lalite ter plešočih Gaurāṅge in Nityānande, ki jih je vzpostavil Gopāla Guru; v skrinjici hranijo Mahāprabhujev kamaṇḍalu, pāduke in odejo.","The small room in Kāśī Miśra’s house where Śrī Caitanya Mahāprabhu stayed for the last twelve years of His manifest pastimes. Kāśī Miśra, rāja-guru of King Pratāparudra, hosted Him after His South India tour. Today it is the Rādhā-kānta Maṭha with the Deities Rādhā-kānta, Rādhārāṇī, Lalitā and dancing Gaurāṅga and Nityānanda, installed by Gopāla Guru; a box keeps Mahāprabhu’s kamaṇḍalu, pādukās and quilt."]};
PLACES.indradyumna={n:["Purī – Indradyumna-sarovara","Purī – Indradyumna-sarovara"],s:['Indradyumna-sarovara','Indradyumna-sarovara'],loc:["blizu templja Guṇḍicā","near the Guṇḍicā temple"],at:'puri',lv:5,src:IDT,
 img:[['https://storage.ning.com/topology/rest/1.0/file/get/3674193891?profile=original','Indradyumna-sarovara (ISKCON Desire Tree)','Indradyumna-sarovara (ISKCON Desire Tree)'],['https://storage.ning.com/topology/rest/1.0/file/get/3674193958?profile=original','Mahāprabhu in bhakte se igrajo v vodi','Mahāprabhu and His devotees playing in the water']],
 d:["Jezero na petih akrih blizu Guṇḍiče. Po izročilu je kralj Indradyumna tu izvedel tisoč aśvamedha-yajñ, kopita podarjenih krav pa so izoblikovala jezero, ki vsebuje vse tīrthe. Śrī Caitanya Mahāprabhu in bhakte so se v njem igrali v vodi, kot opisuje Caitanya-caritāmṛta. Pred Ratha-yātro bhakte z njegovo vodo očistijo Guṇḍicā-mandiro.","A five-acre lake near the Guṇḍicā temple. By tradition King Indradyumna performed a thousand aśvamedha-yajñas here, and the hooves of the donated cows formed a lake holding all tīrthas. Śrī Caitanya Mahāprabhu and His devotees played water games in it, as described in Caitanya-caritāmṛta. Before Ratha-yātrā devotees fetch its water to clean the Guṇḍicā Mandira."]};
PLACES.cataka={n:["Purī – Caṭaka-parvata","Purī – Caṭaka-parvata"],s:['Caṭaka-parvata','Caṭaka-parvata'],loc:["peščena sipina blizu Ṭoṭā-gopīnāthe","a sand dune near Ṭoṭā-gopīnātha"],at:'puri',lv:5,src:IDT,

 d:["Vzvišena peščena sipina blizu templja Ṭoṭā-gopīnātha, ki jo vaiṣṇave štejejo za neločljivo od Giri Govardhane. Na vrhu sta tempelj Gauḍīya Maṭha in bhajana-kuṭīra Śrīle Bhaktisiddhānte Sarasvatī Ṭhākure z njegovo posteljo ter mūrtijema Vyāsadeve in Madhvācārye. Śrīla A. C. Bhaktivedanta Swami Prabhupāda je tu preživel nekaj dni.","A raised sand dune near the Ṭoṭā-gopīnātha temple, which Vaiṣṇavas regard as non-different from Giri Govardhana. On top are a Gauḍīya Maṭha temple and the bhajana-kuṭīra of Śrīla Bhaktisiddhānta Sarasvatī Ṭhākura with his bed and mūrtis of Vyāsadeva and Madhvācārya. Śrīla A. C. Bhaktivedanta Swami Prabhupāda spent a few days here."]};

  intro:['Śrīla Prabhupāda, ustanovitelj-ācārya ISKCON-a, je Bhagavad-gīto in bhakti-yogo razširil po vsem svetu in Śrī Māyāpur-dhāmo vzpostavil kot svetovni duhovni sedež ISKCON-a. ISKCON je ustanovil julija 1966.','Śrīla Prabhupāda, the Founder-Ācārya of ISKCON, spread the Bhagavad-gītā and bhakti-yoga all over the world and established Śrī Māyāpur-dhāma as ISKCON’s world spiritual headquarters. He founded ISKCON in July 1966.'],
  quotes:[['»Tu v Māyāpurju poskušamo ustvariti kraj navdiha za ljudi po vsem svetu.«','“Here in Mayapur we are trying to create a place of inspiration for people throughout the world.”','pismo P. R. Mohapatri, Māyāpur, 4. 3. 1976','Letter to P. R. Mohapatra, Mayapur, 4 March 1976'],['»Moja zamisel je pritegniti ljudi vsega sveta v Māyāpur.«','“My idea is to attract people of the whole world to Mayapur.”','pogovor, Detroit, 15. 6. 1976','Conversation, Detroit, 15 June 1976'],['»Zdaj naj se dviguje, večja in večja, dokler ne postane polna luna.«','“Now make it rise, bigger and bigger until it becomes the full moon.”','pismo Rameśvari, Māyāpur, 25. 10. 1974','Letter to Rāmeśvara, Mayapur, 25 October 1974'],['»Imamo načrte za postavitev veličastnega mednarodnega mesta, ki temelji na tej vedski kulturi.«','“We have plans for erecting a magnificent international city based on this Vedic culture.”','pismo M. N. Chaudhuriju, Māyāpur, 23. 1. 1976','Letter to M. N. Chaudhuri, Mayapur, 23 January 1976']],

  intro:['Guru-paramparā je učenjska veriga, po kateri se vedsko znanje prenaša od Kṛṣṇe prek Brahme do današnjih učiteljev; Bhagavad-gītā (4.2) pove, da se je ta veriga sčasoma pretrgala. Śrīla Prabhupāda poudarja, da je treba slediti navodilom gurua in ne izmišljati novih razlag.','The guru-paramparā is the disciplic succession through which Vedic knowledge passes from Kṛṣṇa through Brahmā to the present teachers; Bhagavad-gītā (4.2) says the succession was broken in the course of time. Śrīla Prabhupāda stresses following the guru’s instructions rather than manufacturing new interpretations.'],
  people:[['Mādhavendra Purī','Sannyāsī in ācārya, ki je v Śāntipuri iniciiral Advaito Ācāryo in bil duhovni učitelj Īśvare Purīja. V Vṛndāvani je izkopal in vzpostavil Božanstvo Gopāla; Gopīnātha mu je skril kṣīro.','A sannyāsī and ācārya who initiated Advaita Ācārya at Śāntipura and was the spiritual master of Īśvara Purī. In Vṛndāvana he excavated and installed the Gopāla Deity; Gopīnātha stole kṣīra for him.','santipura'],['Īśvara Purī','Najljubši učenec Mādhavendre Purīja in duhovni učitelj Śrī Caitanye Mahāprabhuja; rojen v Kumāra-haṭṭi (Hālisahara).','Mādhavendra Purī’s most beloved disciple and the spiritual master of Śrī Caitanya Mahāprabhu; born at Kumāra-haṭṭa (Hālisahara).','halisahara'],['Śrīla Jagannātha dāsa Bābājī','Živel je v Vṛndāvani, nato v Māyāpurju, in nenehno pel Hari-nāmo. Bhaktivinodi Ṭhākuri je razodel, da je Yogapīṭha Mahāprabhujev rojstni kraj; njegov bhajana-kuṭīra je v Koladvīpi.','He lived in Vṛndāvana, later in Māyāpur, constantly chanting Hari-nāma. He revealed to Bhaktivinoda Ṭhākura that Yogapīṭha is Mahāprabhu’s birthplace; his bhajana-kuṭīra is in Koladvīpa.','jdbkutir'],['Śrīla Bhaktivinoda Ṭhākura (1838–1914)','Ācārya, družinski človek, sodnik, pisec in pesnik, ki je ponovno predstavil nauk Śrī Caitanye. Rojen v Birnagarju; spomenik na Yogapīṭhi, soba v Surabhī-kuñji, bhajana-kuṭīra v Godrumadvīpi.','An ācārya, householder, magistrate, writer and poet who reintroduced Śrī Caitanya’s teachings. Born at Birnagar; memorial at Yogapīṭha, room at Surabhī-kuñja, bhajana-kuṭīra in Godrumadvīpa.','bvkutir'],['Śrīla Gaurakiśora dāsa Bābājī','»Odpoved v osebi«, vedno potopljen v ločitev in ljubezen do Kṛṣṇe; duhovni učitelj Bhaktisiddhānte Sarasvatī Ṭhākure. Samādhi v Śrī Caitanya Maṭhu, bhajana-kuṭīra v Godrumadvīpi.','“Renunciation personified”, always absorbed in separation and love for Kṛṣṇa; the spiritual master of Bhaktisiddhānta Sarasvatī Ṭhākura. Samādhi at Śrī Caitanya Maṭha, bhajana-kuṭīra in Godrumadvīpa.','caitanyamath'],['Śrīla Bhaktisiddhānta Sarasvatī Ṭhākura','Rojen kot Bimal Prasād Datta, učenjak astronomije in matematike; duhovni učitelj Śrīle Prabhupāde. Njegovo delo je dalo 64 templjev Gauḍīya Maṭha. Samādhi in bhajana-kuṭīra v Śrī Caitanya Maṭhu.','Born Bimal Prasād Datta, a scholar of astronomy and mathematics; the spiritual master of Śrīla Prabhupāda. His work led to 64 Gauḍīya Maṭha temples. Samādhi and bhajana-kuṭīra at Śrī Caitanya Maṭha.','caitanyamath'],['Śrīla A. C. Bhaktivedanta Swami Prabhupāda','Ustanovitelj-ācārya ISKCON-a, ki je Māyāpur vzpostavil kot svetovni sedež gibanja. Samādhi in muzej, bhajana-kuṭīra in soba v ISKCON Māyāpurju.','Founder-Ācārya of ISKCON, who established Mayapur as the movement’s world headquarters. Samādhi and museum, bhajana-kuṭīra and room at ISKCON Mayapur.','spsamadhi']],

  return LVL(lv).map(si=>{ const st=STAGES[si]; const max=POOL[si].length+(st.final?1:0); const n=nFor(st.pick,P,max);
    const idx=shuffle(POOL[si].map((_,i)=>i),r); const items=idx.slice(0,st.final?n-1:n).map(i=>({i,o:shuffle([0,1,2],r)}));
    if(st.final) items.push({i:-1,o:shuffle([0,1,2],r)}); return {si,items} }) }
function planDaily(k){ const r=rng(dayNum(k)*2654435761); const si=dayNum(k)%STAGES.length; const items=shuffle(POOL[si].map((_,i)=>i),r).slice(0,5).map(i=>({i,o:shuffle([0,1,2],r)})); return [{si,items}] }
function fresh(names,opt){ const lv=opt.lv||1; return {players:names.map(n=>({name:n,score:0,ok:0,streak:0,st:0})),lv,plan:opt.daily?planDaily(opt.date):planFull(lv,names.length,opt.code||''),pi:0,qi:0,gq:0,view:'map',mp:0,hint:false,ans:null,stl:0,sans:null,done:false,teams:!!opt.teams,timer:!!opt.timer,steal:!!opt.steal,code:opt.code||'',daily:!!opt.daily,date:opt.date||null} }

const LV=()=>S.daily?ST().lv:(S.lv||1);

const qOf=(si,it)=>it.i<0?STAGES[si].fq:POOL[si][it.i];

const cur=()=>S.players[curIdx()];

function route(){ if(S.done){ if(S.view==='tb') return tbScreen(); return S.daily?dailyEnd():endScreen() } if(S.view==='q') return qScreen(); if(S.view==='mantra') return mantraScreen(); mapScreen(); }

/* ---------- Zemljevid med stopnjami / Stage map ---------- */

    <div class="mapwrap">${bigMap(k=>{const s=stageOfPlace(k,lv);return s<si?(S.daily?'next':'done'):s===si?'now':'next'},false,true,keys)}
      <div class="legend">${S.daily?'':`<span><i style="background:#E9B84E"></i>${t('visited')}</span>`}<span><i style="background:#EE7F2D"></i>${t('thisStage')}</span>${S.daily?'':`<span><i style="background:rgba(174,179,206,.55)"></i>${t('next')}</span>`}<span>${t('tapPoint')}</span></div></div>

  $('enter').onclick=()=>{S.view='q';S.hint=false;S.ans=null;S.stl=0;S.sans=null;S.deadline=null;save();qScreen()};
}

/* ---------- Vprašanje / Question ---------- */
const LET=['a','b','c'];
let tmrInt=null;
function qScreen(){
  screenFn=qScreen; clearInterval(tmrInt);
  const st=ST(), it=P_().items[S.qi], Q=qOf(SI(),it), key=Q[0];
  const stealing=S.stl===1, revealed=S.ans!==null&&!stealing;
  const pl=stealing?S.stealer:curIdx();
  renderHeader(pl); setBg(key);
  const gone=S.hint?S.hid:-1, opts=qOpts(Q);
  const html=it.o.map((oi,di)=>{
    let cls='opt', dis=false;
    if(revealed){ dis=true; if(oi===0) cls+=' right'; else if(di===S.ans||di===S.sans) cls+=' wrong'; }
    else if(stealing){ if(di===S.ans){cls+=' wrong';dis=true} }
    else if(di===gone){cls+=' gone';dis=true}
    return `<button class="${cls}" data-d="${di}" type="button" ${dis?'disabled':''}><span class="k">${LET[di]}</span><span>${esc(opts[oi])}</span></button>`;
  }).join('');
  const p=cur(), sp=S.players[S.stealer]; let fb='';
  if(stealing){
    fb=`<div class="fb steal"><strong>${S.ans===-1?t('timeUp'):t('wrongShort')} ${t('stealNow',esc(sp.name))}</strong><p>${t('stealHow')}</p></div>`;
  } else if(revealed){
    const ok=S.ans>=0&&it.o[S.ans]===0, sok=S.stl===2&&S.sans>=0&&it.o[S.sans]===0;
    const head=ok?`${t('right')} +${S.pts} ${t('tilak',S.pts)}${S.bonus?` · ${t('bonus')} +${S.bonus}`:''}`:`${S.ans===-1?t('timeUp')+' ':''}${t('correctIs')}: ${esc(opts[0])}`;
    const sl=S.stl===2?(S.sans===-2?t('stealPass',esc(sp.name)):sok?t('stealOk',esc(sp.name)):t('stealNo',esc(sp.name))):'';
    fb=`<div class="fb ${ok||sok?'ok':'no'}"><strong>${head}</strong>${sl?`<span class="stl">${sl}</span>`:''}<p>${qEx(Q)}</p><span class="src">${t('srcL')}: ${qSrc(Q)}</span></div>`;
  }
  const n=P_().items.length;
  const who=stealing?`${t('stealTurn')}: <b style="color:var(--candana)">${esc(sp.name)}</b> · ${t('pts2')}`:`${S.teams?t('turnTeam'):t('turn')} <b style="color:var(--candana)">${esc(p.name)}</b> · ${S.hint?t('pts2'):t('pts4')}`;
  stageEl(`<div class="card">
    <div class="prog"><i style="width:${(S.gq/totalQ()*100).toFixed(1)}%"></i></div>
    ${S.timer&&!revealed?'<div class="timer" id="tmr"><i style="width:100%"></i></div>':''}
    <div class="place-head"><div style="min-width:0"><div class="eyebrow">${S.daily?t('dailyTitle')+' · ':''}${tr(st.n)} · ${S.qi+1}/${n}</div><h2>${pn(key)}</h2></div><button class="where" id="where" type="button" aria-label="${t('showOnMap')}">${miniMap(key)}<span class="loc">${tr(PLACES[key].loc)}<br><u>${t('onMap')}</u></span></button></div>
    <div class="row" style="font-size:14.5px;justify-content:space-between;color:#DADDF0"><span>${who}</span>${p.streak>0&&!revealed&&!stealing?`<span class="streak">${t('streak')}: ${p.streak}${p.streak%3===2?' · '+t('streakNext'):''}</span>`:''}</div>
    <div class="q">${qText(Q)}</div>
    <div class="opts" id="opts">${html}</div>
    ${fb}
    <div class="row">${revealed?`<button class="btn" id="next" type="button">${S.qi+1<n?t('nextQ'):t('endStage')}</button>`:stealing?`<button class="btn ghost" id="pass" type="button">${t('stealSkip')}</button>`:`<button class="btn ghost" id="hint" type="button" ${S.hint?'disabled':''}>${t('hint')}</button>`}</div>
  </div>`);
  $('where').onclick=()=>openAtlas(ALIAS[key]||key);
  if(revealed){$('next').onclick=advance;$('next').focus({preventScroll:true});return}
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.d));
  if(stealing) $('pass').onclick=()=>stealAnswer(-2);
  else $('hint').onclick=()=>{const wrong=it.o.map((oi,di)=>oi!==0?di:-1).filter(x=>x>=0);S.hint=true;S.hid=wrong[Math.floor(Math.random()*wrong.length)];save();qScreen()};
  if(S.timer){ if(!S.deadline){S.dur=stealing?15000:30000;S.deadline=Date.now()+S.dur;save()}
    const upd=()=>{const left=Math.max(0,S.deadline-Date.now()); const el=$('tmr'); if(!el){clearInterval(tmrInt);return}
      el.firstElementChild.style.width=(left/(S.dur||30000)*100)+'%'; el.classList.toggle('low',left<8000); if(left<=0){clearInterval(tmrInt); S.stl===1?stealAnswer(-2):answer(-1)}};
    upd(); tmrInt=setInterval(upd,250); }
}
function answer(di){
  clearInterval(tmrInt);
  if(S.stl===1) return stealAnswer(di);
  if(S.ans!==null) return;
  const it=P_().items[S.qi]; const ok=di>=0&&it.o[di]===0; const p=cur();
  S.ans=di;S.pts=0;S.bonus=0;S.stl=0;S.sans=null;
  if(ok){S.pts=S.hint?2:4;p.ok++;
    if(!S.hint){p.streak++; if(p.streak%3===0) S.bonus=2;} else p.streak=0;
    p.score+=S.pts+S.bonus; Snd.ok();
  } else { p.streak=0; Snd.no();
    if(S.steal&&S.players.length>1&&!S.hint){ S.stl=1; S.stealer=(curIdx()+1)%S.players.length; S.dur=15000; S.deadline=S.timer?Date.now()+15000:null; }
  }
  save();qScreen();
  if(ok) burst(S.pts+S.bonus);
}
function stealAnswer(di){
  clearInterval(tmrInt); if(S.stl!==1) return;
  const it=P_().items[S.qi], sp=S.players[S.stealer]; S.stl=2; S.sans=di;
  const ok=di>=0&&it.o[di]===0;
  if(ok){ sp.score+=2; sp.st=(sp.st||0)+1; Snd.ok() } else if(di>=0) Snd.no();
  save(); qScreen(); if(ok) burst(2);
}
function burst(n){const b=document.createElement('div');b.className='burst';b.innerHTML=Array(Math.min(6,n)).fill(TILAKA('#E9B84E')).join('');$('stage').appendChild(b);setTimeout(()=>b.remove(),1800)}
function advance(){
  S.gq++;S.hint=false;S.ans=null;S.stl=0;S.sans=null;S.deadline=null;
  if(S.qi+1<P_().items.length){S.qi++;save();return qScreen()}
  S.view='mantra';S.mp=0;S.mt=[];S.mres=null;save();mantraScreen();
}
document.addEventListener('keydown',e=>{
  if(!S||!$('opts')||!$('atlas').hidden||/input|textarea/i.test(document.activeElement.tagName)) return;
  if(S.view==='q'&&S.ans!==null&&S.stl!==1) return;
  if(S.view==='tb'&&(!S.tb||S.tb.ans!==null)) return;
  if(S.view!=='q'&&S.view!=='tb') return;
  const i='abc'.indexOf(e.key.toLowerCase()); const j='123'.indexOf(e.key);
  const d=i>=0?i:j; if(d>=0){const b=$('opts').querySelector(`[data-d="${d}"]`); if(b&&!b.disabled) b.click()}
});

/* ---------- Mahā-mantra ---------- */
function mantraScreen(){
  screenFn=mantraScreen; const p=S.players[S.mp];renderHeader(S.mp);
  const items=P_().items; const lastQ=qOf(SI(),items[items.length-1]); setBg(lastQ[0]);
  S.mt=S.mt||[];
  const done=S.mres!==null&&S.mres!==undefined;
  const slots=MANTRA_W.map((w,i)=>{const v=S.mt[i];const bad=done&&!S.mres&&v&&v!==w;return `<div class="slot ${v?'f':''} ${bad?'bad':''}">${v?esc(v):''}</div>`}).join('');
  stageEl(`<div class="card">
    <div class="eyebrow">${t('mantraEyebrow',S.pi+1)}</div>

    <p>${t('mantraText')}</p>
    <p class="src">${t('mantraSrc')}</p>
    <div class="muted" style="font-size:14px">${S.teams?t('turnTeam'):t('turn')} <b style="color:var(--candana)">${esc(p.name)}</b> · ${t('mantraTurn')}</div>
    <div class="slots">${slots}</div>
    ${done?`<div class="fb ${S.mres?'ok':'no'}"><strong>${S.mres?t('mantraOk',esc(p.name)):t('mantraNo')}</strong><div class="mantra">${MANTRA_HTML}</div></div>
    <div class="row"><button class="btn" id="mnext" type="button">${S.mp+1<S.players.length?t('nextPlayer'):t('onward')}</button></div>`:`
    <div class="words">${['Hare','Kṛṣṇa','Rāma'].map(w=>`<button class="word" data-w="${w}" type="button">${w}</button>`).join('')}</div>
    <div class="row"><button class="btn ghost small" id="mback" type="button" ${S.mt.length?'':'disabled'}>${t('back')}</button><button class="btn ghost small" id="mskip" type="button">${t('skip')}</button></div>`}
  </div>`);
  const nextP=()=>{S.mt=[];S.mres=null;if(S.mp+1<S.players.length){S.mp++;save();mantraScreen()}else nextStage()};
  if(done){$('mnext').onclick=nextP;$('mnext').focus({preventScroll:true});return}
  $('stage').querySelectorAll('.word').forEach(b=>b.onclick=()=>{S.mt.push(b.dataset.w); Snd.resume();
    if(S.mt.length===16){S.mres=S.mt.every((w,i)=>w===MANTRA_W[i]);if(S.mres){p.score+=4;Snd.fanfare()}else Snd.no();save();mantraScreen();if(S.mres)burst(4);return}
    if(Snd.fx&&Snd.ctx) Snd.bell(b.dataset.w==='Hare'?660:b.dataset.w==='Rāma'?880:784,.035);
    save();mantraScreen()});
  $('mback').onclick=()=>{S.mt.pop();save();mantraScreen()};
  $('mskip').onclick=nextP;
}
function nextStage(){
  if(S.pi+1<S.plan.length){S.pi++;S.qi=0;S.view='map';save();mapScreen()}
  else{S.done=true;save(); if(S.daily) recordDaily(); S.daily?dailyEnd():endScreen()}
}

    <div class="rank">${r.map(({p},i)=>`<div class="r ${i===0&&!tie?'first':''}"><span class="pos">${i+1}</span><span class="nm">${esc(p.name)}<br><span class="muted" style="font-size:13.5px">${t('correctN',p.ok)}${p.st?' · '+t('steals',p.st):''} · ${t('levelN',LADDER[rankOf(p)])}</span></span><span class="pts">${TILAKA('#E9B84E')}${p.score}</span></div>`).join('')}</div>

/* ---------- Odločilno vprašanje / Tie-break ---------- */
function startTB(){
  const top=Math.max(...S.players.map(p=>p.score)); const ids=S.players.map((p,i)=>p.score===top?i:-1).filter(i=>i>=0);
  const used=new Set(); S.plan.forEach(pl=>pl.items.forEach(it=>used.add(pl.si+':'+it.i)));
  const cand=[]; LVL(S.lv||1).forEach(si=>POOL[si].forEach((_,i)=>{if(!used.has(si+':'+i)) cand.push({si,i})}));
  S.tb={ids,round:1,k:0,n:0,ok:[],ans:null,q:shuffle(cand).map(c=>({si:c.si,i:c.i,o:shuffle([0,1,2])}))};
  S.view='tb'; save(); tbScreen();
}
function tbScreen(){
  screenFn=tbScreen; clearInterval(tmrInt); const tb=S.tb; const pi=tb.ids[tb.k]; const it=tb.q[tb.n%tb.q.length]; const Q=POOL[it.si][it.i]; const p=S.players[pi];
  renderHeader(pi); setBg(Q[0]);
  const answered=tb.ans!==null, opts=qOpts(Q), ok=answered&&tb.ans>=0&&it.o[tb.ans]===0;
  const html=it.o.map((oi,di)=>{let cls='opt'; if(answered){ if(oi===0) cls+=' right'; else if(di===tb.ans) cls+=' wrong'; }
    return `<button class="${cls}" data-d="${di}" type="button" ${answered?'disabled':''}><span class="k">${LET[di]}</span><span>${esc(opts[oi])}</span></button>`}).join('');
  stageEl(`<div class="card">
    <div class="eyebrow">${t('tbTitle')} · ${t('tbRound',tb.round)} · ${tb.k+1}/${tb.ids.length}</div>
    <h2>${pn(Q[0])}</h2>
    <p class="tbnote">${t('tbNote')}</p>
    <div class="row" style="font-size:14.5px;color:#DADDF0"><span>${S.teams?t('turnTeam'):t('turn')} <b style="color:var(--candana)">${esc(p.name)}</b></span></div>
    <div class="q">${qText(Q)}</div>
    <div class="opts" id="opts">${html}</div>
    ${answered?`<div class="fb ${ok?'ok':'no'}"><strong>${ok?t('right'):t('correctIs')+': '+esc(opts[0])}</strong><p>${qEx(Q)}</p><span class="src">${t('srcL')}: ${qSrc(Q)}</span></div>
    <div class="row"><button class="btn" id="tbnext" type="button">${t('onward')}</button></div>`:''}
  </div>`);
  if(!answered){ $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{tb.ans=+b.dataset.d; it.o[tb.ans]===0?Snd.ok():Snd.no(); save(); tbScreen()}); return }
  $('tbnext').onclick=()=>{
    if(ok) tb.ok.push(pi); tb.ans=null; tb.n++; tb.k++;
    if(tb.k<tb.ids.length){ save(); return tbScreen() }
    if(tb.ok.length===1){ S.tbWin=tb.ok[0]; S.view='end'; save(); return endScreen() }
    if(tb.ok.length>1) tb.ids=tb.ok; tb.ok=[]; tb.k=0; tb.round++;
    if(tb.round>5){ S.tbShared=true; S.view='end'; save(); return endScreen() }
    save(); tbScreen(); const b=document.createElement('p'); b.className='tbnote'; b.textContent=t('tbAgain'); $('stage').querySelector('.card').insertBefore(b,$('stage').querySelector('.q'));
  };
  $('tbnext').focus({preventScroll:true});
}

/* ---------- Atlas – enciklopedija svetih mest / encyclopedia ---------- */
const albumCache={};
const fnorm=x=>{try{x=decodeURIComponent(x)}catch(e){} return x.replace(/^File:/i,'').replace(/ /g,'_').toLowerCase()};
async function commonsQuery(params){
  const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|mime&iiurlwidth=1600&'+params;
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),6000);
  try{ const r=await fetch(u,{signal:ctl.signal}); const j=await r.json(); return Object.values((j.query||{}).pages||{}).sort((a,b)=>(a.index||0)-(b.index||0)) }catch(e){ return [] } finally{ clearTimeout(tm) } }
const goodImg=p=>p.imageinfo&&/jpeg|png/.test(p.imageinfo[0].mime)&&!/map|plan|logo|diagram|sketch|karte|locator|selfie|\.svg/i.test(p.title);
const catCache=store.get('sm-catimg',{});
async function ensureImg(k){ const P=PLACES[k]; if(!P||(P.img&&P.img.length)) return false;
  if(catCache[k]){P.img=[[catCache[k],P.n[0],P.n[1]]];return true}
  if(navigator.onLine===false) return false;
  for(const c of (P.cat||[])){ const r=(await commonsQuery('generator=categorymembers&gcmtype=file&gcmlimit=10&gcmtitle='+encodeURIComponent('Category:'+c))).filter(goodImg);
    if(r.length){ const f=r[0].title.replace(/^File:/,'').replace(/ /g,'_'); catCache[k]=f; store.set('sm-catimg',catCache); P.img=[[f,P.n[0],P.n[1]]]; return true } }
  return false }
async function fetchAlbum(k){
  const ck=k+L; if(albumCache[ck]) return albumCache[ck];
  await ensureImg(k);
  const extra=[]; Object.keys(ALIAS).forEach(a=>{if(ALIAS[a]===k) extra.push(...imgsOf(a))});
  const seen=new Set(); const out=[];
  const add=(file,src,th,cap)=>{const n=fnorm(file); if(seen.has(n)) return; seen.add(n); out.push({src,th,cap})};
  [...imgsOf(k),...extra].forEach(x=>add(x[0],photoUrl(x[0],1800),photoUrl(x[0],260),LX(x[1],x[2])));
  albumCache[ck]=out.slice();
  const P=PLACES[k], isk=ISK[k]||{}; const iskCap='ISKCON · '+pn(k);
  const big=p=>p.imageinfo[0].thumburl;
  for(const c of (isk.cat||[])){ (await commonsQuery('generator=categorymembers&gcmtype=file&gcmlimit=12&gcmtitle='+encodeURIComponent('Category:'+c))).filter(goodImg).forEach(p=>add(p.title,big(p),big(p),iskCap)) }
  for(const c of (P.cat||[])){ (await commonsQuery('generator=categorymembers&gcmtype=file&gcmlimit=16&gcmtitle='+encodeURIComponent('Category:'+c))).filter(goodImg).forEach(p=>add(p.title,big(p),big(p),pn(k))) }
  if(isk.kw){ (await commonsQuery('generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch='+encodeURIComponent('ISKCON '+(P.q||short(k))+' filetype:bitmap'))).filter(p=>goodImg(p)&&/iskcon/i.test(p.title)&&isk.kw.test(p.title)).forEach(p=>add(p.title,big(p),big(p),iskCap)) }
  albumCache[ck]=out.slice(0,28);
  return albumCache[ck];
}
const deiOf=k=>{const P=PLACES[k];return P.dei||DEI[k]||null};
function factsOf(k){ const out=[], seen=new Set(); const push=Q=>{ if(!Q||(ALIAS[Q[0]]||Q[0])!==k) return; const ex=qEx(Q); if(seen.has(ex)) return; seen.add(ex); out.push({ex,src:qSrc(Q)}) };
  POOL.forEach(st=>st.forEach(push)); push(FINALQ); push(FINALQ2); push(FINALQ3); return out }

const searchText=k=>{const P=PLACES[k];return [P.n[0],P.n[1],P.loc[0],P.loc[1],...(deiOf(k)||[])].join(' ').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()};

function openAtlas(focus,view){ atlasFocus=focus||atlasFocus||'tovp'; atlasView=view||'place'; $('atlas').hidden=false; $('atlasTitle').textContent=t('atlasTitle'); $('atlasClose').textContent=t('close');
  $('atlasTabs').innerHTML=[['place','tabPlaces'],['pari','tabPari'],['routes','tabRoutes'],['cal','tabCal'],['diary','tabDiary']].map(([v,k])=>`<button type="button" data-v="${v}" class="${atlasView===v?'on':''}">${t(k)}</button>`).join('');
  $('atlasTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{atlasView=b.dataset.v;$('atlasTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));ATL&&ATL.view(atlasView)});
  buildAtlas($('atlasBox'),atlasFocus); }

const VZOOM=['mathura','vrindavan','govardhan','varsana','radhakunda','radhadamodar','gokula','bhandira','nandagrama'];

function vbLinks(src){

  const s=String(src);
  for(const m of s.matchAll(/(?:Bhāgavatam)\s+(\d+)\.(\d+)/g)) add(`https://vedabase.io/en/library/sb/${m[1]}/${m[2]}/`,`ŚB ${m[1]}.${m[2]}`);
  if(/Caitanya-caritāmṛta/.test(s)) for(const m of s.matchAll(/(Ādi|Madhya|Antya)\s+(\d+)/g)){ const p={Ādi:'adi',Madhya:'madhya',Antya:'antya'}[m[1]]; add(`https://vedabase.io/en/library/cc/${p}/${m[2]}/`,`CC ${m[1]} ${m[2]}`) }
  for(const m of s.matchAll(/Bhagavad-gītā\s+(\d+)/g)) add(`https://vedabase.io/en/library/bg/${m[1]}/`,`BG ${m[1]}`);
  return out.slice(0,3);
}

async function exportArchive(withMedia,btn){
  const old=btn&&btn.textContent; if(btn){btn.disabled=true;btn.textContent=t('archBusy')}
  try{
    const ls={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(/^sm-/.test(k)&&k!=='sm-ed') ls[k]=localStorage.getItem(k) }
    const out={app:'sveta-mesta',ver:18,date:new Date().toISOString(),ls,media:[],photos:[],tracks:[]};
    if(withMedia){
      try{ for(const [k,b] of await midb('getAll')) out.media.push([k,await blobToData(b)]) }catch(e){}
      for(const k of Object.keys(DIARY)){ if(DIARY[k].photo){ try{ const b=await pidb('get',k); if(b) out.photos.push([k,await blobToData(b)]) }catch(e){} } }
      try{ for(const r of await idb('getAll')) out.tracks.push({id:r.id,name:r.name,data:await blobToData(r.blob)}) }catch(e){}
    }
    const ok=await saveFile(`sveta-mesta-arhiv-${dayKey()}.json`,new Blob([JSON.stringify(out)],{type:'application/json'}));
    if(btn) btn.textContent=ok?t('archDone'):old;
  }catch(e){ if(btn) btn.textContent=t('archBad') } if(btn) btn.disabled=false }
async function importArchive(){
  const f=await pickFile('.json,application/json'); if(!f) return;
  let j; try{ j=JSON.parse(await f.text()) }catch(e){ alertBox(t('archBad')); return }
  if(!j||j.app!=='sveta-mesta'||!j.ls){ alertBox(t('archBad')); return }
  if(!confirm(t('archConfirm'))) return;
  Object.entries(j.ls).forEach(([k,v])=>{ if(/^sm-/.test(k)) try{ localStorage.setItem(k,v) }catch(e){} });
  for(const [k,d] of j.media||[]){ try{ await midb('put',k,await dataToBlob(d)) }catch(e){} }
  for(const [k,d] of j.photos||[]){ try{ await pidb('put',k,await dataToBlob(d)) }catch(e){} }
  for(const r of j.tracks||[]){ try{ await idb('put',{id:r.id,name:r.name,blob:await dataToBlob(r.data)}) }catch(e){} }
  store.set('sm-ret','teach'); location.reload() }

  $('stage').querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{ keep(); o.src=b.dataset.ps; o.title=''; presScreen(o) });
  if($('psLv')) $('psLv').onchange=e=>{ o.lv=+e.target.value; o.title=''; presScreen(o) };
  if($('psPi')) $('psPi').onchange=e=>{ o.pi=+e.target.value; o.title=''; presScreen(o) };
  $('stage').querySelectorAll('[data-po]').forEach(c=>c.onchange=()=>{ o[c.dataset.po]=c.checked?1:0; keep() });
  $('psN').onchange=e=>{ o.nImg=+e.target.value; keep() };
  if($('psQ')){ const q=$('psQ'), res=$('psRes'); q.oninput=()=>{ const v=q.value.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); if(!v){res.innerHTML='';return}
      res.innerHTML=ATLAS.filter(x=>searchText(x).includes(v)&&!o.sel.includes(x)).slice(0,16).map(x=>`<button type="button" data-ad="${x}">+ ${esc(short(x))}</button>`).join('')||`<span class="muted">${t('encNone')}</span>`;
      res.querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>{ keep(); o.sel.push(b.dataset.ad); presScreen(o) }) };
    $('psSel').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ keep(); o.sel=o.sel.filter(x=>x!==b.dataset.rm); presScreen(o) }); }
  const build=()=>{ keep(); const ks=keysOf(); if(!ks.length){ alertBox(t('presEmpty')); return null } return presSlides(ks,o,o.title||ttl()) };
  $('psPlay').onclick=()=>{ const s=build(); if(s) presPlay(s,0) };
  $('psHtml').onclick=e=>{ const s=build(); if(s) presExportHtml(s,o.title||ttl(),e.target) };
  $('psPrint').onclick=()=>{ const s=build(); if(s) presPrint(s,o.title||ttl()) };
  $('psBack').onclick=()=>teacherScreen(); $('psHome').onclick=startScreen;
}
