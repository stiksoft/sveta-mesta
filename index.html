<style>
/* Layout: one-screen pilgrimage — painted holy-place scene fills the stage, a lamp-lit card floats over it; header carries players' tilaka scores. Single dark śyāma world. */
:root{
  --night:#0D1330; --night2:#17204A; --panel:rgba(13,19,48,.86);
  --gold:#E9B84E; --saffron:#EE7F2D; --tulasi:#5DA77A; --candana:#F4E5BC;
  --muted:#AEB3CE; --line:rgba(233,184,78,.28); --bad:#E58A7A;
  --f-display:"Tiro Devanagari Sanskrit","Noto Serif",Georgia,serif;
  --f-body:"Mukta","Noto Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--candana);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--night);position:relative;z-index:5}
.brand{font-family:var(--f-display);font-size:20px;color:var(--gold);letter-spacing:.02em;margin-right:auto}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.players{display:flex;gap:8px;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pchip.on{border-color:var(--gold);color:var(--candana);background:rgba(233,184,78,.1)}
.pchip b{color:var(--gold)}
.tilaka{width:14px;height:19px;flex:none}
main{flex:1;position:relative;min-height:0}
.scene{position:absolute;inset:0;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease;animation:kb 26s ease-in-out infinite alternate;transform-origin:50% 40%}
.photo.in{opacity:1}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(13,19,48,.45) 0%,rgba(13,19,48,.08) 30%,rgba(13,19,48,.25) 55%,rgba(13,19,48,.94) 100%),radial-gradient(ellipse at center,transparent 55%,rgba(13,19,48,.55) 100%)}
.frame{position:absolute;inset:10px;border:1px solid rgba(233,184,78,.35);border-radius:6px;pointer-events:none}
.credit{position:absolute;top:16px;right:max(20px,env(safe-area-inset-right,0px));z-index:2;font-size:11px;color:rgba(244,229,188,.8);background:rgba(13,19,48,.55);padding:2px 8px;border-radius:999px;text-decoration:none}
.credit:hover{color:var(--gold)}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
.credits{display:grid;gap:4px;font-size:13px;columns:2 220px}
.credits a{color:var(--muted);display:block;break-inside:avoid}
.credits a:hover{color:var(--gold)}
.stagewrap{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-end;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stagewrap.center{justify-content:center}
.card{position:relative;width:100%;max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--saffron);font-weight:700}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;color:var(--candana)}
h1{font-size:clamp(34px,7vw,56px);line-height:1.05;color:var(--gold)}
h2{font-size:clamp(24px,4.5vw,32px);line-height:1.15}
h3{font-size:20px}
.place-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.loc{font-size:13px;color:var(--muted)}
.q{font-size:19px;line-height:1.45;max-width:62ch}
p{margin:0;max-width:65ch}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],textarea{width:100%;box-sizing:border-box;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;color:var(--candana);font:inherit;font-size:18px;padding:12px 14px}
textarea{min-height:96px;resize:vertical;font-size:16px}
input::placeholder,textarea::placeholder{color:#7f86a8}
.btn{background:var(--gold);color:var(--night);border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--candana);border:1px solid var(--line);font-weight:600}
.btn.small{padding:7px 12px;font-size:14px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 0;font-size:14px}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:rgba(93,167,122,.16);border:1px solid rgba(93,167,122,.5)}
.fb.no{background:rgba(229,138,122,.12);border:1px solid rgba(229,138,122,.45)}
.fb.hint{background:rgba(238,127,45,.12);border:1px solid rgba(238,127,45,.45)}
.fb strong{font-size:17px}
.src{font-size:13px;color:var(--muted);font-style:italic}
.prog{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--gold))}
.mantra{font-family:var(--f-display);font-size:clamp(13px,3.6vw,22px);line-height:1.7;color:var(--gold);text-align:center}
.ml{display:block;white-space:nowrap}
.stages{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.st{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.st .dot{width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.st.done .dot{background:var(--tulasi);border-color:var(--tulasi);color:var(--night)}
.st.now{border-color:var(--gold);background:rgba(233,184,78,.08)}
.st.now .dot{background:var(--gold);border-color:var(--gold);color:var(--night)}
.st.main .nm{color:var(--gold)}
.st .nm{font-weight:600;font-size:15px;line-height:1.25}
.st .sb{font-size:12px;color:var(--muted);line-height:1.3}
.ladder{display:flex;gap:4px;flex-wrap:wrap}
.ladder span{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ladder span.reached{color:var(--candana);border-color:rgba(93,167,122,.6)}
.ladder span.cur{background:var(--gold);color:var(--night);border-color:var(--gold);font-weight:700}
.setup-players{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.rules{display:grid;gap:6px;font-size:15px;color:var(--muted)}
.rules li{max-width:62ch}
.rules ul{margin:0;padding-left:18px;display:grid;gap:4px}
.rank{display:grid;gap:8px}
.rank .r{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-variant-numeric:tabular-nums}
.rank .r.first{border-color:var(--gold);background:rgba(233,184,78,.1)}
.rank .pos{font-family:var(--f-display);font-size:22px;color:var(--gold);width:24px}
.rank .nm{flex:1;min-width:0}
.rank .pts{display:flex;align-items:center;gap:6px;font-size:20px;color:var(--gold);font-weight:700}
.burst{position:absolute;left:50%;top:40%;pointer-events:none;display:flex;gap:6px;transform:translateX(-50%)}
.burst svg{width:26px;height:35px;animation:rise 1.3s ease-out forwards;opacity:0}
.burst svg:nth-child(2){animation-delay:.08s}.burst svg:nth-child(3){animation-delay:.16s}.burst svg:nth-child(4){animation-delay:.24s}
@keyframes rise{0%{opacity:0;transform:translateY(20px) scale(.6)}25%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-90px) scale(1)}}
.help{max-width:760px}
.help video{width:100%;max-width:100%;border-radius:10px;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.help h3{color:var(--gold);margin-top:4px}
.help ol,.help ul{margin:0;padding-left:20px;display:grid;gap:5px;max-width:65ch}
.dev{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.dev div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.dev b{display:block;color:var(--candana);margin-bottom:4px}
.dev p{font-size:14px;color:var(--muted)}
.chant{font-size:clamp(11px,3.2vw,14px);color:var(--muted);text-align:center;line-height:1.6}
.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);grid-auto-rows:0;gap:3px;overflow:hidden}
.mosaic .tile{position:relative;overflow:hidden;min-width:0;min-height:0}
.mosaic .tile.big{grid-column:span 2;grid-row:span 2}
.mosaic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease;animation:kb 22s ease-in-out infinite alternate}
.mosaic img.in{opacity:1}
.mosaic .tile span{position:absolute;left:8px;bottom:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(244,229,188,.85);text-shadow:0 1px 3px #000}
@media (max-aspect-ratio:1/1){.mosaic{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr)}}
.place-head .where{display:flex;align-items:center;gap:10px;min-width:0}
.minimap{width:96px;height:auto;flex:none}
.bigmap{width:100%;max-width:520px;margin:0 auto;display:block;height:auto}
.mapwrap{display:flex;flex-direction:column;gap:6px;align-items:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.card.wide{max-width:960px}
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.thumb{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.2);min-width:0}
.thumb .ph{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden}
.thumb .ph svg,.thumb .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph img{opacity:0;transition:opacity .8s}.thumb .ph img.in{opacity:1}
.thumb .no{position:absolute;top:6px;left:6px;z-index:2;background:var(--gold);color:var(--night);font-weight:700;font-size:12px;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.thumb figcaption{padding:8px 10px;display:grid;gap:2px}
.thumb b{font-size:13px;line-height:1.25;color:var(--candana);font-weight:600}
.thumb small{font-size:11.5px;line-height:1.3;color:var(--muted)}
@keyframes pulse{0%{r:4;opacity:.9}100%{r:14;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.mosaic img{animation:none}}
@media (prefers-reduced-motion:reduce){.burst svg{animation:none;opacity:1}.photo{animation:none}}
@media (max-width:520px){.card{padding:18px 16px}.q{font-size:17px}.brand small{display:none}}
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="brand">Sveta mesta <small>romanje do Krišna-preme</small></div>

  <main>

  </main>
</div>

const STAGES = [
 {name:"Himalaja",sub:"Ganga, Kailāsa, Badrīnāth, Muktināth",intro:"Romanje se začne visoko v Himalaji, kjer Ganga, ki izvira iz Gospodovih lotosovih stopal, prvič pride na Zemljo.",qs:[
  {p:'gangotri',q:"Ganga je v vesolje pritekla, ko je Gospodov palček v inkarnaciji pritlikavca predrl ovoj vesolja. Kako se imenuje ta inkarnacija?",a:["vamana","vamanadeva","trivikrama","visnu","urukrama"],show:"Vāmana (Višnu)",hint:"Bali Mahārāju je kot brahmanski deček prosil za tri korake zemlje.",ex:"Ko je Gospod Vāmana stopil čez vesolje, je s palčkom levega stopala predrl njegov ovoj in voda Kāraṇa oceana je pritekla noter kot sveta Ganga. Zato se imenuje Viṣṇupadī.",src:"Šrīmad-Bhāgavatam 5.17"},
  {p:'gangotri',q:"Kateri kralj je s svojo pokoro privedel Gango na Zemljo, da bi očistil in odrešil svoje prednike?",a:["bhagiratha","bagirata"],show:"Bhagīratha",hint:"Po njem se Ganga v gorah imenuje Bhāgīrathī.",ex:"Kralj Bhagīratha je izvajal hudo pokoro. Ganga je privolila v spust, njen silni tok pa je na glavi zadržal Gospod Šiva.",src:"Šrīmad-Bhāgavatam 9.9"},
  {p:'kailas',q:"Kdo prebiva na gori Kailāsa in je po Bhāgavatamu največji med vaišnavi (vaiṣṇavānāṁ yathā śambhuḥ)?",a:["siva","sambhu","mahadeva","sankara","rudra"],show:"Gospod Šiva (Śambhu)",hint:"Na glavi nosi Gango, za soprogo ima Pārvatī.",ex:"Bhāgavatam pravi, da je tako kot je Ganga največja med rekami, Šiva največji med vaišnavi. Neprestano meditira na Gospoda Saṅkarṣaṇa.",src:"Šrīmad-Bhāgavatam 12.13.16"},
  {p:'kailas',q:"V kateri deželi danes leži sveta gora Kailāsa?",a:["tibet","kitajska","tibetu"],show:"Tibet",hint:"Visoka planota severno od Himalaje.",ex:"Kailāsa stoji v zahodnem Tibetu, v bližini jezera Mānasa-sarovara.",src:"lokacija danes"},
  {p:'badri',q:"Katera dvojna inkarnacija Gospoda od nekdaj izvaja pokoro v Badarikāśrami za dobrobit vseh bitij?",a:["naranarayana","nara narayana","narayana rsi","narayanarsi"],show:"Nara-Nārāyaṇa Ṛṣi",hint:"Dva modreca, sinova Dharme in Mūrti.",ex:"Nara-Nārāyaṇa Ṛṣi kot Gospodov avatar v Badarikāśrami izvaja pokoro, da bi ljudem pokazal pot odpovedi in vdanosti.",src:"Šrīmad-Bhāgavatam 11.4"},
  {p:'badri',q:"Katerega ljubljenega bhakto je Krišna ob koncu svojih zemeljskih zabav poslal v Badarikāśramo?",a:["uddhava","udava"],show:"Uddhava",hint:"Krišnov prijatelj in svetovalec iz Dvārake, ki je nesel sporočilo gopījam.",ex:"Krišna je Uddhavi podal nauke (Uddhava-gītā) in mu naročil, naj gre v Badarikāśramo ter tam živi v zavesti Krišne.",src:"Šrīmad-Bhāgavatam 11.29"},
  {p:'mukti',q:"Kako se imenuje sveti kamen iz reke Gaṇḍakī, ki ga vaišnave častijo kot neposredno Božanstvo Gospoda Višnuja?",a:["salagrama","salagram","salagramasila","salagrama sila","silagram"],show:"Śālagrāma-śilā",hint:"Okrogel črn kamen s spiralnimi znamenji.",ex:"Reka Gaṇḍakī, ki teče mimo Muktinātha v Nepalu, je znana po śālagrāma-śilah, ki so oblike Gospoda Nārāyaṇa.",src:"Šrīmad-Bhāgavatam 5.7 (razlaga)"},
  {p:'mukti',q:"Kateri veliki kralj, po katerem se Zemlja imenuje Bhārata-varṣa, je ob reki Gaṇḍakī v Pulaha-āśrami častil Gospoda?",a:["bharata","bharat","jada bharata","jadabharata"],show:"Bharata Mahārāja",hint:"Zaradi navezanosti na jelenčka se je moral ponovno roditi.",ex:"Bharata Mahārāja je zapustil kraljestvo in v Hari-kṣetri ob Gaṇḍakī častil Gospoda. Navezal se je na jelenčka, se rodil kot jelen in nato kot Jaḍa Bharata.",src:"Šrīmad-Bhāgavatam 5.7–5.8"},
 ]},
 {name:"Ob sveti Gangi",sub:"Haridvār, Prayāga, Kāśī, Gayā",intro:"Ganga se spusti na ravnino. Ob njej je Šrī Caitanya Mahāprabhu prejel iniciacijo in poučil Rūpo in Sanātano.",qs:[
  {p:'haridwar',q:"Ime Haridvār pomeni »vrata k …« komu?",a:["hari","hariju","bogu","gospodu","visnu"],show:"Hariju (Gospodu)",hint:"Eno od imen Gospoda, ki odnaša vse nesrečnosti.",ex:"Haridvār so »vrata k Hariju«, kraj, kjer Ganga zapusti Himalajo in vstopi na ravnino.",src:"ime kraja"},
  {p:'haridwar',q:"Kateri slepi kralj je po Vidurinem nasvetu zapustil palačo in odšel v Saptasroto pri Haridvārju, kjer je zapustil telo v meditaciji?",a:["dhrtarastra","dritarastra","dhritarastra"],show:"Dhṛtarāṣṭra",hint:"Oče Kauravov, stric Pāṇḍavov.",ex:"Vidura je Dhṛtarāṣṭro opomnil na smrt in starost. Dhṛtarāṣṭra je s Gāndhārī odšel v Himalajo, v Saptasroto pri Haridvārju.",src:"Šrīmad-Bhāgavatam 1.13"},
  {p:'prayag',q:"Kateremu bhakti je Šrī Caitanya na Prayāgi deset dni podajal nauke o bhakti-rasi?",a:["rupa","rupa gosvami","rupagosvami","sri rupa"],show:"Šrīla Rūpa Gosvāmī",hint:"Kasneje je napisal Bhakti-rasāmṛta-sindhu in Upadeśāmṛto.",ex:"Na Daśāśvamedha-ghāṭi na Prayāgi je Mahāprabhu Rūpi Gosvāmīju razložil vedo o vdanem služenju in transcendentalnih rasah.",src:"Caitanya-caritāmṛta, Madhya 19"},
  {p:'prayag',q:"Kateri dve sveti reki se vidno stekata na Prayāgi?",all:[["ganga","ganges"],["jamuna","yamuna","jamune"]],show:"Ganga in Jamuna",hint:"Ena je bela, druga temno modra.",ex:"Na Prayāgi se stekata Ganga in Jamuna (po izročilu tudi skrita Sarasvatī). Ko je Mahāprabhu videl Jamuno, je v zanosu skočil vanjo, misleč na Krišno.",src:"Caitanya-caritāmṛta, Madhya 17–18"},
  {p:'kasi',q:"Kateremu velikemu bhakti, ki je pobegnil iz službe pri muslimanskem vladarju, je Šrī Caitanya v Kāśīju dva meseca razlagal vedo o vdanem služenju?",a:["sanatana","sanatana gosvami","sanatanagosvami"],show:"Šrīla Sanātana Gosvāmī",hint:"Starejši brat Rūpe Gosvāmīja.",ex:"Mahāprabhu je Sanātani razložil sambandho (odnos s Krišno), abhidheyo (vdano služenje) in prayojano (Krišna-premo).",src:"Caitanya-caritāmṛta, Madhya 20–24"},
  {p:'kasi',q:"Katerega vodjo majavadi sanjasijev v Kāśīju je Šrī Caitanya pridobil za petje svetih imen?",a:["prakasananda","prakasananda sarasvati","prakasanandasarasvati"],show:"Prakāśānanda Sarasvatī",hint:"Sprva je kritiziral Mahāprabhuja, ker poje in pleše.",ex:"Mahāprabhu je pokazal, da je pomen Vedānte vdano služenje Krišni. Prakāśānanda in njegovi učenci so začeli peti Hare Krišna.",src:"Caitanya-caritāmṛta, Ādi 7 in Madhya 25"},
  {p:'gaya',q:"Od koga je Šrī Caitanya v Gayi prejel iniciacijo?",a:["isvara puri","isvarapuri","isvara"],show:"Īśvara Purī",hint:"Učenec Mādhavendre Purīja.",ex:"Ko je Nimāi Paṇḍita šel v Gayo opravit obred za prednike, je srečal Īśvaro Purīja in od njega sprejel iniciacijo. Od takrat je začel pridigati petje svetih imen.",src:"Caitanya-caritāmṛta, Ādi 17"},
  {p:'gaya',q:"Katero znamenje Gospoda je Šrī Caitanya častil v templju v Gayi in ob tem padel v zanos?",a:["visnupada","stopinja","stopala","stopinje","odtis stopala","lotosova stopala","visnupada"],show:"Viṣṇu-pāda – odtis Višnujevega stopala",hint:"Ganga izvira iz istega dela Gospodovega telesa.",ex:"V templju Viṣṇu-pāda je odtis Gospodovega stopala. Ko je Mahāprabhu slišal o njegovi slavi, ga je preplavila ekstaza.",src:"Caitanya-bhāgavata, Ādi; Caitanya-caritāmṛta, Ādi 17"},
 ]},
 {name:"Južna Indija",sub:"Tirumala, Ahobilam, Šrī Raṅgam, Uḍupī",intro:"Na potovanju po Južni Indiji je Šrī Caitanya obiskal templje Višnuja in Lakṣmī ter povsod navdihnil ljudi k petju Hare Krišna.",qs:[
  {p:'tirumala',q:"Na katerem hribu stoji tempelj Šrī Veṅkaṭeśvare (Bālājīja)?",a:["venkata","venkatacala","tirumala","venkatadri","sesacala","sesadri","venkatagiri"],show:"Veṅkaṭa (Veṅkaṭācala, Tirumala)",hint:"Ime hriba je del Božanstvovega imena.",ex:"Šrī Caitanya je na poti po jugu obiskal Tirumalo in Veṅkaṭa hribe ter tam videl Gospoda kot štiriročnega Višnuja.",src:"Caitanya-caritāmṛta, Madhya 9"},
  {p:'tirumala',q:"V kateri indijski zvezni državi danes leži Tirumala (Tirupati)?",a:["andhra","andhra pradesh","andhrapradesh","andra prades"],show:"Andhra Pradeš",hint:"Država ob vzhodni obali, južno od Odiše.",ex:"Tirumala leži nad mestom Tirupati v Andhra Pradešu in je eden najbolj obiskanih templjev na svetu.",src:"lokacija danes"},
  {p:'ahobilam',q:"Katera inkarnacija Gospoda je čaščena v devetih templjih Ahobilama?",a:["narasimha","nrsimha","narsimha","nrsingha","narasingha","nrsimhadeva"],show:"Gospod Narasiṁha (Nṛsiṁha)",hint:"Pol človek, pol lev.",ex:"Po izročilu je na Ahobilamu Gospod Narasiṁha izstopil iz stebra in ubil demona Hiraṇyakaśipuja.",src:"Šrīmad-Bhāgavatam 7.8; izročilo kraja"},
  {p:'ahobilam',q:"Katerega petletnega bhakto, sina demona Hiraṇyakaśipuja, je Gospod Narasiṁha zaščitil?",a:["prahlada","prahlad","prahlad maharaja","prahlada maharaja"],show:"Prahlāda Mahārāja",hint:"Sošolce je učil o devetih procesih bhakti.",ex:"Prahlāda je kljub mučenju ostal zvest Gospodu. Narasiṁha se je prikazal iz stebra, nato pa ga je Prahlāda pomiril s svojimi molitvami.",src:"Šrīmad-Bhāgavatam 7.5–7.10"},
  {p:'srirangam',q:"Kako se imenuje Božanstvo Višnuja, ki v Šrī Raṅgamu počiva na kači Ananta-Šeši?",a:["ranganatha","rangnath","ranganath","sri ranganatha"],show:"Šrī Raṅganātha",hint:"Ime nosi isto besedo kot ime kraja.",ex:"Šrī Raṅgam je največji tempelj Višnuja in Lakṣmī v Južni Indiji ter središče Šrī sampradāye Rāmānujācārye.",src:"Caitanya-caritāmṛta, Madhya 9"},
  {p:'srirangam',q:"Šrī Caitanya je v Šrī Raṅgamu štiri mesece bival pri Veṅkaṭi Bhaṭṭi. Kateri njegov sin je kasneje postal eden od šestih Gosvāmījev Vṛndāvana?",a:["gopala bhatta","gopalabhatta","gopala bhatta gosvami"],show:"Gopāla Bhaṭṭa Gosvāmī",hint:"V Vṛndāvanu je ustanovil tempelj Rādhā-Ramaṇa.",ex:"V času čāturmāsye je Mahāprabhu živel v hiši Veṅkaṭe Bhaṭṭe. Mladi Gopāla Bhaṭṭa mu je služil in kasneje odšel v Vṛndāvano.",src:"Caitanya-caritāmṛta, Madhya 9"},
  {p:'udupi',q:"Kateri veliki ačarja je v Uḍupīju vzpostavil Božanstvo Krišne?",a:["madhva","madhvacarya","madvacarya","madhvacarja","anandatirtha"],show:"Šrī Madhvācārya",hint:"Ustanovitelj Brahma-Madhva sampradāye, v kateri je tudi Mahāprabhu.",ex:"Madhvācārya je Božanstvo Krišne prejel z ladje, ki je nasedla ob obali. Šrī Caitanya je obiskal Uḍupī in plesal pred Krišno.",src:"Caitanya-caritāmṛta, Madhya 9.245 (razlaga)"},
  {p:'udupi',q:"V čem je bilo skrito Božanstvo Krišne, ki ga je Madhvācārya našel na ladji?",a:["gopicandana","gopi candana","glina","glini","kepi gline","candana"],show:"V kepi gopī-candane (svete gline)",hint:"Iz te snovi vaišnave rišejo tilako.",ex:"Božanstvo je bilo v kepi gopī-candane. Madhvācārya ga je prinesel v Uḍupī, kjer je čaščeno še danes.",src:"Caitanya-caritāmṛta, Madhya 9 (razlaga)"},
 ]},
 {name:"Dežele dharme",sub:"Naimiṣāraṇya, Ayodhyā, Kurukṣetra, Dvārakā",intro:"Kraji, kjer je bil govorjen Bhāgavatam, kjer je vladal Gospod Rāma in kjer je Krišna govoril Bhagavad-gīto.",qs:[
  {p:'naimisa',q:"Kdo je modrecem v gozdu Naimiṣāraṇya pripovedoval Šrīmad-Bhāgavatam?",a:["suta","suta gosvami","sutagosvami","ugrasrava"],show:"Sūta Gosvāmī",hint:"Slišal ga je od Śukadeve Gosvāmīja.",ex:"Modreci so v Naimiṣāraṇyi izvajali tisočletno žrtvovanje in Sūto Gosvāmīja vprašali o tem, kar je najbolj koristno za ljudi Kali-yuge.",src:"Šrīmad-Bhāgavatam 1.1"},
  {p:'naimisa',q:"Kako je ime modrecu, ki je vodil zbrane mudrece v Naimiṣāraṇyi in Sūti postavil vprašanja?",a:["saunaka","sounaka","saunaka rsi"],show:"Śaunaka Ṛṣi",hint:"Njegovo ime se začne s Ś.",ex:"Śaunaka in drugi modreci so postavili šest vprašanj, na katera odgovarja celoten Bhāgavatam.",src:"Šrīmad-Bhāgavatam 1.1"},
  {p:'ayodhya',q:"Kateri avatar se je kot sin kralja Daśarathe pojavil v Ayodhyi?",a:["rama","ramacandra","sri rama","ramachandra"],show:"Gospod Rāmacandra",hint:"Polovica mahā-mantre nosi njegovo ime.",ex:"Gospod Rāma, idealni kralj, se je pojavil v Ayodhyi s Sītā-devī kot večno soprogo, Lakṣmaṇo in Hanumānom kot služabnikoma.",src:"Šrīmad-Bhāgavatam 9.10"},
  {p:'ayodhya',q:"Koliko let je Gospod Rāma po očetovi obljubi preživel v gozdu, preden se je vrnil v Ayodhyo?",a:["14","stirinajst"],show:"14 let",hint:"Dvakrat sedem.",ex:"Da bi očetova beseda ostala resnična, je Rāma s Sīto in Lakṣmaṇo štirinajst let živel v gozdu, nato pa se je zmagoslavno vrnil.",src:"Šrīmad-Bhāgavatam 9.10"},
  {p:'kuruksetra',q:"Komu je Krišna na bojišču Kurukṣetra govoril Bhagavad-gīto?",a:["arjuna","arjun","arjuni"],show:"Arjuni",hint:"Krišnov prijatelj in najboljši lokostrelec med Pāṇḍavi.",ex:"Gīta se začne z besedami dharma-kṣetre kuru-kṣetre. Krišna kot voznik Arjunovega voza ga uči predanosti Sebi.",src:"Bhagavad-gītā 1.1, 18.66"},
  {p:'kuruksetra',q:"Ob katerem nebesnem dogodku so se gopīje in drugi prebivalci Vṛndāvane po dolgi ločitvi zopet srečale s Krišno na Kurukṣetri?",a:["soncni mrk","soncnimrk","mrk","mrku","mrk sonca"],show:"Ob sončnem mrku",hint:"Sonce se za nekaj časa skrije.",ex:"Ob sončnem mrku so se vsi zbrali na Kurukṣetri. Gopīje so si želele Krišno odpeljati nazaj v Vṛndāvano; isto razpoloženje je kazal Mahāprabhu na Ratha-yātri.",src:"Šrīmad-Bhāgavatam 10.82; Caitanya-caritāmṛta, Madhya 13"},
  {p:'dvaraka',q:"Katera je prva med Krišnovimi kraljicami v Dvāraki, inkarnacija boginje sreče?",a:["rukmini","rukminidevi","rukmini devi"],show:"Rukmiṇī-devī",hint:"Krišna jo je ugrabil tik pred njeno poroko s Śiśupālo.",ex:"Rukmiṇī je Krišni poslala pismo po brahmanu. Krišna je prišel in jo odpeljal v Dvārako.",src:"Šrīmad-Bhāgavatam 10.52–54"},
  {p:'dvaraka',q:"Kaj je revni brahman Sudāmā prinesel kot darilo svojemu prijatelju Krišni v Dvāraki?",a:["riz","rizevi kosmici","kosmici","kosmice","cipiran riz","sploscen riz","stolcen riz","rice"],show:"Zdrobljen (sploščen) riž",hint:"Peščico zrnja, zavito v staro krpo.",ex:"Krišna je z veseljem pojedel Sudāmovo skromno darilo in mu brez njegove prošnje podaril vse bogastvo.",src:"Šrīmad-Bhāgavatam 10.80–81"},
 ]},
 {name:"Navadvīpa-dhāma",sub:"rojstni kraj Šrī Caitanye Mahāprabhuja",main:1,intro:"Navadvīpa ima devet otokov, ki predstavljajo devet procesov vdanega služenja. V Māyāpurju se je pojavil Šrī Caitanya Mahāprabhu, Rādhā in Krišna v eni osebi, ki je razširil saṅkīrtano.",qs:[
  {p:'mayapur',q:"Ob katerem nebesnem dogodku se je pojavil Šrī Caitanya, ko so vsi ljudje ob Gangi peli sveta imena?",a:["lunin mrk","luninmrk","mrk","mrku","mrk lune"],show:"Ob luninem mrku (na Phālguna pūrṇimo)",hint:"Polna luna se je skrila.",ex:"Mahāprabhu se je pojavil leta 1486 ob polni luni meseca Phālguna med luninim mrkom. Ljudje so se kopali v Gangi in peli Hari! Hari!",src:"Caitanya-caritāmṛta, Ādi 13"},
  {p:'mayapur',q:"Zakaj so malega Caitanyo klicali Nimāi?",a:["nim","neem","nimba","nimbovo","nimbovim","pod drevesom","drevo"],show:"Pojavil se je pod drevesom nim (nimba)",hint:"Drevo z grenkimi listi.",ex:"Ker se je pojavil pod drevesom nimba, so ga ljubkovalno klicali Nimāi.",src:"Caitanya-caritāmṛta, Ādi 13"},
  {p:'mayapur',q:"Kako je ime Caitanyini materi?",a:["saci","sacidevi","saci devi","saci mata","sacimata"],show:"Šacī-devī",hint:"Oče je bil Jagannātha Miśra.",ex:"Šacī-devī in Jagannātha Miśra sta bila Gospodova starša. Šacī je Nimāija vzgajala z neizmerno ljubeznijo.",src:"Caitanya-caritāmṛta, Ādi 13"},
  {p:'navadvip',q:"Kateri starejši bhakta je z Gangino vodo in listi tulasī glasno klical Gospoda, naj se prikaže in reši ljudi Kali-yuge?",a:["advaita","advaita acarya","advaitacarya","advaita prabhu"],show:"Advaita Ācārya",hint:"Inkarnacija Mahā-Viṣṇuja in Šive hkrati.",ex:"Advaita Ācārya je videl, da so ljudje brez vdanosti, zato je častil Gospoda z Gangino vodo in tulasī ter ga s klici priklical na Zemljo.",src:"Caitanya-caritāmṛta, Ādi 3"},
  {p:'navadvip',q:"Na čigavem dvorišču je Mahāprabhu z bhaktami vso noč pel kirtan za zaprtimi vrati?",a:["srivasa","srivas","srivasa thakura","srivasa angana","srivasaangana"],show:"Na dvorišču Šrīvāse Ṭhākure (Śrīvāsa-aṅgana)",hint:"Njegovo ime se začne s Śrī.",ex:"Leto dni je Mahāprabhu z bhaktami vsako noč pel v hiši Šrīvāse Ṭhākure, kjer je razkril svojo božansko naravo.",src:"Caitanya-caritāmṛta, Ādi 17"},
  {p:'navadvip',q:"Kako sta se imenovala pijana brata, ki sta Nityānando udarila, a ju je ta z ljubeznijo odrešil?",a:["jagai","madhai","jagaiinmadhai","jagai madhai"],show:"Jagāi in Mādhāi",hint:"Imeni se rimata.",ex:"Mādhāi je Nityānando udaril s črepinjo, Nityānanda pa ju je kljub temu prosil Mahāprabhuja za milost. Oba sta postala bhakti.",src:"Caitanya-caritāmṛta, Ādi 17"},
  {p:'navadvip',q:"Katerega muslimanskega sodnika, ki je prepovedal kirtan, je Mahāprabhu pridobil z množično procesijo petja?",a:["kazi","cand kazi","candkazi","chand kazi"],show:"Čānd Kazi",hint:"Njegov naziv pomeni sodnik.",ex:"Mahāprabhu je organiziral veliko procesijo s tisoči bakel in ljudi, ki so peli. Kazi se je spreobrnil in obljubil, da kirtana ne bo nihče več oviral.",src:"Caitanya-caritāmṛta, Ādi 17"},
  {p:'navadvip',q:"Koliko let je bil star Šrī Caitanya, ko je zapustil Navadvīpo in sprejel sannyās?",a:["24","stiriindvajset"],show:"24 let",hint:"Med 20 in 30.",ex:"Ob koncu 24. leta je Mahāprabhu v Kāṭwi sprejel sannyās od Keśave Bhāratīja, da bi lahko pridigal vsem.",src:"Caitanya-caritāmṛta, Ādi 13 in 17"},
  {p:'mayapur',q:"Kateri veliki ačarja je v 19. stoletju odkril točen kraj pojavitve Šrī Caitanye v Māyāpurju?",a:["bhaktivinoda","bhaktivinoda thakura","bhaktivinodthakur","bhaktivinod","jagannatha dasa babaji","jagannath das babaji"],show:"Šrīla Bhaktivinoda Ṭhākura (potrdil Jagannātha dāsa Bābājī)",hint:"Oče Bhaktisiddhānte Sarasvatīja.",ex:"Bhaktivinoda Ṭhākura je leta 1888 odkril Yogapīṭho, kraj Mahāprabhujeve pojavitve. Potrdil jo je Jagannātha dāsa Bābājī: star več kot sto let in skoraj slep, so ga tja prinesli v košu, ob prihodu pa je skočil iz koša in v zanosu zaplesal. Šrīla Prabhupāda je v Māyāpurju zgradil svetovno središče ISKCON-a.",src:"Prabhupādove razlage Caitanya-caritāmṛte"},
 ]},

const MANTRA_HTML = '<span class="ml">Hare Krišna Hare Krišna Krišna Krišna Hare Hare</span><span class="ml">Hare Rāma Hare Rāma Rāma Rāma Hare Hare</span>';

/* ---------- Primerjanje odgovorov ---------- */
function norm(s){
  s=String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  s=s.replace(/sh/g,'s').replace(/ch/g,'c').replace(/([tdbgkpj])h/g,'$1').replace(/w/g,'v').replace(/y/g,'j').replace(/ri/g,'r');
  return s.replace(/(.)\1+/g,'$1');
}
function lev(a,b){const m=a.length,n=b.length;let d=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){let p=d[0];d[0]=i;for(let j=1;j<=n;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[n]}
function hit(inp,alias){
  const a=norm(alias); if(!a) return false;
  if(inp===a||inp.includes(a)) return true;
  const stem=a.replace(/[aeiou]$/,''); if(stem.length>=4&&inp.includes(stem)) return true;
  if(a.length>=5){const tol=a.length>=9?2:1; if(lev(inp,a)<=tol) return true;}
  return false;
}
function check(q,raw){
  const inp=norm(raw); if(!inp) return false;
  if(q.all) return q.all.every(g=>g.some(al=>hit(inp,al)));
  return q.a.some(al=>hit(inp,al));
}
function checkMantra(raw){
  const t=norm(MANTRA); const i=norm(raw);
  return i===t || lev(i,t)<=3;
}

  <rect x="-120" y="-40" width="240" height="40" fill="${sil}"/>
  <path d="M-70 -40 L-70 -90 C-78 -220 -34 -282 0 -292 C34 -282 78 -220 70 -90 L70 -40 Z" fill="${sil}"/>
  ${[-45,-22,0,22,45].map(v=>`<path d="M${v} -60 C${v*1.05} -170 ${v*.6} -250 ${v*.2} -284" stroke="rgba(233,184,78,.25)" stroke-width="2" fill="none"/>`).join('')}
  <ellipse cx="0" cy="-298" rx="30" ry="9" fill="${sil}"/><path d="M-8 -306 Q0 -330 8 -306Z" fill="${sil}"/>
  <circle cx="0" cy="-350" r="18" fill="none" stroke="#E9B84E" stroke-width="4"/>
  ${[0,45,90,135].map(a=>`<line x1="0" y1="-350" x2="${18*Math.cos(a*Math.PI/180)}" y2="${-350+18*Math.sin(a*Math.PI/180)}" stroke="#E9B84E" stroke-width="2.5" transform="rotate(0)"/><line x1="0" y1="-350" x2="${-18*Math.cos(a*Math.PI/180)}" y2="${-350-18*Math.sin(a*Math.PI/180)}" stroke="#E9B84E" stroke-width="2.5"/>`).join('')}
  <line x1="0" y1="-330" x2="0" y2="-420" stroke="${sil}" stroke-width="4"/><path d="M0 -420 L70 -404 L0 -388Z" fill="#EE7F2D"/>
  </g>`;
}
function smallTemple(x,y,s,sil){
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-60" y="-50" width="120" height="50" fill="${sil}"/><path d="M-44 -50 C-48 -140 -20 -180 0 -186 C20 -180 48 -140 44 -50Z" fill="${sil}"/><circle cx="0" cy="-194" r="8" fill="${sil}"/><line x1="0" y1="-196" x2="0" y2="-250" stroke="${sil}" stroke-width="3"/><path d="M0 -250 L40 -240 L0 -230Z" fill="#EE7F2D"/></g>`;
}

  if(sc.moon){let r=7;for(let i=0;i<70;i++){r=(r*9301+49297)%233280;const x=r/233280*W;r=(r*9301+49297)%233280;const y=r/233280*420;g+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${i%5?1.2:2}" fill="#F4E5BC" opacity=".7"/>`}

  }
  if(sc.peaks==='rock'){
    g+=`<path d="M0 560 L90 470 L150 500 L260 390 L340 460 L430 380 L560 480 L660 410 L760 470 L880 380 L990 470 L1100 420 L1200 470 L1200 800 L0 800Z" fill="#5a3f45" opacity=".9"/>`;
    g+=`<path d="M0 640 L140 560 L260 610 L400 540 L560 620 L720 550 L880 620 L1040 560 L1200 620 L1200 800 L0 800Z" fill="#2b2236"/>`;
  }

  if(sc.water==='river'){ g+=`<rect y="610" width="1200" height="190" fill="${sc.wc}" opacity=".75"/>`; for(let i=0;i<6;i++) g+=`<path d="M${(i*197)%1100} ${640+i*24} q 30 -8 60 0 t 60 0" stroke="#F4E5BC" stroke-width="2" fill="none" opacity=".35"/>`; }

const KEY='sveta-mesta-v1';

const maxPer=()=>TOTALQ/S.players.length*4+STAGES.length*4;

let mosaicTimer=null;
function startScene(){
  sceneKey='__start';
  const keys=['radhakunda','puri','mayapur','kailas','vrindavan','srirangam','haridwar','dvaraka','govardhan'];
  const pool=Object.keys(PLACES).filter(k=>PLACES[k].img&&!['gambhira','radhadamodar','navadvip'].includes(k));
  const tile=(k,i)=>`<div class="tile${i===0?' big':''}" data-k="${k}"><img alt="${esc(PLACES[k].name)}" src="${photoUrl(PLACES[k].img,i===0?1600:800)}" onload="this.classList.add('in')" onerror="this.remove()"><span>${esc(PLACES[k].name.split(' – ')[0].split(' (')[0])}</span></div>`;
  $('scene').innerHTML=scene(PLACES.radhakunda.sc)+`<div class="mosaic">${keys.map(tile).join('')}</div><div class="shade"></div>`;
  clearInterval(mosaicTimer); let n=0;
  mosaicTimer=setInterval(()=>{
    if(sceneKey!=='__start'){clearInterval(mosaicTimer);return}
    const tiles=[...document.querySelectorAll('.mosaic .tile')].slice(1); if(!tiles.length)return;
    const t=tiles[n++%tiles.length]; const used=[...document.querySelectorAll('.mosaic .tile')].map(x=>x.dataset.k);
    const free=pool.filter(k=>!used.includes(k)); if(!free.length)return;
    const k=free[Math.floor(Math.random()*free.length)];
    const im=new Image(); im.alt=PLACES[k].name; im.onload=()=>{const old=t.querySelector('img');t.dataset.k=k;t.querySelector('span').textContent=PLACES[k].name.split(' – ')[0].split(' (')[0];t.prepend(im);requestAnimationFrame(()=>im.classList.add('in'));if(old)setTimeout(()=>old.remove(),1500)};
    im.src=photoUrl(PLACES[k].img,800);
  },4500);
}

    <p>${st.intro}</p>
    <div class="stages">${STAGES.map((x,i)=>`<div class="st ${i<S.stage?'done':i===S.stage?'now':''} ${x.main?'main':''}"><div class="dot">${i<S.stage?'✓':i+1}</div><div style="min-width:0"><div class="nm">${x.name}</div><div class="sb">${x.sub}</div></div></div>`).join('')}</div>
    <div class="mapwrap">${bigMap(k=>{const si=STAGES.findIndex(x=>x.qs.some(q=>q.p===k||(k==='puri'&&['rathayatra','gambhira'].includes(q.p))||(k==='vrindavan'&&q.p==='radhadamodar')||(k==='mayapur'&&q.p==='navadvip')));return si<S.stage?'done':si===S.stage?'now':'next'},false)}
      <div class="legend"><span><i style="background:#E9B84E"></i>obiskano</span><span><i style="background:#EE7F2D"></i>ta stopnja</span><span><i style="background:rgba(174,179,206,.55)"></i>sledi</span></div></div>
    <div style="display:grid;gap:10px">${lad}</div>
    <p class="src">Lestvica stopenj vdanosti po Nektarju vdanosti (Bhakti-rasāmṛta-sindhu) je tu le simbol napredka v igri.</p>
    <div class="row"><button class="btn" id="enter">Vstopi: ${st.name}</button><button class="link" id="quit">Nova igra</button></div>
  </div>`);
  $('enter').onclick=()=>{S.view='q';S.att=1;save();qScreen()};
  $('quit').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){};startScreen()};
}

function qScreen(fb){
  const st=STAGES[S.stage], q=st.qs[S.qi], pl=S.gq%S.players.length, P=PLACES[q.p];
  renderPlayers(pl); setScene(q.p);
  const answered=fb&&(fb.type==='ok'||fb.type==='reveal');
  stageEl(`<div class="card">
    <div class="prog"><i style="width:${(S.gq/TOTALQ*100).toFixed(1)}%"></i></div>
    <div class="place-head"><div style="min-width:0"><div class="eyebrow">${st.name} · ${S.qi+1}/${st.qs.length}</div><h2>${P.name}</h2></div><div class="where">${miniMap(q.p)}<div class="loc" style="max-width:150px">${P.loc}</div></div></div>
    <div class="muted" style="font-size:14px">Na vrsti: <b style="color:var(--candana)">${esc(cur().name)}</b> · ${S.att===1?'4 tilake':'2 tilaki'}</div>
    <div class="q">${q.q}</div>
    ${fb?fbHtml(fb,q):''}
    ${answered?`<div class="row"><button class="btn" id="next">${nextLabel()}</button></div>`:`
    <form id="f" class="row" autocomplete="off"><input type="text" id="ans" placeholder="Napiši odgovor …" aria-label="Odgovor"><button class="btn" type="submit">Odgovori</button>${S.att===1?`<button class="btn ghost" type="button" id="dunno">Namig</button>`:`<button class="btn ghost" type="button" id="reveal">Pokaži odgovor</button>`}</form>
    ${fb&&fb.type==='no'?`<button class="link" id="mine" type="button">Moj odgovor je bil pravilen (+${S.att===1?4:2})</button>`:''}`}
  </div>`);
  if(answered){$('next').onclick=advance;$('next').focus();return}
  const inp=$('ans'); inp.focus();
  $('f').onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;
    if(check(q,v)) return award(S.att===1?4:2,v);
    if(S.att===1){S.att=2;save();qScreen({type:'no',first:true,val:v})} else {qScreen({type:'reveal',val:v})}
  };
  if($('dunno')) $('dunno').onclick=()=>{S.att=2;save();qScreen({type:'hint'})};
  if($('reveal')) $('reveal').onclick=()=>qScreen({type:'reveal'});
  if($('mine')) $('mine').onclick=()=>award(S.att===1?4:2);
}
function fbHtml(fb,q){
  if(fb.type==='ok') return `<div class="fb ok"><strong>Pravilno! +${fb.pts} tilak${fb.pts===4?'e':'i'}</strong><span>${q.show}</span><p>${q.ex}</p><span class="src">${q.src}</span></div>`;
  if(fb.type==='reveal') return `<div class="fb no"><strong>Pravilen odgovor: ${q.show}</strong><p>${q.ex}</p><span class="src">${q.src}</span></div>`;
  return `<div class="fb hint"><strong>${fb.type==='no'?'Še ne. Poskusi znova':'Namig'}</strong><span>${q.hint}</span></div>`;
}
function award(pts){
  cur().score+=pts;cur().ok++;S.answered=true;save();
  qScreen({type:'ok',pts});
  const b=document.createElement('div');b.className='burst';b.innerHTML=Array(pts).fill(TILAKA('#E9B84E')).join('');$('stage').appendChild(b);setTimeout(()=>b.remove(),1700);
}
function nextLabel(){const st=STAGES[S.stage];return S.qi+1<st.qs.length?'Naslednje vprašanje':'Zaključi stopnjo'}
function advance(){
  const st=STAGES[S.stage];S.gq++;S.att=1;
  if(S.qi+1<st.qs.length){S.qi++;save();return qScreen()}
  S.view='mantra';S.mp=0;save();mantraScreen();
}

function mantraScreen(fb){
  const p=S.players[S.mp];renderPlayers(S.mp);setScene(STAGES[S.stage].qs[STAGES[S.stage].qs.length-1].p);
  stageEl(`<div class="card">
    <div class="eyebrow">Konec stopnje ${S.stage+1} · Yuga-dharma</div>
    <h2>Petje svetih imen</h2>
    <p>Za to dobo Kali je Gospod določil en sam proces: harer nāma harer nāma harer nāmaiva kevalam, kalau nāsty eva nāsty eva nāsty eva gatir anyathā. Sveto ime je edina pot.</p>
    <p class="src">Bṛhan-nāradīya Purāṇa, navedeno v Caitanya-caritāmṛti, Ādi 17.21</p>
    ${fb==='ok'?`<div class="fb ok"><strong>${esc(p.name)}: +4 tilake</strong><div class="mantra">${MANTRA_HTML}</div></div>`:fb==='no'?`<div class="fb hint"><strong>Skoraj. Mantra ima 16 imen:</strong><div class="mantra">${MANTRA_HTML}</div></div>`:''}
    ${fb?`<div class="row"><button class="btn" id="mnext">${S.mp+1<S.players.length?'Naslednji igralec':'Na pot naprej'}</button></div>`:`
    <div class="muted" style="font-size:14px">Na vrsti: <b style="color:var(--candana)">${esc(p.name)}</b> · napiši Hare Krišna mahā-mantro po spominu za 4 dodatne tilake</div>
    <textarea id="mt" placeholder="Hare …" aria-label="Mahā-mantra"></textarea>
    <div class="row"><button class="btn" id="mcheck">Preveri</button><button class="btn ghost" id="mskip">Preskoči</button></div>`}
  </div>`);
  if(fb){$('mnext').onclick=()=>{if(S.mp+1<S.players.length){S.mp++;save();mantraScreen()}else nextStage()};return}
  $('mt').focus();
  $('mcheck').onclick=()=>{if(checkMantra($('mt').value)){p.score+=4;save();mantraScreen('ok')}else mantraScreen('no')};
  $('mskip').onclick=()=>{if(S.mp+1<S.players.length){S.mp++;save();mantraScreen()}else nextStage()};
}
function nextStage(){
  if(S.stage+1<STAGES.length){S.stage++;S.qi=0;S.view='map';save();mapScreen()}
  else{S.done=true;save();endScreen()}
}
function endScreen(){
  renderPlayers(-1);setScene('vrindavan');
  const r=[...S.players].sort((a,b)=>b.score-a.score);
  const tie=r.length>1&&r[0].score===r[1].score;
  const gal=ROUTE.map((k,i)=>{const P=PLACES[k];return `<figure class="thumb"><div class="ph">${scene(P.sc)}${P.img?`<img loading="lazy" alt="${esc(P.name)}" src="${photoUrl(P.img,480)}" onload="this.classList.add('in')" onerror="this.remove()">`:''}<span class="no">${i+1}</span></div><figcaption><b>${esc(P.name)}</b><small>${esc(P.loc)}</small></figcaption></figure>`}).join('');
  stageEl(`<div class="card wide">
    <div class="eyebrow">Romanje je dokončano · Vṛndāvana</div>
    <h2>${S.players.length>1?(tie?'Neodločeno med najboljšimi':`Zmagovalec: ${esc(r[0].name)}`):`${esc(r[0].name)}, prišel si do Vṛndāvane`}</h2>
    <div class="rank">${r.map((p,i)=>`<div class="r ${i===0?'first':''}"><span class="pos">${i+1}</span><span class="nm">${esc(p.name)}<br><span class="muted" style="font-size:13px">${p.ok} pravilnih · stopnja ${LADDER[rankOf(p)]}</span></span><span class="pts">${TILAKA('#E9B84E')}${p.score}</span></div>`).join('')}</div>
    <p>Šrī Caitanya Mahāprabhu je prinesel Krišna-premo vsem, brez razlike. Romanje po svetih mestih se v srcu nadaljuje s petjem svetih imen.</p>
    <div class="mantra">${MANTRA_HTML}</div>
    <h3>Pot romanja</h3>
    <div class="mapwrap">${bigMap(null,true)}<span class="src">Shematski zemljevid. Številke ustrezajo sličicam spodaj.</span></div>
    <h3>Sveta mesta v igri</h3>
    <div class="gallery">${gal}</div>
    <div class="row"><button class="btn" id="again">Igraj znova</button></div>
  </div>`);
  $('again').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){};startScreen()};
}

/* ---------- Navodila ---------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;const b=$('installBtn');if(b)b.hidden=false});
const standalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
function helpScreen(){
  renderPlayers(-1);setScene('navadvip');
  stageEl(`<div class="card help">
    <div class="eyebrow">Navodila</div>
    <h2>Kako igrati Sveta mesta</h2>
    <video controls playsinline preload="metadata" poster="navodila-poster.jpg" src="navodila.mp4">Video z navodili se v tem brskalniku ne predvaja.</video>
    <h3>Cilj igre</h3>
    <p>Prepotuješ sveta mesta Indije od izvira Gange do Vṛndāvane in zbiraš tilake. Ob tem spoznaš zabave Gospoda, Božanstva in velike bhakte, ki so ta mesta obiskali. Zmaga, kdor do konca zbere največ tilak.</p>
    <h3>Potek</h3>
    <ol>
      <li>Vpiši imena 1 do 4 igralcev in pritisni <b>Začni romanje</b>.</li>
      <li>Romanje ima 7 stopenj: Himalaja, Ob Gangi, Južna Indija, Dežele dharme, Navadvīpa-dhāma, Jagannātha Purī in na koncu Vṛndāvana.</li>
      <li>Pri vsakem vprašanju v ozadju vidiš sveto mesto. Odgovor napiši v polje in pritisni <b>Odgovori</b> ali tipko Enter.</li>
      <li>Igralci odgovarjajo izmenično. Kdo je na vrsti, piše nad vprašanjem in je označeno zgoraj.</li>
    </ol>
    <h3>Točke – tilake</h3>
    <ul>
      <li>Pravilno v prvem poskusu: <b style="color:var(--gold)">+4 tilake</b>.</li>
      <li>Napačno ali gumb <b>Namig</b>: dobiš namig, pravilno v drugem poskusu prinese +2.</li>
      <li>Če še vedno ne veš, se pokaže pravilen odgovor z zgodbo kraja in virom. Igra gre naprej, nihče ne obstane.</li>
      <li>Pravopis ni pomemben: šumniki, diakritike in običajne različice zapisa (Krišna, Krishna, Kṛṣṇa) štejejo enako. Če igra pravilnega odgovora ne prepozna, pritisni <b>Moj odgovor je bil pravilen</b>.</li>
      <li>Po vsaki stopnji lahko vsak igralec po spominu napiše Hare Krišna mahā-mantro za +4 tilake. To je yuga-dharma za dobo Kali.</li>
    </ul>
    <h3>Napredovanje</h3>
    <p>Na zemljevidu med stopnjami vidiš, kje si na lestvici devetih stopenj vdanosti iz Nektarja vdanosti: śraddhā, sādhu-saṅga, bhajana-kriyā, anartha-nivṛtti, niṣṭhā, ruci, āsakti, bhāva in prema. Več tilak pomeni višjo stopnjo. Lestvica je simbol napredka v igri. Igra se sproti shranjuje, zato jo lahko nadaljuješ pozneje na isti napravi.</p>
    <h3>Namestitev kot aplikacija</h3>
    <div class="row"><button class="btn" id="installBtn" type="button" hidden>Namesti aplikacijo</button>${standalone()?'<span class="muted">Igra že teče kot nameščena aplikacija.</span>':''}</div>
    <div class="dev">
      <div><b>Android</b><p>Odpri igro v Chromu. Meni ⋮ → <i>Namesti aplikacijo</i> ali <i>Dodaj na začetni zaslon</i>.</p></div>
      <div><b>iPhone in iPad</b><p>Odpri igro v Safariju. Gumb Deli (kvadrat s puščico) → <i>Dodaj na začetni zaslon</i> → Dodaj.</p></div>
      <div><b>Windows in Linux</b><p>Odpri igro v Chromu ali Edgeu. Klikni ikono za namestitev desno v naslovni vrstici ali meni → <i>Namesti Sveta mesta</i>.</p></div>
      <div><b>Mac</b><p>V Chromu: ikona za namestitev v naslovni vrstici. V Safariju: Datoteka → <i>Dodaj v Dock</i>.</p></div>
    </div>
    <p class="src">Nameščena aplikacija se odpre v svojem oknu z ikono tilake in po prvem zagonu deluje tudi brez interneta.</p>
    <h3>Viri fotografij</h3>
    <p class="muted" style="font-size:14px">Fotografije svetih mest so z Wikimedia Commons in so prosto dostopne. Avtor in licenca sta navedena na strani vsake slike.</p>
    <div class="credits">${Object.values(PLACES).filter(x=>x.img).map(x=>`<a href="${COMMONS}File:${encodeURIComponent(x.img)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join('')}</div>
    <div class="row"><button class="btn" id="hback" type="button">${S?'Nazaj v igro':'Na začetek'}</button></div>
  </div>`);
  if(installEvt) $('installBtn').hidden=false;
  $('installBtn').onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;$('installBtn').hidden=true};
  $('hback').onclick=()=>S?route():startScreen();
}
$('helpBtn').onclick=helpScreen;
if('serviceWorker' in navigator && location.protocol==='https:' && !/claude\.ai|claudeusercontent/.test(location.host)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}

startScreen();
</script>

</body>
</html>
