   "With what did King Satyavrata tie the boat to Lord Matsya's horn during the deluge?",["With the serpent Vāsuki as a rope","With a coconut-fibre rope","With lotus stems"],
   "Following the Lord's instructions, the King anchored the boat to the fish's horn, using the great serpent Vāsuki as a rope. Satisfied, he began offering prayers to the Lord."],
  ['nagalapuram',[SB+' 8.24.32',SB+' 8.24.32'],
   "Kdaj naj bi po napovedi Gospoda Matsye nastopil potop treh svetov?",["Sedmi dan od napovedi","Štirideseti dan od napovedi","Čez eno leto"],
   "Gospod je Satyavrati rekel, da bodo trije svetovi sedmi dan od tedaj potonili v oceanu razdejanja, in mu obljubil, da mu bo poslal veliko ladjo.",
   "When, according to Lord Matsya, would the three worlds be flooded?",["On the seventh day from then","On the fortieth day from then","After one year"],
   "The Lord told Satyavrata that on the seventh day from then the three worlds would be inundated by the ocean of devastation, and promised to send him a large boat."],
  ['nagalapuram',[TRAD[0],TRAD[1]],
   "Kaj je posebnega pri Božanstvu Vedanārāyaṇe v Nagalapuramu?",["Zgornji del telesa je Viṣṇujev, spodnji pa ribji","Je izrezljano iz lesa kot Jagannātha","Leži na kači Ananti"],
   "Vedanārāyaṇa je upodobljen kot Viṣṇu, čigar spodnji del telesa je riba.",
   "What is special about the Deity of Vedanārāyaṇa in Nagalapuram?",["The upper body is Viṣṇu's and the lower body a fish's","He is carved of wood like Jagannātha","He reclines on the serpent Ananta"],
   "Vedanārāyaṇa is shown as Viṣṇu whose lower body is a fish."],
  ['srikurmam',[SB+' 8.7.10',SB+' 8.7.10'],
   "Kako je Gospod Kūrma doživljal vrtenje gore Mandara na svojem hrbtu?",["Kot prijetno praskanje telesa","Kot težko breme","Kot bolečino, ki jo je potrpežljivo prenašal"],
   "Ko so polbogovi in demoni pinjili ocean mleka, je velikanska želva vrtenje gore sprejela kot praskanje svojega telesa, zato ji je bilo prijetno.",
   "How did Lord Kūrma experience the rotation of Mandara Mountain on His back?",["As a pleasant scratching of His body","As a heavy burden","As pain He patiently tolerated"],
   "When the demigods and demons churned the ocean of milk, the gigantic tortoise accepted the rolling of the mountain as a means of scratching His body, so it was pleasing to Him."],
  ['srikurmam',[SB+' 8.7',SB+' 8.7'],
   "Katera gora je pri pinjenju oceana mleka služila kot pinjalo?",["Mandara","Govardhana","Meru"],
   "Polbogovi in demoni so goro Mandara uporabili kot pinjalo, kačo Vāsuki pa kot vrv. Ko je gora začela toniti, se je Gospod pojavil kot želva Kūrma in jo dvignil na svoj hrbet.",
   "Which mountain served as the churning rod when the ocean of milk was churned?",["Mandara","Govardhana","Meru"],
   "The demigods and demons used Mandara Mountain as the churning rod and the serpent Vāsuki as the rope. When the mountain began to sink, the Lord appeared as the tortoise Kūrma and held it up on His back."],
  ['srikurmam',[CC+', Madhya 7',CC+', Madhya 7'],
   "Koga je Śrī Caitanya Mahāprabhu ozdravil v Kūrma-kṣetri?",["Gobavega brāhmaṇo Vāsudevo","Sārvabhaumo Bhaṭṭācāryo","Kralja Pratāparudro"],
   "Vāsudeva je imel gobavost in rane, polne črvov; če je kateri padel, ga je vrnil nazaj. Mahāprabhu ga je objel in bolezen je izginila. Sārvabhauma Bhaṭṭācārya je Gospoda zato opeval z imenom Vāsudevāmṛta-prada, tisti, ki je Vāsudevi podaril nektar.",
   "Whom did Śrī Caitanya Mahāprabhu heal at Kūrma-kṣetra?",["The leper brāhmaṇa Vāsudeva","Sārvabhauma Bhaṭṭācārya","King Pratāparudra"],
   "Vāsudeva suffered from leprosy and his sores were full of worms; if one fell off, he put it back. Mahāprabhu embraced him and the disease vanished. Sārvabhauma Bhaṭṭācārya therefore glorified the Lord with the name Vāsudevāmṛta-prada, the giver of nectar to Vāsudeva."],
  ['srikurmam',[CC+', Madhya 7.128',CC+', Madhya 7.128'],
   "Kaj je Mahāprabhu naročil brāhmaṇi Kūrmi, ki je želel zapustiti dom in iti z Njim?",["Naj ostane doma in vsakogar, ki ga sreča, uči o Kṛṣṇi","Naj takoj sprejme sannyāso","Naj odide živet v Vṛndāvano"],
   "»Kogar koli srečaš, ga uči o navodilih Kṛṣṇe iz Bhagavad-gīte in Śrīmad-Bhāgavatama. Tako postani duhovni učitelj in osvobodi vse v tej deželi.« Śrīla Prabhupāda je ta verz imel za temelj svoje pridige.",
   "What did Mahāprabhu tell the brāhmaṇa Kūrma, who wanted to leave home and follow Him?",["To stay home and teach everyone he meets about Kṛṣṇa","To accept sannyāsa at once","To go and live in Vṛndāvana"],
   "“Instruct everyone you meet in the teachings of Kṛṣṇa from the Bhagavad-gītā and Śrīmad-Bhāgavatam. In this way become a spiritual master and liberate everyone in this land.” Śrīla Prabhupāda took this verse as the basis of his preaching."],
  ['tvaraha',[SB+' 3.13.18',SB+' 3.13.18'],
   "Kako se je pojavil Gospod Varāha?",["Iz Brahmājeve nosnice, velik kot vrh palca","Iz stebra v palači","Iz oceana mleka"],
   "Medtem ko je Brahmā razmišljal, kako bi rešil Zemljo, je iz njegove nosnice nenadoma prišel majhen merjasec, ne večji od vrha palca. Nato je zrasel v ogromno obliko.",
   "How did Lord Varāha appear?",["From Brahmā's nostril, the size of the tip of a thumb","From a pillar in a palace","From the ocean of milk"],
   "While Brahmā was thinking how to rescue the earth, a small boar, no bigger than the upper portion of a thumb, suddenly came out of his nostril. He then grew to a gigantic size."],
  ['tvaraha',[SB+' 3.13',SB+' 3.13'],
   "Kaj je Gospod Varāha dvignil iz vode na svojih oklih?",["Zemljo","Goro Mandaro","Vede"],
   "Zemlja je potonila v ocean Garbhodaka. Gospod Varāha se je potopil, jo našel in jo na svojih oklih dvignil iz vode, polbogovi pa so ga opevali.",
   "What did Lord Varāha lift out of the water on His tusks?",["The earth","Mandara Mountain","The Vedas"],
   "The earth had sunk into the Garbhodaka Ocean. Lord Varāha dived in, found her and lifted her out of the water on His tusks while the demigods glorified Him."],
  ['srimushnam',[SB+' 3.18–19',SB+' 3.18–19'],
   "Katerega demona je ubil Gospod Varāha, ko je dvigal Zemljo?",["Hiraṇyākṣo","Hiraṇyakaśipuja","Kaṁso"],
   "Ko je Gospod Varāha dvigal Zemljo, ga je napadel demon Hiraṇyākṣa, Hiraṇyakaśipujev brat. Gospod ga je v boju ubil.",
   "Which demon did Lord Varāha kill while lifting the earth?",["Hiraṇyākṣa","Hiraṇyakaśipu","Kaṁsa"],
   "As Lord Varāha was lifting the earth, the demon Hiraṇyākṣa, Hiraṇyakaśipu's brother, attacked Him. The Lord killed him in battle."],
  ['tvaraha',[TRAD[0],TRAD[1]],
   "Zakaj romarji v Tirumali po izročilu najprej počastijo Gospoda Varāho?",["Ker je dovolil Śrīnivāsi (Veṅkaṭeśvari), da prebiva na hribu","Ker je njegov tempelj najvišji na hribu","Ker je Varāha zgradil glavni tempelj"],
   "Tirumala se imenuje Ādi-Varāha-kṣetra. Po izročilu je Gospod Varāha že prebival na hribu, ko je prišel Śrīnivāsa, in mu dovolil ostati. Zato romarji obiščejo tempelj Bhū-Varāhe ob jezeru Svāmī Puṣkariṇī pred Veṅkaṭeśvaro.",
   "Why, by tradition, do pilgrims in Tirumala first honor Lord Varāha?",["Because He allowed Śrīnivāsa (Veṅkaṭeśvara) to reside on the hill","Because His temple is the highest on the hill","Because Varāha built the main temple"],
   "Tirumala is called Ādi-Varāha-kṣetra. By tradition Lord Varāha was already residing on the hill when Śrīnivāsa came, and He allowed Him to stay. So pilgrims visit the Bhū-Varāha temple by Svāmī Puṣkariṇī lake before Veṅkaṭeśvara."],
  ['srimushnam',[TRAD[0],TRAD[1]],
   "Kaj pomeni, da je Božanstvo Bhū-Varāhe v Śrīmuṣṇamu svayaṁ-vyakta?",["Pojavilo se je samo, ni ga izklesal človek","Je iz čistega zlata","Pripeljali so ga iz Ayodhye"],
   "Svayaṁ-vyakta pomeni »samo razodeto«. Śrīmuṣṇam je eno od osmih takih svetišč Viṣṇuja v Južni Indiji; Božanstvo Bhū-Varāhe je po izročilu śālagrāma, ki se je pojavila sama.",
   "What does it mean that the Bhū-Varāha Deity in Śrīmuṣṇam is svayaṁ-vyakta?",["He appeared by Himself and was not carved by anyone","He is made of pure gold","He was brought from Ayodhyā"],
   "Svayaṁ-vyakta means “self-manifested”. Śrīmuṣṇam is one of eight such shrines of Viṣṇu in South India; by tradition the Bhū-Varāha Deity is a śālagrāma that appeared by Himself."]
 ],
 /* B Narasiṁha */ [
  ['simhachalam',[CC+', Madhya 8.3',CC+', Madhya 8.3'],
   "Pod katerim imenom Caitanya-caritāmṛta omenja svetišče Narasiṁhe na Siṁhācalamu?",["Jiyaḍa-nṛsiṁha","Ahovala-nṛsiṁha","Yogānanda-nṛsiṁha"],
   "Na potovanju po jugu je Mahāprabhu po nekaj dneh prispel do svetega kraja Jiyaḍa-nṛsiṁha. Śrīla Prabhupāda v razlagi pojasni, da tempelj stoji na hribu Siṁhācala blizu Visakhapatnama.",
   "Under what name does the Caitanya-caritāmṛta mention the Narasiṁha shrine at Siṁhācalam?",["Jiyaḍa-nṛsiṁha","Ahovala-nṛsiṁha","Yogānanda-nṛsiṁha"],
   "On His tour of the South, after some days Mahāprabhu reached the holy place of Jiyaḍa-nṛsiṁha. In the purport Śrīla Prabhupāda explains that the temple stands on Siṁhācala hill near Visakhapatnam."],
  ['simhachalam',[CC+', Madhya 8.5',CC+', Madhya 8.5'],
   "Kako molitev, ki jo je Mahāprabhu recitiral pred Nṛsiṁhadevo, opisuje Gospodov odnos do boginje sreče?",["Kot čebelo, ki vedno gleda njen lotosov obraz","Kot laboda ob lotosovem jezeru","Kot luno med zvezdami"],
   "»Vsa slava Nṛsiṁhadevi, Gospodu Prahlāde Mahārāja, ki je kot čebela vedno zatopljen v gledanje lotosovega obraza boginje sreče.«",
   "How does the prayer Mahāprabhu recited before Nṛsiṁhadeva describe the Lord's relationship with the goddess of fortune?",["As a honeybee always beholding her lotus face","As a swan by a lotus lake","As the moon among the stars"],
   "“All glories to Nṛsiṁhadeva, the Lord of Prahlāda Mahārāja, who like a honeybee is always engaged in beholding the lotuslike face of the goddess of fortune.”"],
  ['simhachalam',[CC+', Madhya 8.6',CC+', Madhya 8.6'],
   "S čim verz, ki ga je navedel Mahāprabhu, primerja Nṛsiṁhadevovo nežnost do bhakt?",["Z levinjo, ki je nežna do svojih mladičev","S kravo, ki liže svoje tele","Z mirnim oceanom"],
   "Čeprav je levinja zelo divja, je do svojih mladičev zelo nežna. Tako je tudi Nṛsiṁhadeva, čeprav strašen do nebhakt, kot je Hiraṇyakaśipu, zelo mehak in prijazen do bhakt, kot je Prahlāda Mahārāja.",
   "To what does the verse Mahāprabhu quoted compare Nṛsiṁhadeva's tenderness toward His devotees?",["A lioness who is gentle with her cubs","A cow licking her calf","A calm ocean"],
   "Although very ferocious, the lioness is very kind to her cubs. Similarly, although very ferocious to nondevotees like Hiraṇyakaśipu, Lord Nṛsiṁhadeva is very soft and kind to devotees like Prahlāda Mahārāja."],
  ['simhachalam',[TRAD[0],TRAD[1]],
   "Kdaj lahko romarji na Siṁhācalamu vidijo pravo obliko (nija-rūpa) Božanstva brez sandalove paste?",["Na dan Akṣaya-tṛtīye","Na Janmāṣṭamī","Na Gaura-pūrṇimo"],
   "Božanstvo Varāha-Lakṣmī-Narasiṁhe je vse leto prekrito s sandalovo pasto, zato je videti kot liṅga. Pasto odstranijo le na Akṣaya-tṛtīyo (Candana-yātrā), ko romarji za nekaj ur vidijo nija-rūpo.",
   "When can pilgrims at Siṁhācalam see the true form (nija-rūpa) of the Deity without sandalwood paste?",["On Akṣaya-tṛtīyā","On Janmāṣṭamī","On Gaura-pūrṇimā"],
   "The Varāha-Lakṣmī-Narasiṁha Deity is covered with sandalwood paste all year, so He looks like a liṅga. The paste is removed only on Akṣaya-tṛtīyā (Candana-yātrā), when pilgrims see the nija-rūpa for a few hours."],
  ['yadagiri',[SB+' 7.8',SB+' 7.8'],
   "Kako je Gospod Narasiṁha ubil Hiraṇyakaśipuja in ob tem spoštoval Brahmājeve blagoslove?",["Na pragu dvorane, ob mraku, na svojem naročju, z nohti","Z diskom Sudarśana opoldne sredi neba","S puščico v vodah oceana"],
   "Hiraṇyakaśipu je od Brahmāja dobil blagoslov, da ga ne more ubiti ne človek ne žival, ne podnevi ne ponoči, ne na zemlji ne v zraku, z nobenim orožjem. Gospod se je pojavil kot napol človek in napol lev ter ga ob mraku na pragu dvorane položil na svoje naročje in raztrgal z nohti.",
   "How did Lord Narasiṁha kill Hiraṇyakaśipu while honoring Brahmā's benedictions?",["At the doorway of the hall, at twilight, on His lap, with His nails","With the Sudarśana disc at noon in the sky","With an arrow in the waters of the ocean"],
   "Hiraṇyakaśipu had received benedictions from Brahmā that no man or animal could kill him, neither by day nor by night, neither on the ground nor in the air, with any weapon. The Lord appeared as half man and half lion, placed him on His lap at the doorway of the hall at twilight, and tore him apart with His nails."],
  ['yadagiri',[SB+' 7.9.1–3',SB+' 7.9.1–3'],
   "Kdo je po uboju Hiraṇyakaśipuja pomiril razjarjenega Gospoda Narasiṁho?",["Prahlāda Mahārāja","Boginja sreče Lakṣmī","Gospod Śiva"],
   "Ne Brahmā ne polbogovi se Gospodu niso upali približati; tudi boginja sreče, ki Gospoda še ni videla v tako čudoviti obliki, se ga je bala. Zato je Brahmā prosil Prahlādo, da ga pomiri.",
   "Who pacified the angry Lord Narasiṁha after Hiraṇyakaśipu was killed?",["Prahlāda Mahārāja","Lakṣmī, the goddess of fortune","Lord Śiva"],
   "Neither Brahmā nor the demigods dared approach the Lord; even the goddess of fortune, who had never seen Him in such a wonderful form, was afraid. So Brahmā asked Prahlāda to pacify Him."],
  ['yadagiri',[SB+' 7.10',SB+' 7.10'],
   "Kaj je Prahlāda Mahārāja prosil, ko mu je Gospod Narasiṁha ponudil blagoslov?",["Da ne bi imel nobene materialne želje in da bi bil njegov oče odrešen","Kraljestvo vseh treh svetov","Dolgo življenje in moč"],
   "Prahlāda je rekel, da tisti, ki od Gospoda za služenje pričakuje materialno korist, ni služabnik, temveč trgovec. Prosil je le, da v njegovem srcu ne bi bilo materialne želje, in za odrešitev svojega očeta.",
   "What did Prahlāda Mahārāja ask for when Lord Narasiṁha offered him a benediction?",["To have no material desire, and for his father's deliverance","A kingdom over the three worlds","Long life and strength"],
   "Prahlāda said that one who expects material profit from the Lord in exchange for service is not a servant but a merchant. He asked only that no material desire arise in his heart, and for his father's deliverance."],
  ['yadagiri',[TRAD[0],TRAD[1]],
   "Katere oblike Narasiṁhe so po izročilu čaščene v jami templja v Yādagirigutti?",["Jvālā-, Yogānanda- in Gaṇḍabheruṇḍa-Narasiṁha","Kroḍa-, Pāvana- in Bhārgava-Narasiṁha","Ugra-, Vīra- in Bāla-Narasiṁha"],
   "Po izročilu je modrec Yāda tu izvajal pokoro in Gospod se mu je razodel v več oblikah. V jami častijo Jvālā-, Yogānanda- in Gaṇḍabheruṇḍa-Narasiṁho skupaj z Lakṣmī-Narasiṁho.",
   "Which forms of Narasiṁha are, by tradition, worshiped in the cave temple at Yādagirigutta?",["Jvālā, Yogānanda and Gaṇḍabheruṇḍa Narasiṁha","Kroḍa, Pāvana and Bhārgava Narasiṁha","Ugra, Vīra and Bāla Narasiṁha"],
   "By tradition the sage Yāda performed austerities here and the Lord revealed Himself in several forms. In the cave Jvālā, Yogānanda and Gaṇḍabheruṇḍa Narasiṁha are worshiped together with Lakṣmī-Narasiṁha."],
  ['ahobilam',[TRAD[0],TRAD[1]],
   "Koliko templjev Gospoda Narasiṁhe po izročilu sestavlja Ahobilam (Nava-Narasiṁha)?",["Devet","Tri","Dvanajst"],
   "Ahobilam sestavlja devet templjev Narasiṁhe v gričevju Nallamala, med njimi Ahobila-, Kroḍa-, Mālola- in Pāvana-Narasiṁha. Po izročilu se je tu Gospod pojavil iz stebra.",
   "How many temples of Lord Narasiṁha, by tradition, make up Ahobilam (Nava-Narasiṁha)?",["Nine","Three","Twelve"],
   "Ahobilam consists of nine Narasiṁha temples in the Nallamala hills, among them Ahobila, Kroḍa, Mālola and Pāvana Narasiṁha. By tradition the Lord emerged from the pillar here."]
 ],
 /* C Vāmana in Rāma */ [
  ['thrikkakara',[SB+' 8.19',SB+' 8.19'],
   "Za koliko korakov zemlje je Vāmanadeva prosil kralja Balija Mahārāja?",["Za tri korake","Za en korak","Za sto korakov"],
   "Gospod Vāmana je kot brāhmaṇski deček prišel na Balijevo daritev in prosil le za tri korake zemlje, odmerjene z Njegovimi stopali.",
   "How many steps of land did Vāmanadeva ask King Bali Mahārāja for?",["Three steps","One step","A hundred steps"],
   "Lord Vāmana came to Bali's sacrifice as a brāhmaṇa boy and asked only for three steps of land measured by His own feet."],
  ['thrikkakara',[SB+' 8.19–20',SB+' 8.19–20'],
   "Kdo je Baliju Mahārāju odsvetoval, da bi Vāmanadevi dal obljubljeno?",["Njegov duhovni učitelj Śukrācārya","Njegov ded Prahlāda","Bṛhaspati"],
   "Śukrācārya je spoznal, da je deček sam Viṣṇu, in Baliju svetoval, naj obljube ne izpolni. Bali pa se je odločil, da besede ne bo prelomil in bo Gospodu dal vse.",
   "Who advised Bali Mahārāja not to give Vāmanadeva what he had promised?",["His spiritual master Śukrācārya","His grandfather Prahlāda","Bṛhaspati"],
   "Śukrācārya understood that the boy was Viṣṇu Himself and advised Bali not to keep his promise. But Bali decided not to break his word and to give everything to the Lord."],
  ['thrikkakara',[SB+' 8.22.2',SB+' 8.22.2'],
   "Kam je Bali Mahārāja prosil Gospoda, naj postavi tretji korak?",["Na njegovo glavo","Na nebeške planete","V ocean"],
   "Gospod je z dvema korakoma pokril vse svetove, za tretjega ni ostalo nič. Bali je ponižno prosil, naj Gospod tretji korak postavi na njegovo glavo.",
   "Where did Bali Mahārāja ask the Lord to place His third step?",["On his head","On the heavenly planets","In the ocean"],
   "With two steps the Lord covered all the worlds, and nothing remained for the third. Bali humbly asked the Lord to place the third step on his head."],
  ['thrikkakara',[SB+' 6.3.20',SB+' 6.3.20'],
   "Med katere osebnosti se po Śrīmad-Bhāgavatamu prišteva Bali Mahārāja?",["Med dvanajst mahājan, ki poznajo načela religije","Med sedem velikih ṛṣijev","Med štirinajst Manujev"],
   "Yamarāja našteje dvanajst mahājan, avtoritet vdanega služenja: Brahmā, Nārada, Śiva, četverica Kumāra, Kapila, Manu, Prahlāda, Janaka, Bhīṣma, Bali, Śukadeva Gosvāmī in Yamarāja sam.",
   "According to the Śrīmad-Bhāgavatam, Bali Mahārāja is counted among which personalities?",["The twelve mahājanas who know the principles of religion","The seven great ṛṣis","The fourteen Manus"],
   "Yamarāja lists the twelve mahājanas, authorities on devotional service: Brahmā, Nārada, Śiva, the four Kumāras, Kapila, Manu, Prahlāda, Janaka, Bhīṣma, Bali, Śukadeva Gosvāmī and Yamarāja himself."],
  ['thrikkakara',[TRAD[0],TRAD[1]],
   "Kateri praznik je osrednji praznik templja Vāmane v Thrikkakari?",["Onam","Diwali","Holi"],
   "Po keralskem izročilu je kralj Bali (Mahābali) vladal Kerali in ga je Vāmana tu poslal v nižje planete. Ob prazniku Onam naj bi kralj vsako leto obiskal svoje ljudstvo.",
   "Which festival is the central festival of the Vāmana temple in Thrikkakara?",["Onam","Diwali","Holi"],
   "By Kerala tradition King Bali (Mahābali) ruled Kerala, and Vāmana sent him to the lower planets here. At Onam the king is believed to visit his people every year."],
  ['sirkazhi',[SB+' 8.20',SB+' 8.20'],
   "Kaj pomeni ime Trivikrama?",["Gospod, ki je s tremi koraki premeril vesolje","Gospod treh svetov","Gospod s tremi očmi"],
   "Vāmana je pred Balijem razširil svojo vesoljno obliko: z enim korakom je pokril zemljo, z drugim nebeške planete. Ta oblika se imenuje Trivikrama ali Urukrama.",
   "What does the name Trivikrama mean?",["The Lord who measured the universe with three steps","The Lord of the three worlds","The three-eyed Lord"],
   "Before Bali, Vāmana expanded His universal form: with one step He covered the earth, with the second the heavenly planets. This form is called Trivikrama or Urukrama."],
  ['sirkazhi',[TRAD[0],TRAD[1]],
   "Koliko je Divya-deśam svetišč Viṣṇuja, med katera spada tempelj Trivikrame v Sīrkāḻiju?",["108","18","1008"],
   "Divya-deśam je 108 svetišč Viṣṇuja, ki so jih v svojih tamilskih pesmih opevali Āḻvārji. Med njimi so tudi Śrī Raṅgam, Tirumala, Ādi-keśava in Ananta Padmanābha.",
   "How many Divya-deśam shrines of Viṣṇu are there, including the Trivikrama temple in Sīrkāḻi?",["108","18","1008"],
   "The Divya-deśams are 108 shrines of Viṣṇu praised by the Āḻvārs in their Tamil hymns. They include Śrī Raṅgam, Tirumala, Ādi-keśava and Ananta Padmanābha."],
  ['bhadrachalam',[SB+' 9.10',SB+' 9.10'],
   "Koliko let je Gospod Rāma po očetovem ukazu preživel v gozdu?",["Štirinajst","Dvanajst","Sedem"],
   "Da bi izpolnil očetovo obljubo, je Gospod Rāma zapustil kraljestvo in s Sīto in Lakṣmaṇo odšel v gozd za štirinajst let. Bhadrācalam ob reki Godāvarī po izročilu leži v pokrajini, kjer je takrat bival.",
   "For how many years did Lord Rāma live in the forest by His father's order?",["Fourteen","Twelve","Seven"],
   "To fulfil His father's promise, Lord Rāma left the kingdom and went to the forest with Sītā and Lakṣmaṇa for fourteen years. By tradition Bhadrācalam on the Godāvarī lies in the region where He then lived."],
  ['bhadrachalam',[HIST[0],HIST[1]],
   "Kdo je v 17. stoletju zgradil tempelj Sītā-Rāmacandre v Bhadrācalamu?",["Bhakta Rāmadāsa (Kañcerla Gopanna)","Kralj Kṛṣṇadeva Rāya","Śrī Rāmānujācārya"],
   "Kañcerla Gopanna, uradnik v službi sultana Golkonde, je davke porabil za gradnjo templja, zato so ga zaprli. Po izročilu je Rāma sam poplačal dolg in bhakta je bil izpuščen. Opeval ga je v pesmih in postal znan kot Bhakta Rāmadāsa.",
   "Who built the Sītā-Rāmacandra temple in Bhadrācalam in the 17th century?",["The devotee Rāmadāsa (Kañcerla Gopanna)","King Kṛṣṇadeva Rāya","Śrī Rāmānujācārya"],
   "Kañcerla Gopanna, an official of the Golconda sultan, spent tax money on building the temple and was imprisoned. By tradition Rāma Himself repaid the debt and the devotee was freed. He sang of Rāma in his songs and became known as Bhakta Rāmadāsa."],
  ['triprayar',[TRAD[0],TRAD[1]],
   "Kaj je romanje Nālambalam, ki se začne v Triprayarju?",["Obisk templjev Rāme, Bharate, Lakṣmaṇe in Śatrughne v enem dnevu","Obhod štirih jezer okoli templja","Štiri kopeli na sotočju rek"],
   "V mesecu Karkiṭakam (julij–avgust), ko po keralskem izročilu berejo Rāmāyaṇo, romarji v enem dnevu obiščejo štiri templje: Triprayar (Rāma), Irinjalakuda (Bharata), Moozhikkulam (Lakṣmaṇa) in Payammal (Śatrughna).",
   "What is the Nālambalam pilgrimage that begins at Triprayar?",["Visiting the temples of Rāma, Bharata, Lakṣmaṇa and Śatrughna in one day","Circling four lakes around the temple","Four baths at a river confluence"],
   "In the month of Karkiṭakam (July–August), when by Kerala tradition the Rāmāyaṇa is read, pilgrims visit four temples in one day: Triprayar (Rāma), Irinjalakuda (Bharata), Moozhikkulam (Lakṣmaṇa) and Payammal (Śatrughna)."],
  ['orchha',[HIST[0],HIST[1]],
   "Kako v templju Rām Rāja v Orchhi častijo Gospoda Rāmo?",["Kot vladajočega kralja, ki mu policija vsak dan izkaže častni pozdrav","Kot dečka, ki se igra v palači","Kot puščavnika v gozdu"],
   "V Orchhi je Rāma kralj mesta. Vsak dan mu ob āratiju policijska straža izkaže častni pozdrav, kot se spodobi vladarju.",
   "How is Lord Rāma worshiped in the Rām Rāja temple at Orchha?",["As the ruling king, given a guard of honour by the police every day","As a boy playing in the palace","As a hermit in the forest"],
   "In Orchha Rāma is the king of the town. Every day at the ārati a police guard gives Him a guard of honour, as is fitting for a ruler."],
  ['rameswaram',[SB+' 9.10',SB+' 9.10'],
   "Kako je Gospod Rāma s svojo vojsko prišel čez ocean na Laṅko?",["Po mostu iz kamnov, ki so ga zgradile opice","Z ladjami kralja Sugrīve","Hanumān jih je prenesel po zraku"],
   "Gospod Rāma je z vojsko opic zgradil most čez ocean. Opice so nosile vrhove gora in kamne, ki so po Gospodovi volji plavali na vodi. Most se imenuje Setu-bandha.",
   "How did Lord Rāma and His army cross the ocean to Laṅkā?",["Over a bridge of stones built by the monkeys","On King Sugrīva's ships","Hanumān carried them through the air"],
   "Lord Rāma built a bridge across the ocean with His army of monkeys. The monkeys carried mountain peaks and stones that floated on the water by the Lord's will. The bridge is called Setu-bandha."],
  ['rameswaram',[CC+', Madhya 9.199',CC+', Madhya 9.199'],
   "Kje se je Mahāprabhu okopal, preden je obiskal tempelj Rāmeśvara?",["V Dhanus-tīrthi pri Setu-bandhi","V reki Kāverī","V Gaṅgi"],
   "Mahāprabhu je prišel do Setu-bandhe, se okopal na kraju Dhanus-tīrtha in nato obiskal tempelj Rāmeśvara.",
   "Where did Mahāprabhu bathe before visiting the Rāmeśvara temple?",["At Dhanus-tīrtha near Setu-bandha","In the Kāverī River","In the Gaṅgā"],
   "Mahāprabhu came to Setu-bandha, bathed at the place called Dhanus-tīrtha and then visited the Rāmeśvara temple."],
  ['rameswaram',[CC+', Madhya 9',CC+', Madhya 9'],
   "Kaj je Śrī Caitanya v Rāmeśvaramu prebral v Kūrma Purāṇi?",["Da je Rāvaṇa ugrabil le iluzorno podobo Sīte","Opis gradnje Rāmovega mostu","Poglavje Brahma-saṁhite"],
   "V Kūrma Purāṇi je Mahāprabhu našel zgodbo o zvesti ženi: ko je Rāvaṇa prišel po Sīto, jo je bog ognja odnesel k Pārvatī, Rāvaṇi pa dal iluzorno Sīto (māyā-sīto). Prave Sīte se Rāvaṇa nikoli ni mogel dotakniti.",
   "What did Śrī Caitanya read in the Kūrma Purāṇa at Rāmeśvaram?",["That Rāvaṇa kidnapped only an illusory form of Sītā","A description of how Rāma's bridge was built","A chapter of the Brahma-saṁhitā"],
   "In the Kūrma Purāṇa Mahāprabhu found the story of the chaste wife: when Rāvaṇa came for Sītā, the fire-god took her to Pārvatī and gave Rāvaṇa an illusory Sītā (māyā-sītā). Rāvaṇa could never touch the real Sītā."],
  ['rameswaram',[CC+', Madhya 9',CC+', Madhya 9'],
   "Komu je Mahāprabhu prinesel liste Kūrma Purāṇe o iluzorni Sīti?",["Rāmadāsi Vipri v Južni Mathurī (Madurai)","Veṅkaṭi Bhaṭṭi v Śrī Raṅgamu","Rāmānandi Rāyu ob Godāvarī"],
   "Rāmadāsa Vipra, Rāmov bhakta, je bil žalosten, ker se je Rāvaṇa dotaknil matere Sīte. Mahāprabhu mu je prinesel stare liste Kūrma Purāṇe in bhakta je bil zelo srečen.",
   "To whom did Mahāprabhu bring the Kūrma Purāṇa leaves about the illusory Sītā?",["Rāmadāsa Vipra in Southern Mathurā (Madurai)","Veṅkaṭa Bhaṭṭa in Śrī Raṅgam","Rāmānanda Rāya on the Godāvarī"],
   "Rāmadāsa Vipra, a devotee of Rāma, was grieving because Rāvaṇa had touched mother Sītā. Mahāprabhu brought him the old leaves of the Kūrma Purāṇa and the devotee became very happy."]
 ],
 /* D Kṛṣṇova Božanstva / Kṛṣṇa's Deities */ [
  ['nathdwara',[CC+', Madhya 4.24–30',CC+', Madhya 4.24–30'],
   "Kdo je Mādhavendri Purīju na Govardhani prinesel lonec mleka?",["Pastirček, ki je bil sam Gopāla","Žena iz bližnje vasi","Raghunātha dāsa Gosvāmī"],
   "Mādhavendra Purī se je postil ob vznožju Govardhane, ko mu je pastirček prinesel lonec mleka in rekel, da so ga poslale vaške žene. V sanjah je spoznal, da je bil to Gopāla sam.",
   "Who brought Mādhavendra Purī a pot of milk at Govardhana?",["A cowherd boy who was Gopāla Himself","A woman from a nearby village","Raghunātha dāsa Gosvāmī"],
   "Mādhavendra Purī was fasting at the foot of Govardhana when a cowherd boy brought him a pot of milk, saying the village women had sent it. In a dream he understood it was Gopāla Himself."],
  ['nathdwara',[CC+', Madhya 4.41–42',CC+', Madhya 4.41–42'],
   "Zakaj je bil Gopāla skrit v grmovju na Govardhani?",["Duhovnik Ga je skril, ko so napadli muslimani","Odnesla Ga je poplava","Skril Ga je kralj Vajra"],
   "Gopāla je Mādhavendri v sanjah povedal, da Ga je vzpostavil Vajra, Kṛṣṇov pravnuk. Ko so napadli muslimani, Ga je duhovnik skril v grmovje in pobegnil.",
   "Why was Gopāla hidden in a bush on Govardhana?",["A priest hid Him when the Muslims attacked","A flood had carried Him away","King Vajra had hidden Him"],
   "In a dream Gopāla told Mādhavendra that He had been installed by Vajra, Kṛṣṇa's great-grandson. When the Muslims attacked, a priest hid Him in the bush and fled."],
  ['nathdwara',[CC+', Madhya 4.106–107',CC+', Madhya 4.106–107'],
   "Kaj je Gopāla prosil Mādhavendro Purīja, ker Mu je bilo telo še vroče?",["Sandalovino iz Malaye, ki naj jo prinese iz Jagannātha Purīja","Vodo iz Gaṅge","Kafro iz Vṛndāvane"],
   "Gopāla se je prikazal v sanjah in rekel, da Mu telo še vedno peče. Prosil je za sandalovino iz pokrajine Malaya in naj jo Mādhavendra prinese iz Jagannātha Purīja.",
   "What did Gopāla ask Mādhavendra Purī for, because His body still felt hot?",["Sandalwood from Malaya, brought from Jagannātha Purī","Water from the Gaṅgā","Camphor from Vṛndāvana"],
   "Gopāla appeared in a dream and said His body was still burning. He asked for sandalwood from the Malaya province, to be brought from Jagannātha Purī."],
  ['nathdwara',[CC+', Madhya 4.158–160',CC+', Madhya 4.158–160'],
   "Kaj je Gopāla v sanjah naročil Mādhavendri Purīju v Remuṇi?",["Naj s sandalovino maže Gopīnātho, saj sta Gopāla in Gopīnātha eno","Naj se takoj vrne v Vṛndāvano","Naj v Remuṇi zgradi nov tempelj"],
   "Gopāla je rekel, da je sandalovino in kafro že prejel. Mādhavendra naj ju zmelje in pasto vsak dan maže na telo Gopīnāthe; ker sta Gopāla in Gopīnātha eno, se bo tako ohladil tudi Gopāla.",
   "What did Gopāla tell Mādhavendra Purī in a dream at Remuṇā?",["To smear the sandalwood on Gopīnātha, since Gopāla and Gopīnātha are one","To return to Vṛndāvana at once","To build a new temple at Remuṇā"],
   "Gopāla said He had already received the sandalwood and camphor. Mādhavendra should grind them and smear the pulp daily on Gopīnātha's body; since Gopāla and Gopīnātha are one, Gopāla too would be cooled."],
  ['nathdwara',[TRAD[0],TRAD[1]],
   "Kaj kaže drža Śrīnāthjīja v Nāthdvāri?",["Levo roko ima dvignjeno, kot da drži hrib Govardhana","Igra na flavto","Pleše na kači Kāliyi"],
   "Śrīnāthjī je upodobljen kot sedemletni Kṛṣṇa, ki ima levo roko dvignjeno, kot takrat, ko je dvignil Govardhano. Po Gauḍīya izročilu je to isti Gopāla, ki ga je odkril Mādhavendra Purī.",
   "What does the posture of Śrīnāthjī in Nāthdvārā show?",["His left hand raised, as if holding Govardhana Hill","Him playing the flute","Him dancing on the serpent Kāliya"],
   "Śrīnāthjī is shown as seven-year-old Kṛṣṇa with His left hand raised, as when He lifted Govardhana. According to Gauḍīya tradition He is the same Gopāla that Mādhavendra Purī discovered."],
  ['jaipur',[CC+', Ādi 1.19',CC+', Ādi 1.19'],
   "Na kateri ravni po Prabhupādovi razlagi častimo Govindo?",["Na ravni transcendentalnega služenja","Na ravni ponovnega odkrivanja pozabljenega odnosa","Na ravni popolnosti"],
   "Tri Božanstva Vṛndāvane so pritegnila srce Gauḍīya vaiṣṇavov. Madana-mohana obnovi naš pozabljeni odnos s Kṛṣṇo, Govindo častimo na ravni transcendentalnega služenja, popolni pa Kṛṣṇo cenijo kot Gopījana-vallabho.",
   "According to Prabhupāda's explanation, on what platform do we worship Govinda?",["The platform of transcendental service","The platform of reestablishing our forgotten relationship","The platform of perfection"],
   "The three Deities of Vṛndāvana have absorbed the hearts of the Gauḍīya Vaiṣṇavas. Madana-mohana reestablishes our forgotten relationship with Kṛṣṇa, Govinda is worshiped on the platform of transcendental service, and the perfected appreciate Kṛṣṇa as Gopījana-vallabha."],
  ['karauli',[CC+', Ādi 1.19',CC+', Ādi 1.19'],
   "Kaj po Prabhupādovi razlagi pomeni čaščenje Madana-mohane?",["Ponovno vzpostavljanje pozabljenega odnosa z Bogom","Okušanje popolne ljubezni gopī","Služenje na ravni zrelega bhakte"],
   "Čaščenje Madana-mohane je na ravni ponovne vzpostavitve našega pozabljenega odnosa z Osebnostjo Božanstva. Zato je Madana-mohana posebej milostljiv do začetnikov.",
   "According to Prabhupāda's explanation, what does the worship of Madana-mohana mean?",["Reestablishing our forgotten relationship with God","Tasting the perfect love of the gopīs","Service on the level of a mature devotee"],
   "The worship of Madana-mohana is on the platform of reestablishing our forgotten relationship with the Personality of Godhead. Therefore Madana-mohana is especially merciful to beginners."],
  ['jaipur',[CC+', Ādi 1.19',CC+', Ādi 1.19'],
   "Katero od treh glavnih Božanstev Vṛndāvane predstavlja popolnost – Kṛṣṇo kot ljubljenca gopī iz Vraje?",["Gopīnātha (Gopījana-vallabha)","Madana-mohana","Govinda"],
   "Ko bhakta doseže popolnost, lahko Kṛṣṇo ceni kot Gopījana-vallabho, Gospoda, ki je v veselje dekletom iz Vraje. Gopīnātha je danes v Jaipurju.",
   "Which of the three main Deities of Vṛndāvana represents perfection – Kṛṣṇa as the beloved of the gopīs of Vraja?",["Gopīnātha (Gopījana-vallabha)","Madana-mohana","Govinda"],
   "When a devotee reaches perfection, he can appreciate Kṛṣṇa as Gopījana-vallabha, the pleasure of the damsels of Vraja. Gopīnātha now resides in Jaipur."],
  ['jaipur',[HIST[0],HIST[1]],
   "Zakaj so Govindo, Gopīnātho in Madana-mohano v 17. stoletju odnesli iz Vṛndāvane v Radžastan?",["Zaradi napadov vojske cesarja Aurangzeba","Zaradi poplave reke Yamune","Ker jih je kupil radžastanski kralj"],
   "Ko je vojska cesarja Aurangzeba napadala templje v Vraji, so bhakte Božanstva skrili in jih prenesli pod zaščito radžputskih kraljev. Govinda in Gopīnātha sta danes v Jaipurju, Madana-mohana v Karauliju; v Vṛndāvani častijo njihove nadomestne podobe (pratibhū).",
   "Why were Govinda, Gopīnātha and Madana-mohana taken from Vṛndāvana to Rajasthan in the 17th century?",["Because of attacks by Emperor Aurangzeb's army","Because of a flood of the Yamunā","Because a Rajasthani king bought Them"],
   "When Emperor Aurangzeb's army attacked the temples of Vraja, devotees hid the Deities and took Them under the protection of the Rajput kings. Govinda and Gopīnātha are now in Jaipur and Madana-mohana in Karauli; in Vṛndāvana Their pratibhū forms are worshiped."],
  ['dakor',[SB+' 10.51',SB+' 10.51'],
   "Kateri napadalec je zasledoval Kṛṣṇo do jame, v kateri je spal kralj Mucukunda?",["Kālayavana","Jarāsandha","Śiśupāla"],
   "Kṛṣṇa je pred Kālayavano navidez bežal z bojišča in ga zvabil v jamo. Tam je Kālayavana brcnil spečega Mucukundo, ki ga je s pogledom sežgal. Ime Raṇchoḍ (»tisti, ki je zapustil bojišče«) po izročilu spominja na to, da se je Kṛṣṇa umaknil z bojišča.",
   "Which attacker pursued Kṛṣṇa into the cave where King Mucukunda was sleeping?",["Kālayavana","Jarāsandha","Śiśupāla"],
   "Kṛṣṇa pretended to flee the battlefield before Kālayavana and lured him into a cave. There Kālayavana kicked the sleeping Mucukunda, who burned him to ashes with his glance. By tradition the name Raṇchoḍ, “He who left the battlefield”, recalls how Kṛṣṇa withdrew from the battlefield."],
  ['dakor',[TRAD[0],TRAD[1]],
   "Kdo je po izročilu Božanstvo Raṇchoḍrāya prinesel iz Dvārake v Ḍākor?",["Bhakta Bodāṇā","Mīrābāī","Narasiṁha Mehta"],
   "Bhakta Bodāṇā je vsako leto peš romal v Dvārako. Ko zaradi starosti ni mogel več, je po izročilu Gospod sam odšel z njim v Ḍākor, kjer Ga častijo še danes.",
   "Who, by tradition, brought the Raṇchoḍrāya Deity from Dvārakā to Dakor?",["The devotee Bodāṇā","Mīrābāī","Narasiṁha Mehta"],
   "The devotee Bodāṇā walked to Dvārakā every year. When old age prevented him, by tradition the Lord Himself went with him to Dakor, where He is worshiped to this day."],
  ['guruvayur',[SB+' 10.3.9–10',SB+' 10.3.9–10'],
   "V kateri obliki se je Kṛṣṇa ob rojstvu najprej pokazal Vasudevi in Devakī in v kateri ga častijo tudi v Guruvāyūrju?",["Kot štiriročni Viṣṇu s školjko, diskom, buzdovanom in lotosom","Kot dvoročni pastirček s flavto","Kot dete na listu banjana"],
   "Vasudeva je zagledal čudovito dete s štirimi rokami, ki so držale školjko, disk, buzdovan in lotos. Guruvāyūrappan je upodobljen v tej obliki.",
   "In what form did Kṛṣṇa first show Himself to Vasudeva and Devakī at His birth, the form also worshiped in Guruvāyūr?",["As four-armed Viṣṇu with conch, disc, club and lotus","As a two-armed cowherd boy with a flute","As a baby on a banyan leaf"],
   "Vasudeva saw a wonderful child with four arms holding a conch, disc, club and lotus. Guruvāyūrappan is shown in this form."],
  ['guruvayur',[TRAD[0],TRAD[1]],
   "Od kod po izročilu izvira ime Guruvāyūr?",["Od Guruja (Bṛhaspatija) in Vāyuja, ki sta tu vzpostavila Božanstvo","Od imena reke, ki teče mimo","Od kralja, ki je zgradil tempelj"],
   "Ko je Dvārakā potonila, sta po izročilu Bṛhaspati, učitelj polbogov, in bog vetra Vāyu rešila Božanstvo, ki so ga častili v Dvāraki, in ga vzpostavila v Kerali. Ūr pomeni »kraj«.",
   "Where, by tradition, does the name Guruvāyūr come from?",["From Guru (Bṛhaspati) and Vāyu, who installed the Deity here","From the name of the river that flows past","From the king who built the temple"],
   "When Dvārakā sank, by tradition Bṛhaspati, the teacher of the demigods, and Vāyu, the wind-god, rescued the Deity worshiped in Dvārakā and installed Him in Kerala. Ūr means “place”."],
  ['pandharpur',[CC+', Madhya 9.282',CC+', Madhya 9.282'],
   "Katero Božanstvo je Mahāprabhu obiskal v Pāṇḍarapuri?",["Viṭhṭhalo Ṭhākuro","Raṇchoḍrāyo","Raṅganātho"],
   "Mahāprabhu je v Pāṇḍarapuri z veliko ljubeznijo obiskal tempelj Viṭhṭhala Ṭhākure, tam pel in plesal ter se okopal v reki Bhīmā.",
   "Which Deity did Mahāprabhu visit in Pāṇḍarapura?",["Viṭhṭhala Ṭhākura","Raṇchoḍrāya","Raṅganātha"],
   "In Pāṇḍarapura Mahāprabhu lovingly visited the temple of Viṭhṭhala Ṭhākura, chanted and danced there, and bathed in the Bhīmā River."],
  ['pandharpur',[CC+', Madhya 9.285',CC+', Madhya 9.285'],
   "Katerega učenca Mādhavendre Purīja je Mahāprabhu srečal v Pāṇḍarapuri?",["Śrī Raṅgo Purīja","Īśvaro Purīja","Paramānando Purīja"],
   "V hiši nekega brāhmaṇe je Mahāprabhu našel Śrī Raṅgo Purīja, učenca Mādhavendre Purīja. Objela sta se v zanosu in pet do sedem dni govorila o Kṛṣṇi.",
   "Which disciple of Mādhavendra Purī did Mahāprabhu meet in Pāṇḍarapura?",["Śrī Raṅga Purī","Īśvara Purī","Paramānanda Purī"],
   "At a brāhmaṇa's house Mahāprabhu found Śrī Raṅga Purī, a disciple of Mādhavendra Purī. They embraced in ecstasy and spoke of Kṛṣṇa for five to seven days."],
  ['pandharpur',[CC+', Madhya 9.300–301',CC+', Madhya 9.300–301'],
   "Kaj je Mahāprabhu v Pāṇḍarapuri izvedel o Śaṅkarāraṇyi?",["Da je tu dosegel popolnost; bil je Gospodov starejši brat","Da je tu ustanovil maṭho","Da je tu napisal komentar Gīte"],
   "Śrī Raṅga Purī je povedal, da je Śaṅkarāraṇya v Pāṇḍarapuri dosegel popolnost. Mahāprabhu je dejal, da je bil to Njegov brat iz prejšnjega āśrame, Viśvarūpa.",
   "What did Mahāprabhu learn in Pāṇḍarapura about Śaṅkarāraṇya?",["That he attained perfection there; he was the Lord's elder brother","That he founded a maṭha there","That he wrote a Gītā commentary there"],
   "Śrī Raṅga Purī said that Śaṅkarāraṇya had attained perfection at Pāṇḍarapura. Mahāprabhu said that he had been His brother in His previous āśrama, Viśvarūpa."],
  ['dvaraka',[SB+' 10.52',SB+' 10.52'],

  ["Četrti od dvanajstih gozdov Vraje. Bhakti-ratnākara opisuje njegove številne kuṇḍe in kraje zabav: Caraṇa-pahāḍī s Kṛṣṇovimi odtisi stopal v kamnu, ki se je stopil ob zvoku flavte; Vimala-kuṇḍo; Bhojana-sthalī, kjer je Kṛṣṇa kosil s pastirčki; jamo, kjer je Vyomāsura skril pastirčke. Govinda, Madana-mohana in Gopīnātha so na poti v Jaipur tu ostali tri noči.","The fourth of the twelve forests of Vraja. The Bhakti-ratnākara describes its many kuṇḍas and pastime places: Caraṇa-pahāḍī with Kṛṣṇa's footprints in the stone that melted at the sound of His flute; Vimala-kuṇḍa; Bhojana-sthalī, where Kṛṣṇa ate lunch with the cowherd boys; the cave where Vyomāsura hid the boys. Govinda, Madana-mohana and Gopīnātha stayed here three nights on their way to Jaipur."],
  ["Vṛndā-devī, po viru najstarejše Božanstvo Vṛndā-devī, ki ga je vzpostavil Vajranābha, ponovno pa odkril Śrīla Rūpa Gosvāmī pri Brahma-kuṇḍi; Govindadeva; Kāmeśvara Mahādeva.","Vṛndā-devī, according to the source the oldest Vṛndā-devī Deity, installed by Vajranābha and rediscovered by Śrīla Rūpa Gosvāmī at Brahma-kuṇḍa; Govindadeva; Kāmeśvara Mahādeva."],{ll:[27.6533,77.2697],approx:0}),
 khadiravana:vp(["Khadiravana","Khadiravana"],["približno 10 km severovzhodno od Varṣāṇe","about 10 km north-east of Varṣāṇā"],
  ["Gozd, kjer je po izročilu Kṛṣṇa premagal demona Bakāsuro. Ob Kiśorī-kuṇḍi je Śrīla Lokanātha Gosvāmī, ki ga je Mahāprabhu prvega poslal v Vṛndāvano, v samoti opravljal bhajano; na bregu Yugala-kuṇḍe je vstopil v samādhi. Lokanātha Gosvāmī je iniciiral Narottamo dāsa Ṭhākuro.","The forest where, by tradition, Kṛṣṇa defeated the demon Bakāsura. By Kiśorī-kuṇḍa Śrīla Lokanātha Gosvāmī, the first whom Mahāprabhu sent to Vṛndāvana, performed bhajana in solitude; on the bank of Yugala-kuṇḍa he entered samādhi. Lokanātha Gosvāmī initiated Narottama dāsa Ṭhākura."],
  ["Śrī Śrī Rādhā-Vinoda, Božanstvo Lokanātha Gosvāmīja.","Śrī Śrī Rādhā-Vinoda, the Deity of Lokanātha Gosvāmī."]),
 bilvavana:vp(["Bilvavana (Belvan)","Bilvavana (Belvan)"],["na drugem bregu Yamune nasproti Vṛndāvane","on the far bank of the Yamunā opposite Vṛndāvana"],
  ["Gozd dreves bilva, kjer so Kṛṣṇa, Balarāma in pastirčki jedli zrele sadeže bilva. Tu boginja Lakṣmī izvaja pokoro, ker želi vstopiti v Kṛṣṇov rāsa ples, a to je mogoče le z milostjo Śrīmatī Rādhike in gopī.","A forest of bilva trees where Kṛṣṇa, Balarāma and the cowherd boys ate ripe bilva fruits. Here the goddess Lakṣmī performs austerities, wishing to enter Kṛṣṇa's rāsa dance, which is possible only by the mercy of Śrīmatī Rādhikā and the gopīs."],
  ["Boginja Lakṣmī.","The goddess Lakṣmī."]),
 lohavana:vp(["Lohavana","Lohavana"],["na drugem bregu Yamune nasproti Mathure","across the Yamunā from Mathurā"],
  ["Gozd, kjer je Kṛṣṇa med pašo krav ubil demona Lohajaṅgho. Ob Kṛṣṇa-kuṇḍi stoji tempelj Rādhā-Gopīnātha. Bhakti-ratnākara opisuje zabavo, ko je Kṛṣṇa kot čolnar gopījam rekel, naj zaradi »puščajočega« čolna zmečejo mleko in jogurt v reko.","The forest where Kṛṣṇa killed the demon Lohajaṅgha while herding the cows. By Kṛṣṇa-kuṇḍa stands the Rādhā-Gopīnātha temple. The Bhakti-ratnākara describes the pastime in which Kṛṣṇa, as a boatman, told the gopīs to throw their milk and yogurt into the river because the boat was “leaking”."],
  ["Rādhā-Gopīnātha.","Rādhā-Gopīnātha."]),
 kokilavana:vp(["Kokilavana","Kokilavana"],["tri milje severno od Nandagrāma","three miles north of Nandagrāma"],
  ["Ko so Jaṭilā, Kuṭilā in Abhimanyu Rādhiki zaprli pot, je Kṛṣṇa splezal na drevo in posnemal klic kukavice (kokila). Rādhikā in sakhīje so znak prepoznale in prišle v gozd. Tu sta Ratnākara-sarovara in Rāsa-maṇḍala; danes je najbolj obiskan tempelj Śanija.","When Jaṭilā, Kuṭilā and Abhimanyu blocked Rādhikā's way, Kṛṣṇa climbed a tree and imitated the call of a cuckoo (kokila). Rādhikā and the sakhīs recognised the signal and came into the forest. Here are Ratnākara-sarovara and the Rāsa-maṇḍala; today the most visited temple is that of Śani."]),
 vrindakunda:{n:["Vṛndā-kuṇḍa – tempelj ISKCON","Vṛndā-kuṇḍa – ISKCON temple"],s:['Vṛndā-kuṇḍa','Vṛndā-kuṇḍa'],loc:["približno 1 km od Nandagrāma","about 1 km from Nandagrāma"],at:'nandagrama',lv:6,src:['Back to Godhead (Indija); centres.iskcon.org','Back to Godhead (India); centres.iskcon.org'],
  img:[],
  d:["Kuṇḍa Vṛndā-devī, ki ureja Kṛṣṇove zabave v Vṛndāvani. Tulasī je njena razširitev, Paurṇamāsī njen guru. Ob njej je Gupta-kuṇḍa, ena od treh yoga-pīṭh Vraje, kjer se Rādhā in Kṛṣṇa srečujeta zjutraj (opoldne na Rādhā-kuṇḍi, ponoči pri templju Govinde v Vṛndāvani). Svetnik Bābā Mādhava dāsa je kraj leta 1989 zaupal ISKCON-u; bhakte so očistili kuṇḍe in uredili vrtove, leta 2003 pa so v novem templju iz peščenjaka vzpostavili Vṛndā-devī.","The kuṇḍa of Vṛndā-devī, who arranges Kṛṣṇa's pastimes in Vṛndāvana. Tulasī is her expansion and Paurṇamāsī her guru. Beside it is Gupta-kuṇḍa, one of the three yoga-pīṭhas of Vraja, where Rādhā and Kṛṣṇa meet in the morning (at midday at Rādhā-kuṇḍa, at night by the Govinda temple in Vṛndāvana). In 1989 the saint Bābā Mādhava dāsa entrusted the place to ISKCON; devotees cleaned the kuṇḍas and laid out gardens, and in 2003 Vṛndā-devī was installed in a new sandstone temple."],
  dei:["Vṛndā-devī s papigo Dakṣa na levi roki.","Vṛndā-devī with the parrot Dakṣa on her left hand."]},

Object.assign(PLACES.gokula,{d:["Mahāvana, imenovan tudi Gokula in Bṛhadvana, je največji od gozdov Vraje. Sem je Vasudeva prinesel novorojenega Kṛṣṇo; Yamuno je prečkal pri Kole-ghāṭi. Na hribu v Stari Gokuli je Nanda-bhavana s 84 stebri (Caurāsī-khambā). Tu so kraji Pūtanine odrešitve, prevrnjenega voza, Tṛṇāvarte in Dāmodara-līle z drevesoma yamala-arjuna. Pri Brahmāṇḍa-ghāṭi je Yaśodā v Kṛṣṇovih ustih zagledala vesolja; ob Cintā-haraṇa-ghāṭi je nato molila Śivi za Kṛṣṇovo varnost.","Mahāvana, also called Gokula and Bṛhadvana, is the largest forest of Vraja. Vasudeva brought the newborn Kṛṣṇa here, crossing the Yamunā at Kole-ghāṭa. On a hill in Old Gokula is Nanda-bhavana with 84 pillars (Caurāsī-khambā). Here are the places of Pūtanā's deliverance, the overturned cart, Tṛṇāvarta and the Dāmodara-līlā with the yamala-arjuna trees. At Brahmāṇḍa-ghāṭa Yaśodā saw the universes in Kṛṣṇa's mouth; at Cintā-haraṇa-ghāṭa she then prayed to Śiva for Kṛṣṇa's safety."],
 dei:["V Nanda-bhavani: Nanda Mahārāja, Yaśodā, Balarāma in dete Kṛṣṇa v zibelki.","In Nanda-bhavana: Nanda Mahārāja, Yaśodā, Balarāma and baby Kṛṣṇa in a cradle."]});

 d:["Dom Śrīvāse Ṭhākure, ki je Nārada Muni. Tu je Mahāprabhu z bhaktami ponoči pel kīrtano; zato kraj imenujejo rojstni kraj kīrtane. Tu se je zgodila mahā-prakāśa-līlā. Ko je Śrīvāsi med kīrtano umrl sin, ga je Mahāprabhu potolažil, da sta On in Nityānanda njegova sinova. Ime Khol-bhāṅgā-ḍāṅgā spominja na mṛdaṅgo (khol), ki jo je razbil Kāzī.","The home of Śrīvāsa Ṭhākura, who is Nārada Muni. Here Mahāprabhu held night-long kīrtana with His devotees, so the place is called the birthplace of kīrtana. The mahā-prakāśa-līlā took place here. When Śrīvāsa’s son died during kīrtana, Mahāprabhu consoled him, saying that He and Nityānanda were his sons. The name Khol-bhāṅgā-ḍāṅgā recalls the mṛdaṅga (khol) broken by the Kāzī."],

PLACES.simanta.d=["Eden od devetih otokov Navadvīpe; predstavlja śravaṇam (poslušanje). Po Navadvīpa-dhāma-māhātmyi (6. poglavje) je Pārvatī tu meditirala na Gaurāṅgo; ko se ji je prikazal, si je prah z Njegovih stopal dala na prečo (sīmanta), zato se otok imenuje Sīmantadvīpa. Gaurāṅga ji je razložil, da je Njegova energija, in tu ostala kot boginja otoka. Na otoku so tudi samādhi Cānd Kāzīja, aṅgana Kholāveče Śrīdhare in Sīmantinī-mandira.","One of the nine islands of Navadvīpa; it represents śravaṇam (hearing). According to the Navadvīpa-dhāma-māhātmya (chapter 6), Pārvatī meditated on Gaurāṅga here; when He appeared, she placed the dust of His feet on the parting of her hair (sīmanta), so the island is called Sīmantadvīpa. Gaurāṅga explained to her that she is His energy, and she remained here as the goddess of the island. The samādhi of Chand Kazi, the courtyard of Kholāvecā Śrīdhara and the Sīmantinī-mandira are also here."];

 d:["Garbhavāsa je kraj, kjer se je Nityānanda Prabhu pojavil 13. dan svetle polovice meseca Māgha. Njegova starša sta bila Hāḍāi Paṇḍita in Padmāvatī. Ob templju sta Ṣaṣṭhī-talā, kjer so šesti dan po Njegovem rojstvu častili boginjo Ṣaṣṭhī, in Viśvarūpa-talā, kjer je po izročilu počival Viśvarūpa, Mahāprabhujev starejši brat, potem ko je sprejel sannyāso. Vas se danes imenuje Vīrcandrapur.","Garbhavāsa is where Nityānanda Prabhu appeared on the 13th day of the bright half of the month of Māgha. His parents were Hāḍāi Paṇḍita and Padmāvatī. Beside the temple are Ṣaṣṭhī-talā, where the goddess Ṣaṣṭhī was worshiped on the sixth day after His birth, and Viśvarūpa-talā, where by tradition Viśvarūpa, Mahāprabhu’s elder brother, rested after accepting sannyāsa. The village is today called Vīrcandrapur."]});

 d:["Baṅkima Rāya (Bāṅkā Rāya) je edino Božanstvo, ki ga je vzpostavil Nityānanda Prabhu sam. Po pripovedovanju duhovnikov je Nityānanda vstopil v telo Baṅkima Rāya; zato je na Gospodovi desni Božanstvo Jāhnavā-devī, na levi pa Śrīmatī Rādhārāṇī. Rādhārāṇī so našli pod drevesom nimba v Bhaḍḍāpuri, zato jo imenujejo Bhaḍḍāpurera Ṭhākurāṇī. Tempelj je leta 1924 poškodovala strela.","Baṅkima Rāya (Bāṅkā Rāya) is the only Deity installed by Nityānanda Prabhu Himself. According to the priests, Nityānanda entered the body of Baṅkima Rāya; therefore the Deity of Jāhnavā-devī stands on the Lord’s right and Śrīmatī Rādhārāṇī on His left. Rādhārāṇī was found under a neem tree at Bhaḍḍāpura, so She is called Bhaḍḍāpurera Ṭhākurāṇī. The temple was damaged by lightning in 1924."],
 dei:["Baṅkima Rāya (Kṛṣṇa), na desni Jāhnavā-devī, na levi Śrīmatī Rādhārāṇī; na drugih oltarjih Muralīdhara, Rādhā-Mādhava, Manomohana, Vṛndāvana-candra, Gaura-Nitāi in Yogamāyā.","Baṅkima Rāya (Kṛṣṇa), with Jāhnavā-devī on His right and Śrīmatī Rādhārāṇī on His left; on other altars Muralīdhara, Rādhā-Mādhava, Manomohana, Vṛndāvana-candra, Gaura-Nitāi and Yogamāyā."]});
Object.assign(PLACES.kadamba,{s:['Kadamba-khaṇḍī-ghāṭa','Kadamba-khaṇḍī-ghāṭa'],img:[PLACES.kadamba.img[0],im('2025/02/Sundaranga_Kadamba-khandi-3.jpg','Kadamba-khaṇḍī-ghāṭa','Kadamba-khaṇḍī-ghāṭa')],
 d:["Ghāṭa na vzhodni strani templja Baṅkima Rāya, ob reki, ki jo krajani imenujejo Yamunā. Po izročilu je tu po vodi priplavalo Božanstvo Baṅkima Rāya; Nityānanda Ga je sam dvignil in vzpostavil v templju.","A ghāṭa on the eastern side of the Baṅkima Rāya temple, on a river the locals call the Yamunā. By tradition the Deity of Baṅkima Rāya came floating on the water here; Nityānanda Himself lifted Him and installed Him in the temple."]});
Object.assign(PLACES.hantugada,{s:['Hāṅṭugāḍā','Hāṅṭugāḍā'],img:[PLACES.hantugada.img[0],im('2025/02/Nandan_hantugada-5-scaled.jpg','Jezero v Hāṅṭugāḍi','The lake at Hāṅṭugāḍā')],
 d:["Po izročilu je Nityānanda Prabhu na ta kraj prinesel vse svete kraje, zato se ljudje iz okoliških vasi kopajo tu namesto v Gaṅgi. Ime spominja na praznik dadhi-ciḍā (sploščen riž z jogurtom), pri katerem je Nityānanda prasādam sprejel kleče (hāṅṭu pomeni koleno). Jezero ima vodo vse leto; velika sejma sta ob Goṣṭhāṣṭamī in na Nityānandov pojavni dan.","By tradition Nityānanda Prabhu brought all the holy places here, so people from the surrounding villages bathe here instead of in the Gaṅgā. The name recalls the dadhi-ciḍā festival (flat rice with yogurt), at which Nityānanda received prasādam kneeling (hāṅṭu means knee). The lake holds water all year; large fairs are held at Goṣṭhāṣṭamī and on Nityānanda’s appearance day."]});
Object.assign(PLACES.pandavatala,{s:['Pāṇḍava-tala','Pāṇḍava-tala'],img:[PLACES.pandavatala.img[0],im('2025/02/Ekacakra_Temple_pandavas-scaled.jpg','Tempelj Pāṇḍavov v Ekacakri','The Pāṇḍava temple at Ekacakrā'),im('2024/12/Bhima_Bakasura.jpg','Bhīma in Bakāsura','Bhīma and Bakāsura')],
 d:["Po izročilu so tu med izgnanstvom prikrito živeli pet Pāṇḍavov in Draupadī. Med izgnanstvom so bivali pri brāhmaṇski družini, ki jo je ogrožal demon Bakāsura; Kuntī je Bhīmi naročila, naj ga ubije (Śrīmad-Bhāgavatam 1.13 omenja njihove stiske v izgnanstvu).","By tradition the five Pāṇḍavas and Draupadī lived here incognito during their exile. During the exile they stayed with a brāhmaṇa family troubled by the demon Bakāsura; Kuntī told Bhīma to kill him (Śrīmad-Bhāgavatam 1.13 mentions their hardships in exile)."]});
Object.assign(PLACES.bakula,{s:['Bakula-tala','Bakula-tala'],img:[PLACES.bakula.img[0],im('2025/02/Sundaranga_Bakulatala-6-scaled.jpg','Bakula-tala','Bakula-tala')],

Object.assign(PLACES.padmavati,{s:['Jezerce Padmāvatī','Padmāvatī pond'],img:[PLACES.padmavati.img[0],im('2025/02/Nandan_Padmavat_pond-6-scaled.jpg','Jezerce Padmāvatī','Padmāvatī pond')],

 d:["Krona ISKCON Māyāpurja in kmalu največji vedski tempelj na svetu. Śrīla Prabhupāda ga je v pismu leta 1974 imenoval Śrī Māyāpur Candrodaya Mandir, »vzhajajoča luna Māyāpurja«, in želel, da bi se njegova slava razširila po vsem svetu. Leta 1976 je opisal velik tempelj, ki bo prikazoval planetarni sistem iz Śrīmad-Bhāgavatama in privabljal ljudi z vsega sveta; istega leta je Ambarīṣi dāsu naročil, naj gradnjo financira. TOVP je svetovni sedež ISKCON-a; kupola naj bi bila najvišja in najširša na svetu. Uradna otvoritev bo 1. novembra 2027, ob 50. obletnici Prabhupādovega odhoda, praznovanje pa bo trajalo do Gaura-pūrṇime 11. marca 2028. Takrat bodo vsa māyāpurska Božanstva slovesno prenesena v novi tempelj in vzpostavljenih bo šestnajst novih ācārya-mūrti.",
   "The crown jewel of ISKCON Mayapur and soon the largest Vedic temple in the world. In a 1974 letter Śrīla Prabhupāda named it Śrī Māyāpur Candrodaya Mandir, “the Rising Moon of Mayapur”, hoping its fame would spread all over the world. In 1976 he described a large temple that would show the planetary system of Śrīmad-Bhāgavatam and attract people from all over the world; that same year he asked Ambarīṣa dāsa to finance it. The TOVP is ISKCON’s world headquarters; its dome is described as the tallest and widest in the world. The official inauguration will be on 1 November 2027, the 50th anniversary of Prabhupāda’s departure, and the festival will last until Gaura Pūrṇimā on 11 March 2028. Then all the Mayapur Deities will be ceremonially transferred to the new temple and sixteen new ācārya-mūrtis will be installed."],
 dei:["Mūrti Śrīle Prabhupāde v naravni velikosti, vzpostavljen oktobra 2021 ob 125. obletnici njegove pojavitve: Prabhupāda na vyāsāsani v drži čaščenja pred Śrī Śrī Rādhā-Mādhavo in Pañca-tattvo. Nṛsiṁhadevovo krilo je odprto od leta 2024.","A life-size mūrti of Śrīla Prabhupāda, installed in October 2021 for his 125th appearance anniversary: Prabhupāda on his vyāsāsana in a pose of worship before Śrī Śrī Rādhā-Mādhava and the Pañca-tattva. The Nṛsiṁhadeva wing has been open since 2024."]};

np('mayapur','gadadhara',["Gadādhara-aṅgana","Gadādhara-aṅgana"],["Dom Gadādhare Paṇḍita v Māyāpurju, posvečen Gaura-Gadādhari; tu se spominjajo tudi Gadādharove iniciacije od Puṇḍarīke Vidyānidhija.","The home of Gadādhara Paṇḍita in Māyāpur, dedicated to Gaura-Gadādhara; here his initiation by Puṇḍarīka Vidyānidhi is also remembered."],[['2024/08/Sri-Gadadhar-Angan-scaled.jpg','Gaura-Gadādhara','Gaura-Gadādhara'],['2025/09/Gadadhara_Vidhyanidhi.jpg','Gadādhara in Puṇḍarīka Vidyānidhi','Gadādhara and Puṇḍarīka Vidyānidhi']]);
np('mayapur','balladighi',["Balladighi (Pṛthu-kuṇḍa)","Balladighi (Pṛthu-kuṇḍa)"],["Ko je Pṛthu Mahārāja ravnal zemljo, je tu zagledal veliko svetlobo, kraj prepoznal kot Navadvīpo, njegovo slavo ohranil skrito in dal izkopati kuṇḍo. Pozneje jo je kralj Lakṣmaṇa Sena povečal in poglobil ter jo v blagor prednikov poimenoval Ballāl-dighi po očetu Ballāli Seni.","While levelling the land Pṛthu Mahārāja saw a great light here, recognised the place as Navadvīpa, kept its glories secret and had the kuṇḍa dug. Later King Lakṣmaṇa Sena enlarged and deepened it and, for the deliverance of his forefathers, named it Ballāl-dighi after his father Ballāla Sena."],[['2025/09/Balladighi-Prthu-Kunda_Aug25_sq.jpg','Balladighi (Pṛthu-kuṇḍa)','Balladighi (Pṛthu-kuṇḍa)']]);
np('mayapur','vrddhasiva',["Vṛddha-Śiva-ghāṭa (Prauḍhā Māyā)","Vṛddha-Śiva-ghāṭa (Prauḍhā Māyā)"],["Tu večno prebiva Prauḍhā Māyā. 27. januarja 2023 je ISKCON Māyāpur s harināmo ponesel Śiva-liṅgo in Nitāi-Gaurasundaro od dvorišča Rādhā-Mādhave do Vṛddha-Śiva-ghāṭe in prosil Gospoda Śivo za blagoslov.","Prauḍhā Māyā is eternally situated here. On 27 January 2023 ISKCON Mayapur carried a Śiva-liṅga and Nitāi-Gaurasundara in a harināma procession from the Rādhā-Mādhava courtyard to Vṛddha-Śiva-ghāṭa, seeking Lord Śiva’s blessings."],[['2024/08/Vrddha-Siva-Ghat-Praudha-Maya.jpeg','Vṛddha-Śiva-ghāṭa','Vṛddha-Śiva-ghāṭa']]);
np('mayapur','gaurangaghat',["Gaurāṅga-ghāṭa","Gaurāṅga-ghāṭa"],["Kraj je določil Śrīla Bhaktisiddhānta Sarasvatī Ṭhākura, zaznamuje ga drevo śimul. Gaurāṅga se je tu kot otrok igral in šalil. Gaṅgā je izvajala pokoro, da bi sodelovala pri Njegovih zabavah, in Kṛṣṇa ji je obljubil, da bo Gaurāṅga izvajal zabave v njenih vodah.","Identified by Śrīla Bhaktisiddhānta Sarasvatī Ṭhākura and marked by a śimul tree. Gaurāṅga played and pranked here as a child. The Gaṅgā performed austerities to share in His pastimes, and Kṛṣṇa promised her that Gaurāṅga would perform pastimes in her waters."],[['2024/08/Gauranga-Ghat.jpeg','Gaurāṅga-ghāṭa','Gaurāṅga-ghāṭa'],['2025/12/gauranga-ghat-shimul-tree-Diacritics.jpg','Drevo śimul na Gaurāṅga-ghāṭi','Śimul tree at Gaurāṅga-ghāṭa']]);
np('mayapur','barakona',["Bārakoṇa-ghāṭa","Bārakoṇa-ghāṭa"],["Čudovita ghāṭa, ki jo je po Kṛṣṇovem ukazu zgradil Viśvakarmā, s petimi templji Śive. Mimo nje je šel Śrī Caitanya Mahāprabhu med saṅkīrtano, tu je Jīva vprašal: »Kje je Nityānanda Prabhu?«, in tu je Deček premagal Keśavo Kāśmīrija.","A beautiful ghāṭa built by Viśvakarmā on Kṛṣṇa’s order, with five Śiva temples. Śrī Caitanya Mahāprabhu passed it during saṅkīrtana; here Jīva asked, “Where is Nityānanda Prabhu?”; and here Keśava Kāśmīrī was defeated by the Boy."],[['2024/08/Barakona-Ghat.jpg','Bārakoṇa-ghāṭa','Bārakoṇa-ghāṭa']]);
np('mayapur','nagariya',["Nāgariyā-ghāṭa","Nāgariyā-ghāṭa"],["Ghāṭa ob Gaṅgi, opisana v Caitanya-bhāgavati: Mahāprabhu je med saṅkīrtano po Mādhāijevi in Bārakoṇa-ghāṭi šel mimo nje skozi Gaṅgānagaro v Simuliyo proti hiši Čānda Kazija. Njena točna lega še ni odkrita (lupta-tīrtha).","A bathing ghāṭa on the Gaṅgā described in the Caitanya-bhāgavata: during saṅkīrtana Mahāprabhu passed it after Mādhāi’s ghāṭa and Bārakoṇa-ghāṭa and went through Gaṅgānagara to Simuliyā, towards Chand Kazi’s house. Its exact location has not been discovered (lupta-tīrtha)."],[['2024/08/Nagariya-Ghat.jpg','Nāgariyā-ghāṭa','Nāgariyā-ghāṭa']]);
np('mayapur','bharadvaja',["Bharadvāja-ṭilā","Bharadvāja-ṭilā"],["Bharadvāja Muni je po obisku Gaṅgā-sāgare tu bival in častil Gauracandro, ki mu je obljubil, da Ga bo videl ob Njegovi pojavitvi; tu je dosegel gaura-premo. Ljudje kraj imenujejo Bhāruiḍāṅgā. Pet ṛṣijev z Nārado na čelu je tu napisalo Pañcarātro.","After seeing Gaṅgā-sāgara, Bharadvāja Muni stayed here and worshipped Gauracandra, who promised that he would see Him at His advent; here he attained gaura-prema. People call the place Bhāruiḍāṅgā. Here the five ṛṣis headed by Nārada wrote the Pañcarātra."],[['2024/09/Bhardavaja-Tila_Sept24.jpg','Bharadvāja-ṭilā','Bharadvāja-ṭilā']]);
np('mayapur','sivadoba',["Śiva-ḍoba","Śiva-ḍoba"],["Ribnik, ki po Śrī Navadvīpa-dhāma-māhātmyi (5. poglavje) zaznamuje nekdanji breg Gaṅge. Leži v Śrī Śrī Śānta Gosvāmī Gauḍīya Maṭhu nasproti bolnišnice Śrī Mayapur Community Hospital; Śiva-liṅga je bil vzpostavljen leta 2002, tempelj zgrajen leta 2019.","A pond which, according to Śrī Navadvīpa-dhāma-māhātmya (chapter 5), marks the former bank of the Gaṅgā. It lies within Śrī Śrī Śānta Gosvāmī Gauḍīya Maṭha opposite Sri Mayapur Community Hospital; the Śiva-liṅga was installed in 2002 and the temple built in 2019."],[['2024/09/Siva-Doba-scaled.jpg','Śiva-ḍoba','Śiva-ḍoba']]);
np('mayapur','jayadeva',["Hiša Jayadeve Gosvāmīja","House of Jayadeva Gosvāmī"],["V času kralja Lakṣmaṇe Sene je Jayadeva na bregu Ballāl-dighi zgradil kočo in tu z ženo Padmāvatī živel in pisal pesem o desetih avatarjih (Daśāvatāra). Pozneje mu je kralj zgradil kočo v Campahaṭṭi. Gaurāṅga se mu je prikazal in obljubil, da se bo rodil v Nadii; nato sta odšla v Nīlācalo (Purī).","In King Lakṣmaṇa Sena’s time Jayadeva built a hut on the bank of Ballāl-dighi and lived here with his wife Padmāvatī, writing the poem of the ten avatāras (Daśāvatāra). Later the king had a cottage built for him at Campahaṭṭa. Gaurāṅga appeared to him and promised to take birth in Nadia; then the couple went to Nīlācala (Purī)."],[['2024/08/Dashavatara2.jpg','Daśāvatāra','Daśāvatāra']]);
np('mayapur','sangam',["Saṅgam in Īśodyāna","Saṅgam and Īśodyāna"],["Īśodyāna, Gospodov vrt, leži v južnem Māyāpurju na bregu Gaṅge blizu sotočja s Sarasvatī; tam Gaurāṅga izvaja zabave s prijatelji. Bhaktivinoda Ṭhākura moli, da bi smel prebivati blizu Īśodyāne.","Īśodyāna, the Lord’s garden, lies in southern Māyāpur on the bank of the Gaṅgā near its confluence with the Sarasvatī, where Gaurāṅga performs pastimes with His friends. Bhaktivinoda Ṭhākura prays to reside near Īśodyāna."],[['2024/12/Sangam.jpg','Saṅgam','Saṅgam']]);

np('simanta','rajapur',["ISKCON Rājāpur","ISKCON Rājāpur"],["Duhovno zatočišče s templji Jagannāthe, Baladeve in Subhadre, Mahāprabhuja in Sīmantinī-devī ter Gospoda Śive pod svetim banjanovcem.","A spiritual sanctuary with temples of Jagannātha, Baladeva and Subhadrā, of Mahāprabhu and Sīmantinī-devī, and of Lord Śiva beneath the sacred banyan."],[['2024/08/Jagannath_Baladeva_Subhadradevi-scaled.jpg','Jagannātha, Baladeva in Subhadrā','Jagannātha, Baladeva and Subhadrā'],['2024/08/Mahaprabhu_Simantinidevi-scaled.jpg','Mahāprabhu in Sīmantinī-devī','Mahāprabhu and Sīmantinī-devī'],['2024/08/LordSiva-scaled.jpg','Gospod Śiva','Lord Śiva']]);
np('simanta','sridhara',["Kholāvecā Śrīdhara-aṅgana","Kholāvecā Śrīdhara-aṅgana"],["Dom Kholāveče Śrīdhare (v Kṛṣṇovi līli Kusumāsava), imenovan tudi Sudāmova hiša, sredi Madhuvane. Gaurahari je tu počival po kīrtani, zato se kraj imenuje kīrtana-viśrāma-sthāna. Kopanje, dobrodelnost, japa ali žrtvovanje tu prinesejo tisočkrat večji sad.","The home of Kholāvecā Śrīdhara (Kusumāsava in Kṛṣṇa-līlā), also called Sudāmā’s house, in the middle of Madhuvana. Gaurahari rested here after kīrtana, so the place is known as kīrtana-viśrāma-sthāna. Bathing, charity, japa or sacrifice here bear a thousandfold result."],[['2024/08/Kholaveca-Sridhara-hut-scaled.jpg','Koča Kholāveče Śrīdhare','Kholāvecā Śrīdhara’s hut'],['2024/08/Visrama-sthana-scaled.jpg','Viśrāma-sthāna','Viśrāma-sthāna'],['2024/08/Mahaprabhu-Purchasing-Bananas-from-Sridhara.jpeg','Mahāprabhu kupuje banane od Śrīdhare','Mahāprabhu buying bananas from Śrīdhara']]);
np('simanta','chandkazi',["Samādhi Čānda Kazija","Chand Kazi’s samādhi"],["Samādhi pod svetim drevesom čampa označuje počivališče Čānda Kazija, ki je v Kṛṣṇovi līli Kaṁsa. Po Navadvīpa-dhāma-māhātmyi pogled na ta samādhi uniči starost in bolezen živih bitij.","The samādhi beneath a sacred campaka tree marks the resting place of Chand Kazi, who in Kṛṣṇa-līlā is Kaṁsa. According to Navadvīpa-dhāma-māhātmya, seeing this samādhi vanquishes the old age and disease of living beings."],[['2024/08/ChandKazi_Samadhi-scaled.jpg','Samādhi Čānda Kazija','Chand Kazi’s samādhi'],['2024/08/Lord-Caitanya-and-Chand-Kazi.jpg','Gospod Caitanya in Čānd Kazi','Lord Caitanya and Chand Kazi']],{s:['Čānd Kazi','Chand Kazi']});
np('simanta','madanagopala',["Tempelj Madana-Gopāle (Belpukur)","Madana-Gopāla temple (Belpukur)"],["Tu sta Śrī Madana-Gopālo častila Nīlāmbara Cakravartī (prej Garga Muni), Mahāprabhujev ded, in Śacī-mātā, Njegova mati.","Here Śrī Madana-Gopāla was worshipped by Nīlāmbara Cakravartī (formerly Garga Muni), Mahāprabhu’s grandfather, and by Śacī-mātā, His mother."],[['2024/08/Madan-Gopal.jpg','Śrī Madana-Gopāla','Śrī Madana-Gopāla'],['2024/08/Nilambara-Cakravarti.jpg','Nīlāmbara Cakravartī','Nīlāmbara Cakravartī'],['2024/08/Srimati-Sacidevi.jpg','Śrīmatī Śacī-devī','Śrīmatī Śacī-devī']],{s:['Madana-Gopāla','Madana-Gopāla']});
np('simanta','pancavaktra',["Pañcavaktra Śiva (Bilva-pakṣa)","Pañcavaktra Śiva (Bilva-pakṣa)"],["Belapukura, nekdaj Bilva-pakṣa: brāhmaṇe, ki so petnajst dni častili Śivo z listi bilva, so prejeli blagoslov, da bodo služili Kṛṣṇi, ko se bo pojavil v Nadii. Nimbāditya je tu srečal štiri Kumāre in prejel mantro Rādhe-Kṛṣṇe; Rādhā in Kṛṣṇa sta se mu nato prikazala kot Gaurāṅga.","Belapukura, formerly Bilva-pakṣa: brāhmaṇas who worshipped Śiva with bilva leaves for fifteen days were blessed to serve Kṛṣṇa when He appeared in Nadia. Here Nimbāditya met the four Kumāras and received the Rādhā-Kṛṣṇa mantra; Rādhā and Kṛṣṇa then appeared to him as Gaurāṅga."],[['2024/09/20240809_112437.jpg','Pañcavaktra Śiva','Pañcavaktra Śiva']]);
np('simanta','simantini',["Sīmantinī-mandira","Sīmantinī-mandira"],["Kraj, ki velja za mesto Sīmantinī; templja ali Božanstva Sīmantinī tu ni, v templju je Śiva-liṅga. Boginja Sīmantinī je danes pod drevesom pipal v Khalsepadi.","The place regarded as Sīmantinī’s site; there is no temple or Deity of Sīmantinī here, and a Śiva-liṅga is installed in the temple. The goddess Sīmantinī is now under a pipal tree at Khalsepada."],[['2024/08/Temple-1-scaled.jpg','Sīmantinī-mandira','Sīmantinī-mandira']]);
np('simanta','rukmapura',["Rukmapura (Rāma-tīrtha)","Rukmapura (Rāma-tīrtha)"],["Tu je Gospod Balarāma ubil demona Kolāsuro in se nato kopal z Yaduji. Kraj leži na enem koncu Navadvīpa parikrame, obdan z bujnim drevjem.","Here Lord Balarāma slew the demon Kolāsura and afterwards bathed with the Yadus. It lies at one end of the Navadvīpa parikramā, surrounded by lush trees."],[['2024/12/Rukmapura_Nandan_Deities-9.jpg','Božanstva v Rukmapuri','Deities at Rukmapura']]);
np('simanta','meghera',["Meghera-cara","Meghera-cara"],["Leži med vasema Belpukur in Sonadanga. Ko je Caitanya Mahāprabhu izvajal kīrtano, je ustavil oblake, ki so se zbirali nad Njim; po tem je kraj dobil ime. Caitanya-maṅgala Locane dāsa Ṭhākure opisuje, kako je Gospod s petjem pomiril grmeče večerne oblake.","Between the villages of Belpukur and Sonadanga. While Caitanya Mahāprabhu was performing kīrtana He halted the clouds gathering overhead, which gave the place its name. Locana dāsa Ṭhākura’s Caitanya-maṅgala describes how the Lord calmed the thundering evening clouds by chanting."],[['2024/08/Megher-Chara3-scaled.jpg','Meghera-cara','Meghera-cara']]);
np('simanta','ballaldhipi',["Ballāl-dhipi","Ballāl-dhipi"],["Ruševine palače kralja Ballāle Sene, katerega prestolnica je bila v Navadvīpi; varuje jih indijska vlada. Izkopavanja (1982–1989) so razkrila opečno zgradbo iz 12. stoletja, zgrajeno na ostankih iz 8. in 9. stoletja.","The ruins of the palace of King Ballāla Sena, whose capital was at Navadvīpa, preserved by the Government of India. Excavations (1982–1989) revealed a 12th-century brick structure built over 8th–9th-century remains."],[['2024/08/Ballaldhipi-scaled.jpg','Ballāl-dhipi','Ballāl-dhipi']]);
np('simanta','mayamari',["Māyāmāri","Māyāmāri"],["Baladeva je na romanju prišel v Navadvīpo, kjer so Mu brāhmaṇe povedali o demonu Māyāsuri; ubil ga je na polju, ki se zato imenuje Māyāmāri. V Vṛndāvani ustreza Tālavani, kjer sta Balarāma in Kṛṣṇa uničila Dhenukāsuro.","On pilgrimage Baladeva came to Navadvīpa, where brāhmaṇas told Him of the demon Māyāsura; He killed him in a field, which is therefore called Māyāmāri. In Vṛndāvana it corresponds to Tālavana, where Balarāma and Kṛṣṇa destroyed Dhenukāsura."],[['2024/08/Mayamari.jpeg','Māyāmāri','Māyāmāri']]);
