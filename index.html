function printSheet(lv,cards){
  const qs=[]; LVL(lv).forEach(si=>{ POOL[si].forEach(Q=>qs.push([si,Q])); if(STAGES[si].fq) qs.push([si,STAGES[si].fq]) });
  const el=document.createElement('div'); el.id='printArea';
  el.innerHTML=`<h1>${t('title')} · ${t('lv'+lv)}</h1>`+(cards?
    `<div class="pcards">${qs.map(([si,Q],n)=>{const o=shuffle([0,1,2],rng(n*97+lv)), op=qOpts(Q);return `<div class="pcard"><div class="pc-h">${n+1} · ${esc(pn(Q[0]))}</div><p class="pc-q">${esc(qText(Q))}</p><ol type="a">${o.map(i=>`<li>${esc(op[i])}</li>`).join('')}</ol><p class="pc-a">${t('printAns')}: ${'abc'[o.indexOf(0)]})</p></div>`}).join('')}</div><p class="pnote">${t('printCardsNote')}</p>`
    :LVL(lv).map(si=>`<h2>${esc(tr(STAGES[si].n))}</h2><ol>${qs.filter(x=>x[0]===si).map(([,Q])=>`<li><p><b>${esc(qText(Q))}</b> <i>(${esc(pn(Q[0]))})</i></p><p>${t('printAns')}: ${esc(qOpts(Q)[0])}. ${esc(qEx(Q))}</p><p class="psrc">${t('srcL')}: ${esc(qSrc(Q))}</p></li>`).join('')}</ol>`).join(''));
  document.body.appendChild(el); document.documentElement.classList.add('printing');
  const done=()=>{el.remove();document.documentElement.classList.remove('printing');window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done); setTimeout(()=>{ try{window.print()}catch(e){} setTimeout(()=>{ if(document.getElementById('printArea')) done() },1500) },60);
}

/* povečava z listanjem / lightbox gallery */
let lbList=[], lbI=0;
function lbShow(){ const a=lbList[lbI]; if(!a) return; $('lbImg').src=a.src.replace(/width=\d+/,'width=2400'); $('lbImg').alt=a.cap||''; $('lbCap').textContent=a.cap||''; $('lbCount').textContent=lbList.length>1?`${lbI+1} / ${lbList.length}`:''; $('lbPrev').hidden=$('lbNext').hidden=lbList.length<2 }
function lightbox(list,i){ lbList=Array.isArray(list)?list:[{src:list,cap:i||''}]; lbI=Array.isArray(list)?(i||0):0; $('lbClose').textContent=t('close'); $('lightbox').hidden=false; lbShow() }
const lbStep=d=>{ if(lbList.length<2) return; lbI=(lbI+d+lbList.length)%lbList.length; lbShow() };
const lbClose=()=>{$('lightbox').hidden=true};
$('lbClose').onclick=lbClose; $('lbPrev').onclick=e=>{e.stopPropagation();lbStep(-1)}; $('lbNext').onclick=e=>{e.stopPropagation();lbStep(1)};
$('lightbox').onclick=e=>{if(e.target.id==='lightbox')lbClose()};
$('lbImg').onerror=function(){ const a=lbList[lbI]; if(a&&this.src!==a.src) this.src=a.src };
(()=>{let x0=null; const lb=$('lightbox'); lb.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true}); lb.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>45) lbStep(dx<0?1:-1); x0=null },{passive:true})})();

/* ---------- Navodila / Guide ---------- */
const HELP={
 sl:()=>`<h3>Cilj igre</h3>
  <p>Prepotuješ sveta mesta Indije in zbiraš tilake. Ob tem spoznaš Božanstva, templje, zabave Gospoda in velike bhakte, ki so ta mesta obiskali. Vprašanja temeljijo na knjigah Śrīle Prabhupāde; kjer podatek izhaja iz izročila templja ali zgodovine, je to navedeno pri viru. Zmaga, kdor do konca zbere največ tilak.</p>
  <h3>Romanja, parikrame in dnevna igra</h3>
  <ul><li><b>Osnovno romanje:</b> 7 stopenj, od izvira Gaṅge do Vṛndāvane. Vsaka igra izbere ${FULLQ} novih vprašanj iz zbirke ${POOLSIZE}.</li>
  <li><b>Daśāvatāra romanje:</b> 5 stopenj po templjih daśāvatāre (Matsya, Kūrma, Varāha, Narasiṁha, Vāmana, Rāma) in k velikim Božanstvom Kṛṣṇe: Śrīnāthjī, Govinda, Gopīnātha, Madana-mohana, Raṇchoḍrāya, Guruvāyūrappan, Viṭhṭhala in ležeči Viṣṇu. ${FULLQ2} vprašanj iz zbirke ${POOLSIZE2}.</li>
  <li><b>Parikrame:</b> Navadvīpa-maṇḍala (devet otokov Navadvīpe), Ekacakrā (rojstni kraj Nityānande Prabhuja) in Jagannātha Purī. Vsaka ima svoj video in zemljevid v atlasu pod zavihkom <b>Parikrame</b>.</li>
  <li><b>Navadvīpa-dhāma:</b> vsi opisani sveti kraji devetih otokov z največjim poudarkom na Templju vedskega planetarija (TOVP); v zavihku <b>Parikrame</b> so še Gaura-maṇḍala, Śrīla Prabhupāda in Māyāpur ter guru-paramparā.</li>
  <li><b>Glasba:</b> gumb 🔊 v glavi glasbo v ozadju utiša ali vklopi; v meniju <b>Zvok</b> jo z gumboma Tišje in Glasneje ali drsnikom nastaviš tišje.</li>
  <li><b>Vraja-maṇḍala parikramā:</b> 3 stopnje po Kṛṣṇovih zabavah v Vraji iz Śrīmad-Bhāgavatama: Gokula, gozdovi Vraje, Govardhana in Vṛndāvana. ${FULLQ3} vprašanj iz zbirke ${POOLSIZE3}.</li>
  <li><b>Dnevno romanje:</b> vsak dan druga stopnja iz vseh romanj s 5 vprašanji. Vprašanja so tisti dan za vse enaka. Igra šteje zaporedne dni.</li></ul>
  <h3>Potek</h3>
  <ol><li>Izberi način in romanje, vpiši imena igralcev ali ekip ter pritisni <b>Začni romanje</b>.</li>
  <li>Pri vsakem vprašanju v ozadju vidiš fotografijo svetega mesta, ob imenu pa majhen zemljevid. Tapni ga, da odpreš atlas.</li>
  <li>Izberi odgovor <b>a)</b>, <b>b)</b> ali <b>c)</b>. Na računalniku lahko pritisneš tipko A, B ali C.</li>
  <li>Po odgovoru prebereš razlago in vir.</li></ol>
  <h3>Točke – tilake</h3>
  <ul><li>Pravilen odgovor: <b style="color:var(--gold)">+4 tilake</b>; po namigu, ki odstrani en napačen odgovor: +2 tilaki.</li>
  <li><b>Niz saṅkīrtane:</b> vsak tretji pravilen odgovor zapored brez namiga prinese še +2 tilaki. Napačen odgovor ali namig niz prekine.</li>
  <li><b>Mahā-mantra:</b> po vsaki stopnji vsak igralec ali ekipa s tapkanjem besed Hare, Kṛṣṇa in Rāma sestavi vseh 16 besed mahā-mantre. Pravilno sestavljena prinese +4 tilake.</li>
  <li>Pri časovni omejitvi se odgovor, ki ni izbran v 30 sekundah, šteje za napačnega.</li></ul>
  <h3>Igra v ekipah</h3>
  <ul><li><b>Koliko ekip?</b> Na eni napravi lahko hkrati tekmuje od 1 do 6 igralcev ali ekip. Ekipa ima lahko poljubno število članov, ki se posvetujejo, odgovor pa izbere vodja ekipe.</li>
  <li><b>Enaka vprašanja?</b> Ekipe odgovarjajo izmenično, vsaka na svoje vprašanje iz iste stopnje in iste zbirke. Igra število vprašanj na vsaki stopnji prilagodi tako, da jih <b>vsaka ekipa dobi enako</b>. Na vsaki stopnji začne naslednja ekipa, zato nobena nima prednosti.</li>
  <li><b>Prevzem:</b> če ekipa odgovori napačno (brez namiga), lahko naslednja ekipa izbere med preostalima odgovoroma. Pravilen prevzem prinese +2 tilaki, napačen nič. Prevzem lahko tudi izpusti. Pravilo vklopiš ali izklopiš na začetku.</li>
  <li><b>Točkovanje:</b> vse tilake se seštevajo sproti in so vidne v glavi igre ob imenih ekip; med stopnjami vidiš še lestvico vdanosti za vsako ekipo. Na koncu se prikaže razvrstitev s številom pravilnih odgovorov in prevzemov.</li>
  <li><b>Neodločeno:</b> če ima na vrhu več ekip enako število tilak, sledi <b>odločilno vprašanje</b>: vsaka izenačena ekipa dobi svoje novo vprašanje; zmaga, kdor edini odgovori pravilno. Če to ne uspe, sledi nov krog (največ pet).</li>
  <li><b>Ekipe na več napravah:</b> vsaka ekipa igra na svojem telefonu kot en igralec in vse vpišejo isto <b>kodo igre</b> (npr. GAURA108). Tako dobijo enaka vprašanja v enakem vrstnem redu. Na koncu primerjate tilake. Enako velja za dnevno romanje, ki ima za vse isti dan enaka vprašanja.</li>
  <li><b>Primer za skupino:</b> 3 ekipe, osnovno romanje, časovna omejitev in prevzem vklopljeni. Vsaka ekipa dobi na vsaki stopnji enako število vprašanj, po vsaki stopnji pa vsaka sestavi mahā-mantro.</li></ul>
  <h3>Napredovanje</h3>
  <p>Med stopnjami vidiš zemljevid poti in svojo stopnjo na lestvici devetih stopenj vdanosti iz Nektarja vdanosti: śraddhā, sādhu-saṅga, bhajana-kriyā, anartha-nivṛtti, niṣṭhā, ruci, āsakti, bhāva in prema. Igra se sproti shranjuje.</p>
  <h3>Atlas – enciklopedija svetih mest</h3>
  <p>Gumb <b>Atlas</b> odpre zemljevid vseh svetih mest iz vseh romanj in parikram. Za vsako mesto so opisana <b>Božanstva</b>, <b>zgodba in pomen</b> ter zapisi <b>iz knjig in izročila</b> z viri. Mesta lahko iščeš po imenu ali Božanstvu. Tapni fotografijo, da jo povečaš, in listaj po albumu s puščicami ali s potegom prsta.</p>
  <h3>Vodnik za romarje</h3>
  <ul><li><b>Za romarje:</b> pri vsakem kraju so pomembna pravila za obisk (npr. kje smejo vstopiti le hindujci), glavni prazniki z meseci, v katerih običajno padejo, in gumb <b>Navigacija do sem</b>, ki odpre zemljevid s točnim imenom templja. Urnikov darśana ne navajamo, ker se spreminjajo.</li>
  <li><b>Poti:</b> Mahāprabhujevo potovanje po južni Indiji in v Vṛndāvano po Caitanya-caritāmṛti, korak za korakom na zemljevidu.</li>
  <li><b>Koledar:</b> prazniki svetih mest po mesecih; trenutni mesec je poudarjen.</li>
  <li><b>Moje romanje:</b> označi obiskane kraje, dodaj datum, zapis, svojo fotografijo in glasbo ob odprtju kraja. Vse ostane samo na tvoji napravi.</li>
  <li><b>Shrani fotografije za pot:</b> v nameščeni aplikaciji shrani fotografije kraja, da so vidne tudi brez interneta. Besedila in vprašanja delujejo brez interneta že sama po sebi.</li>
  <li><b>Iz knjig:</b> pri virih so povezave na poglavja v knjigah Śrīle Prabhupāde na vedabase.io.</li>
  <li><b>Za učitelje:</b> tisk vseh vprašanj z odgovori, tisk kartic, projektorski način z večjo pisavo, <b>izdelava prezentacij</b> (predvajanje, HTML, PDF), <b>arhiv na disku</b> (shrani in uvozi vse svoje podatke) in – z osebnim geslom, ki ga dodeli ustvarjalec programa – <b>urejanje vsebin</b>: kraji, slike, besedila, glasba, vprašanja in odgovori ter lastna romanja.</li>
  <li><b>Listanje v atlasu:</b> gumba <b>‹ ›</b> v glavi atlasa vodita nazaj in naprej po ogledanih straneh (kraji, Parikrame, Poti, Koledar …). Pas na vrhu opisa (◀ ▶ ali puščici na tipkovnici) odpre prejšnji in naslednji kraj, ne da bi se moral pomikati navzdol.</li></ul>
  <h3>Zvok in mahā-mantra</h3>
  <p>V ozadju igre se predvaja Hare Kṛṣṇa mahā-mantra. Gumb <b>Zvok</b> odpre nastavitve: mahā-mantra, vgrajena <b>tanpura</b>, ki deluje brez interneta, ali izklop. Dodaš lahko tudi svoje posnetke bhajanov, ki ostanejo samo na tvoji napravi.</p>
  <h3>Jezik</h3><p>Gumb za jezik v glavi kadar koli zamenja jezik: slovenščina, angleščina in hrvaščina.</p>`,
 en:()=>`<h3>Aim of the game</h3>
  <p>You travel through the holy places of India and collect tilakas. Along the way you learn about the Deities, the temples, the Lord's pastimes and the great devotees who visited these places. The questions are based on Śrīla Prabhupāda's books; where a fact comes from temple tradition or history, the source says so. Whoever collects the most tilakas by the end wins.</p>
  <h3>Pilgrimages, parikramās and a daily game</h3>
  <ul><li><b>Basic pilgrimage:</b> 7 stages, from the source of the Gaṅgā to Vṛndāvana. Every game draws ${FULLQ} new questions from a pool of ${POOLSIZE}.</li>
  <li><b>Daśāvatāra pilgrimage:</b> 5 stages through the temples of the daśāvatāra (Matsya, Kūrma, Varāha, Narasiṁha, Vāmana, Rāma) and to the great Deities of Kṛṣṇa: Śrīnāthjī, Govinda, Gopīnātha, Madana-mohana, Raṇchoḍrāya, Guruvāyūrappan, Viṭhṭhala and the reclining Viṣṇu. ${FULLQ2} questions from a pool of ${POOLSIZE2}.</li>
  <li><b>Parikramās:</b> Navadvīpa-maṇḍala (the nine islands of Navadvīpa), Ekacakrā (birthplace of Nityānanda Prabhu) and Jagannātha Purī. Each has its own video and map in the atlas under the <b>Parikramās</b> tab.</li>
  <li><b>Navadvīpa-dhāma:</b> all described holy places of the nine islands, with the greatest highlight on the Temple of the Vedic Planetarium (TOVP); the <b>Parikramās</b> tab also has Gaura-maṇḍala, Śrīla Prabhupāda and Mayapur, and the guru-paramparā.</li>
  <li><b>Music:</b> the 🔊 button in the header mutes or unmutes the background music; in the <b>Sound</b> menu make it quieter with the Quieter and Louder buttons or the slider.</li>
  <li><b>Vraja-maṇḍala parikramā:</b> 3 stages through Kṛṣṇa's pastimes in Vraja from the Śrīmad-Bhāgavatam: Gokula, the forests of Vraja, Govardhana and Vṛndāvana. ${FULLQ3} questions from a pool of ${POOLSIZE3}.</li>
  <li><b>Daily pilgrimage:</b> every day a different stage from all pilgrimages, with 5 questions. The questions are the same for everyone that day. The game counts the days in a row.</li></ul>
  <h3>How it works</h3>
  <ol><li>Choose a mode and a pilgrimage, enter the names of the players or teams and press <b>Begin the pilgrimage</b>.</li>
  <li>Each question shows a photo of the holy place in the background and a small locator map next to its name. Tap the map to open the atlas.</li>
  <li>Choose answer <b>a)</b>, <b>b)</b> or <b>c)</b>. On a computer you can press A, B or C.</li>
  <li>After answering, read the explanation and the source.</li></ol>
  <h3>Points – tilakas</h3>
  <ul><li>Correct answer: <b style="color:var(--gold)">+4 tilakas</b>; after a hint, which removes one wrong answer: +2 tilakas.</li>
  <li><b>Saṅkīrtana streak:</b> every third correct answer in a row without a hint earns another +2 tilakas. A wrong answer or a hint breaks the streak.</li>
  <li><b>Mahā-mantra:</b> after each stage every player or team taps the words Hare, Kṛṣṇa and Rāma to build all 16 words of the mahā-mantra. Built correctly, it earns +4 tilakas.</li>
  <li>With the time limit on, an answer not chosen within 30 seconds counts as wrong.</li></ul>
  <h3>Playing in teams</h3>
  <ul><li><b>How many teams?</b> From 1 to 6 players or teams can compete at once on one device. A team can have any number of members; they confer and the team leader chooses the answer.</li>
  <li><b>The same questions?</b> Teams answer in turn, each its own question from the same stage and the same pool. The game adjusts the number of questions in each stage so that <b>every team gets the same number</b>. In each stage the next team starts, so no one has an advantage.</li>
  <li><b>Steal:</b> if a team answers wrongly (without a hint), the next team may choose between the two remaining answers. A correct steal earns +2 tilakas, a wrong one nothing. A team may also pass. You switch this rule on or off at the start.</li>
  <li><b>Scoring:</b> all tilakas add up as you play and are shown in the header next to the team names; between stages you also see each team's devotional ladder. At the end the ranking shows correct answers and steals.</li>
  <li><b>Ties:</b> if two or more teams have the same number of tilakas, a <b>tie-break question</b> follows: each tied team gets its own new question; whoever alone answers correctly wins. If that does not decide it, a new round follows (up to five).</li>
  <li><b>Teams on several devices:</b> each team plays on its own phone as a single player and all enter the same <b>game code</b> (e.g. GAURA108). They then get the same questions in the same order, and compare tilakas at the end. The same works with the daily pilgrimage, which has the same questions for everyone on the same day.</li>
  <li><b>Example for a group:</b> 3 teams, basic pilgrimage, time limit and steal on. Every team gets the same number of questions in each stage, and after each stage every team builds the mahā-mantra.</li></ul>
  <h3>Progress</h3>
  <p>Between stages you see the route map and your level on the ladder of nine devotional stages from The Nectar of Devotion: śraddhā, sādhu-saṅga, bhajana-kriyā, anartha-nivṛtti, niṣṭhā, ruci, āsakti, bhāva and prema. The game saves as you play.</p>
  <h3>Atlas – encyclopedia of holy places</h3>
  <p>The <b>Atlas</b> button opens a map of all the holy places of all the pilgrimages and parikramās. For each place it describes the <b>Deities</b>, the <b>history and significance</b> and entries <b>from the books and tradition</b> with sources. You can search places by name or Deity. Tap a photo to enlarge it and browse the album with the arrows or by swiping.</p>
  <h3>Pilgrim's guide</h3>
  <ul><li><b>For pilgrims:</b> for each place, important rules for visiting (e.g. where only Hindus may enter), the main festivals with the months in which they usually fall, and a <b>Navigate here</b> button that opens the map with the exact temple name. Darśana times are not given because they change.</li>
  <li><b>Routes:</b> Mahāprabhu's tour of South India and His journey to Vṛndāvana according to the Caitanya-caritāmṛta, step by step on the map.</li>
  <li><b>Calendar:</b> the festivals of the holy places by month; the current month is highlighted.</li>
  <li><b>My pilgrimage:</b> mark the places you have visited and add a date, a note, your own photo and music for the place. Everything stays on your device only.</li>
  <li><b>Save photos for the journey:</b> in the installed app, saves a place's photos so they show without internet. Texts and questions already work offline.</li>
  <li><b>From the books:</b> sources link to the chapters of Śrīla Prabhupāda's books on vedabase.io.</li>
  <li><b>For teachers:</b> print all questions with answers, print cards, projector mode with larger text, <b>create presentations</b> (play, HTML, PDF), <b>archive on disk</b> (save and import all your data) and – with a personal password assigned by the program’s creator – the <b>content editor</b>: places, images, texts, music, questions and answers, and your own pilgrimages.</li>
  <li><b>Browsing the atlas:</b> the <b>‹ ›</b> buttons in the atlas header go back and forward through the pages you viewed (places, Parikramās, Routes, Calendar …). The bar at the top of a description (◀ ▶ or the arrow keys) opens the previous and next place without scrolling down.</li></ul>
  <h3>Sound and mahā-mantra</h3>
  <p>The Hare Kṛṣṇa mahā-mantra plays in the background of the game. The <b>Sound</b> button opens the settings: the mahā-mantra, the built-in <b>tanpura</b> (works offline) or off. You can also add your own bhajan recordings, which stay on your device only.</p>
  <h3>Language</h3><p>The language button in the header switches between Slovenian, English and Croatian at any time.</p>`};

HELP.hr=()=>`<h3>Cilj igre</h3>
  <p>Putuješ svetim mjestima Indije i skupljaš tilake. Usput upoznaješ Božanstva, hramove, Gospodinove zabave i velike bhakte koji su posjetili ta mjesta. Pitanja se temelje na knjigama Śrīle Prabhupāde; kad podatak potječe iz hramske predaje ili povijesti, to piše u izvoru. Pobjeđuje tko do kraja skupi najviše tilaka.</p>
  <h3>Hodočašća, parikrame i dnevna igra</h3>
  <ul><li><b>Osnovno hodočašće:</b> 7 etapa, od izvora Gaṅge do Vṛndāvane. Svaka igra izvlači ${FULLQ} novih pitanja iz zbirke od ${POOLSIZE}.</li>
  <li><b>Daśāvatāra hodočašće:</b> 5 etapa kroz hramove daśāvatāre (Matsya, Kūrma, Varāha, Narasiṁha, Vāmana, Rāma) i do velikih Kṛṣṇinih Božanstava. ${FULLQ2} pitanja iz zbirke od ${POOLSIZE2}.</li>
  <li><b>Parikrame:</b> Navadvīpa-maṇḍala (devet otoka Navadvīpe), Ekacakrā (rodno mjesto Nityānande Prabhua), Jagannātha Purī i Vraja-maṇḍala. Svaka ima svoj video i kartu u atlasu pod karticom <b>Parikrame</b>, gdje su još Gaura-maṇḍala, Śrīla Prabhupāda i Māyāpur te guru-paramparā. Najveći naglasak Navadvīpe je Hram vedskog planetarija (TOVP).</li>
  <li><b>Dnevno hodočašće:</b> svaki dan druga etapa iz svih hodočašća, s 5 pitanja, isto za sve. Igra broji dane zaredom.</li></ul>
  <h3>Kako se igra</h3>
  <ol><li>Odaberi način i hodočašće, upiši imena igrača ili ekipa i pritisni <b>Započni hodočašće</b>.</li>
  <li>Uz svako pitanje u pozadini je fotografija svetog mjesta, a uz ime mala karta. Dodirni kartu za atlas.</li>
  <li>Odaberi odgovor <b>a)</b>, <b>b)</b> ili <b>c)</b>; na računalu možeš pritisnuti A, B ili C.</li>
  <li>Nakon odgovora pročitaj objašnjenje i izvor.</li></ol>
  <h3>Bodovi – tilake</h3>
  <ul><li>Točan odgovor: <b style="color:var(--gold)">+4 tilake</b>; nakon pomoći, koja ukloni jedan netočan odgovor: +2 tilake.</li>
  <li><b>Saṅkīrtana niz:</b> svaki treći uzastopni točan odgovor bez pomoći donosi još +2 tilake.</li>
  <li><b>Mahā-mantra:</b> nakon svake etape svaki igrač ili ekipa složi svih 16 riječi mahā-mantre za +4 tilake.</li>
  <li>S uključenim vremenskim ograničenjem odgovor koji nije odabran u 30 sekundi računa se kao netočan.</li></ul>
  <h3>Igra u ekipama</h3>
  <ul><li>Na jednom uređaju može se natjecati 1 do 6 igrača ili ekipa; svaka ekipa dobiva <b>jednak broj pitanja</b>.</li>
  <li><b>Krađa:</b> ako ekipa odgovori netočno (bez pomoći), sljedeća smije birati između dva preostala odgovora za +2 tilake.</li>
  <li><b>Neriješeno:</b> slijedi <b>dodatno pitanje</b>; pobjeđuje tko jedini odgovori točno.</li>
  <li><b>Ekipe na više uređaja:</b> sve unesu istu <b>šifru igre</b> (npr. GAURA108) i dobiju ista pitanja istim redom.</li></ul>
  <h3>Atlas – enciklopedija svetih mjesta</h3>
  <p>Gumb <b>Atlas</b> otvara kartu svih svetih mjesta. Za svako mjesto opisuje <b>Božanstva</b>, <b>povijest i značenje</b> i unose <b>iz knjiga i predaje</b> s izvorima. Gumbi <b>‹ ›</b> u zaglavlju atlasa vode natrag i naprijed kroz pregledane stranice, a traka na vrhu opisa (◀ ▶ ili strelice na tipkovnici) vodi na prethodno i sljedeće mjesto bez pomicanja prema dolje.</p>
  <h3>Vodič za hodočasnike</h3>
  <ul><li><b>Za hodočasnike:</b> pravila posjeta, glavni blagdani s mjesecima i gumb <b>Navigacija do mjesta</b>.</li>
  <li><b>Putovi</b>, <b>Kalendar</b> i <b>Moje hodočašće</b> (dnevnik s datumom, bilješkom, vlastitom fotografijom i glazbom).</li>

const HRST=["Himalaja","Gaṅgā, Kailāsa, Badrīnāth, Muktināth","Hodočašće počinje visoko u Himalaji, gdje Gaṅgā, koja je dotaknula Gospodinova lotosova stopala, prvi put silazi na zemlju.","Uz svetu Gaṅgu","Haridvār, Prayāga, Kāśī, Gayā","Gaṅgā teče u ravnice. Na njezinim obalama Śrī Caitanya Mahāprabhu primio je inicijaciju i poučio Rūpu i Sanātanu.","Južna Indija","Tirumala, Ahobilam, Śrī Raṅgam, Uḍupī","Na putovanju južnom Indijom Śrī Caitanya posjetio je hramove Viṣṇua i Lakṣmī i posvuda nadahnuo ljude da pjevaju Hare Kṛṣṇa.","Zemlje dharme","Naimiṣāraṇya, Ayodhyā, Kurukṣetra, Dvārakā","Mjesta gdje je izgovoren Bhāgavatam, gdje je vladao Gospodin Rāma i gdje je Kṛṣṇa izgovorio Bhagavad-gītu.","Navadvīpa-dhāma","gdje se pojavio Śrī Caitanya","Navadvīpa ima devet otoka koji predstavljaju devet procesa predanog služenja. U Māyāpuru se pojavio Śrī Caitanya Mahāprabhu, Rādhā i Kṛṣṇa zajedno, koji je proširio pokret saṅkīrtane.","Jagannātha Purī","Śrī Kṣetra, gdje je Mahāprabhu živio 18 godina","U Purīju je Śrī Caitanya proveo posljednjih osamnaest godina, plesao pred kolima Ratha-yātre i kušao odvojenost od Kṛṣṇe u raspoloženju Rādhārāṇī.","Vraja – Vṛndāvana","vječno prebivalište Rādhe i Kṛṣṇe","Posljednja postaja je Vraja-dhāma, gdje Kṛṣṇa kao pastirski dječak vječno uživa s gopījama, kravama i Śrīmatī Rādhārāṇī. Ovdje se hodočašće ispunjava.","Matsya, Kūrma i Varāha","Nagalapuram, Śrīkūrmam, Tirumala, Śrīmuṣṇam","Daśāvatāra hodočašće prati daśāvatāru, deset Gospodinovih inkarnacija. Počinje kod hramova ribe Matsye, kornjače Kūrme i vepra Varāhe, koji su spasili Vede, planinu Mandaru i Zemlju.","Gospodin Narasiṁha","Siṁhācalam, Yādagirigutta, Ahobilam","Gospodin Narasiṁha zaštitio je Prahlādu Mahārāju. Strašan je prema nebhaktama, a nježan prema bhaktama, poput lavice prema mladuncima. Mahāprabhu Ga je slavio u Siṁhācalamu.","Vāmana i Rāma","Thrikkakara, Sīrkāḻi, Bhadrācalam, Triprayar, Orchha, Rāmeśvaram","Vāmana je zatražio od Bali Mahārāje tri koraka i dobio sve što je Bali imao, čak i njegovu glavu. Gospodin Rāma, idealni kralj, sagradio je most do Laṅke.","Kṛṣṇina Božanstva","Nāthdvārā, Jaipur, Karauli, Dakor, Dvārakā, Guruvāyūr, Pandharpur","Kṛṣṇa se otkriva svojim bhaktama u svojim Božanstvima: kao Gopāla Mādhavendri Purīju, kao Govinda, Gopīnātha i Madana-mohana Gosvāmījima i kao kralj Dvārake.","Ležeći Viṣṇu","Ananta Padmanābha, Ādi-keśava, Śrīraṅgapaṭṭaṇa, Śrī Raṅgam","Posljednja etapa vodi do Viṣṇua koji leži na Ananta-Śeṣi. Ovdje je Mahāprabhu pronašao Brahma-saṁhitu, koja slavi Govindu, izvornu Osobu Boga.","Gokula","Kṛṣṇine dječje zabave","Vraja-maṇḍala je zemlja Kṛṣṇinih zabava. Hodočašće počinje u Gokuli, gdje je Kṛṣṇa kao beba i dijete oslobađao demone i radovao majku Yaśodu.","Šume Vraje","Dvanaest šuma: Madhuvana, Tālavana, Kumudavana, Kāmyavana …","U šumama Vraje Kṛṣṇa i Balarāma s pastirskim dječacima čuvali su telad i krave, igrali se i pobjeđivali demone.","Govardhana i ljubav Vraje","Govardhana, Rādhā-kuṇḍa, Nandagrāma, Vṛndā-kuṇḍa, Vṛndāvana","Posljednja etapa vodi do Govardhane, Rādhā-kuṇḍe i Vṛndāvane, gdje se otkriva čista ljubav stanovnika Vraje prema Kṛṣṇi.","Antardvīpa – Māyāpur","TOVP, Yogapīṭha, Śrīvāsa-aṅgana, Prabhupādin samādhi","Navadvīpa-maṇḍala parikramā počinje u Antardvīpi, gdje se pojavio Śrī Caitanya Mahāprabhu. Devet otoka Navadvīpe predstavlja devet procesa predanog služenja. Najveći naglasak je Hram vedskog planetarija (TOVP), Śrī Māyāpur Candrodaya Mandir.","Osam otoka Navadvīpe","Sīmanta, Godruma, Madhya, Kola, Ṛtu, Jahnu, Modadruma, Rudra","Parikramā prelazi Gaṅgu i vodi oko ostalih osam otoka, od Sīmantadvīpe do Rudradvīpe.","Ekacakrā","rodno mjesto Nityānande Prabhua","Ekacakrā u Rāḍha-deśi je mjesto gdje se pojavio Nityānanda Prabhu, sam Balarāma, koji svima daje milost.","Jagannātha Purī parikramā","Guṇḍicā, Siddha-bakula, Ṭoṭā-gopīnātha, Narendra-sarovara, Ālālanātha","Śrī Kṣetra je puna mjesta gdje je Mahāprabhu osamnaest godina živio sa svojim bhaktama: od hrama Guṇḍicā do Haridāsina samādhija uz more.","Navadvīpa-maṇḍala parikramā","Devet otoka Navadvīpe predstavlja devet procesa predanog služenja: Antardvīpa ātma-nivedanam, Sīmantadvīpa śravaṇam, Godrumadvīpa kīrtanam, Madhyadvīpa smaraṇam, Koladvīpa pāda-sevanam, Ṛtudvīpa arcanam, Jahnudvīpa vandanam, Modadrumadvīpa dāsyam i Rudradvīpa sakhyam. Najveći naglasak Navadvīpa-dhāme je Hram vedskog planetarija (TOVP), koji je zamislio Śrīla Prabhupāda.","Gaura-maṇḍala","Hodočasnici neka posjete svako mjesto povezano sa zabavama Gospodina Caitanye Mahāprabhua i Njegovih pratitelja, čak i ona gdje je boravio samo kratko. Prema svetim spisima Navadvīpa-Māyāpur je duhovno jednak Vṛndāvani.","Śrīla Prabhupāda i Māyāpur","Śrīla Prabhupāda, osnivač-ācārya ISKCON-a, proširio je Bhagavad-gītu i bhakti-yogu po cijelom svijetu i uspostavio Śrī Māyāpur-dhāmu kao svjetsko duhovno sjedište ISKCON-a. ISKCON je osnovao u srpnju 1966.","Guru-paramparā","Guru-paramparā je učenički slijed kojim se vedsko znanje prenosi od Kṛṣṇe preko Brahme do današnjih učitelja; Bhagavad-gītā (4.2) kaže da se taj slijed s vremenom prekinuo. Śrīla Prabhupāda naglašava slijeđenje guruovih uputa umjesto izmišljanja novih tumačenja.","Ekacakrā parikramā","Ekacakrā u okrugu Birbhum, oko 20 km od Rampurhata, rodno je mjesto Nityānande Prabhua. Hodočasnici posjećuju Garbhavāsu, hram Baṅkima Rāya, Kadamba-khaṇḍī-ghāṭu, Hāṅṭugāḍu, Pāṇḍava-talu, Bakula-talu i jezerce Padmāvatī.","Parikramā Śrī Kṣetre vodi od Jagannāthina hrama Velikom cestom do hrama Guṇḍicā, do Siddha-bakule, Haridāsina samādhija uz more, Ṭoṭā-gopīnāthe, Narendra-sarovare i do Ālālanāthe u Brahmagiriju.","Vraja-maṇḍala parikramā","Vraja-maṇḍala je zemlja Kṛṣṇinih zabava: Gokula, šume Vraje, Govardhana, Rādhā-kuṇḍa, Varṣāṇā, Nandagrāma i Vṛndāvana s Yamunom.","Mahāprabhuovo putovanje južnom Indijom","Nakon prihvaćanja sannyāse Śrī Caitanya je iz Purīja otišao na jug i posvuda nadahnuo ljude da pjevaju Hare Kṛṣṇa. Prikazana su samo mjesta iz ove igre, redom iz Caitanya-caritāmṛte.","Mahāprabhuovo putovanje u Vṛndāvanu","Śrī Caitanya je otišao u Vṛndāvanu kroz šumu Jhārikhaṇḍa. Na povratku je poučio Rūpu Gosvāmīja u Prayāgi i Sanātanu Gosvāmīja u Kāśīju."];

o glavo. Gospod Rāma je kot idealni kralj zgradil most na Laṅko.", "Kṛṣṇova Božanstva", "Nāthdvārā, Jaipur, Karauli, Ḍākor, Dvārakā, Guruvāyūr, Paṇḍharpur", "Kṛṣṇa se v Božanstvih razodeva svojim bhaktam: kot Gopāla Mādhavendri Purīju, kot Govinda, Gopīnātha in Madana-mohana Gosvāmījem in kot kralj Dvārake.", "Ležeči Viṣṇu", "Ananta Padmanābha, Ādi-keśava, Śrīraṅgapaṭṭaṇa, Śrī Raṅgam", "Zadnja stopnja vodi k Viṣṇuju, ki leži na Ananta-Śeṣi. Tu je Mahāprabhu našel Brahma-saṁhito, ki opeva Govindo, izvorno Osebnost Božanstva.", "Gokula", "Kṛṣṇove otroške zabave", "Vraja-maṇḍala je dežela Kṛṣṇovih zabav. Romanje se začne v Gokuli, kjer je Kṛṣṇa kot dojenček in otrok osvobajal demone in razveseljeval mater Yaśodo.", "Gozdovi Vraje", "Dvanajst gozdov: Madhuvana, Tālavana, Kumudavana, Kāmyavana …", "V gozdovih Vraje sta Kṛṣṇa in Balarāma s pastirčki pasla teleta in krave, se igrala in premagovala demone.", "Govardhana in ljubezen Vraje", "Govardhana, Rādhā-kuṇḍa, Nandagrāma, Vṛndā-kuṇḍa, Vṛndāvana", "Zadnja stopnja vodi h Govardhani, k Rādhā-kuṇḍi in v Vṛndāvano, kjer se razodeva čista ljubezen prebivalcev Vraje do Kṛṣṇe.", "Antardvīpa – Māyāpur", "TOVP, Yogapīṭha, Śrīvāsa-aṅgana, Prabhupādov samādhi", "Navadvīpa-maṇḍala parikramā se začne v Antardvīpi, kjer se je pojavil Śrī Caitanya Mahāprabhu. Devet otokov Navadvīpe predstavlja devet procesov vdanega služenja. Največji poudarek je Tempelj vedskega planetarija (TOVP), Śrī Māyāpur Candrodaya Mandir.", "Osem otokov Navadvīpe", "Sīmanta, Godruma, Madhya, Kola, Ṛtu, Jahnu, Modadruma, Rudra", "Parikramā vodi čez Gaṅgo po ostalih osmih otokih, od Sīmantadvīpe do Rudradvīpe.", "Ekacakrā", "rojstni kraj Nityānande Prabhuja", "Ekacakrā v Rāḍha-deśi je kraj, kjer se je pojavil Nityānanda Prabhu, Balarāma sam, ki deli milost vsem.", "Jagannātha Purī parikramā", "Guṇḍicā, Siddha-bakula, Ṭoṭā-gopīnātha, Narendra-sarovara, Ālālanātha", "Śrī Kṣetra je poln krajev, kjer je Mahāprabhu osemnajst let živel z bhaktami: od templja Guṇḍicā d
